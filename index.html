<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>2026 대구 학사일정 · 시험일정 찾기</title>
<style>
:root{
  --bg:#f6f8f8; --surface:#fff; --surface2:#eef3f2; --line:#dde5e3;
  --ink:#16211f; --ink2:#4a5c58; --muted:#7d908b;
  --teal:#0f7766; --teal-l:#168f7a; --teal-bg:#e6f2ef;
  --gold:#8a6d1f; --gold-bg:#f7f0dc; --red:#a33a3a; --red-bg:#f7e6e6;
  --blue:#2b5f8a; --blue-bg:#e6eef5; --star:#c9a227;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;
  font-size:15px;line-height:1.55;-webkit-text-size-adjust:100%}
header{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.hin{max-width:1080px;margin:0 auto;padding:14px 16px 12px}
.htop{display:flex;align-items:flex-start;gap:10px}
h1{margin:0 0 3px;font-size:17px;font-weight:800;letter-spacing:-.02em}
.sub{font-size:12px;color:var(--muted);margin-bottom:11px}
.btn{padding:8px 13px;font-size:13px;font-weight:700;border:1px solid var(--teal);
  background:var(--teal);color:#fff;border-radius:9px;cursor:pointer;white-space:nowrap}
.btn.ghost{background:var(--surface);color:var(--teal);border-color:var(--line)}
.btn:disabled{opacity:.4;cursor:default}
.searchrow{display:flex;gap:8px;align-items:center}
#q{flex:1;min-width:0;padding:11px 13px;font-size:15px;border:1.5px solid var(--line);
  border-radius:10px;background:var(--surface);color:var(--ink);outline:none}
#q:focus{border-color:var(--teal-l)}
.clr{padding:11px 12px;font-size:13px;border:1px solid var(--line);background:var(--surface);
  border-radius:10px;color:var(--ink2);cursor:pointer;white-space:nowrap}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px;align-items:center}
.chip{padding:6px 12px;font-size:13px;font-weight:700;border:1px solid var(--line);
  border-radius:999px;background:var(--surface);color:var(--ink2);cursor:pointer}
.chip.on{background:var(--teal);border-color:var(--teal);color:#fff}
.chip.fav.on{background:var(--star);border-color:var(--star);color:#3a2f06}
select{padding:6px 10px;font-size:13px;border:1px solid var(--line);border-radius:999px;
  background:var(--surface);color:var(--ink2)}
.count{font-size:12px;color:var(--muted);margin-left:auto}
main{max-width:1080px;margin:0 auto;padding:14px 16px 60px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(258px,1fr));gap:10px}
.card{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:13px 40px 13px 14px;cursor:pointer}
.card:hover{border-color:var(--teal-l)}
.star{position:absolute;top:9px;right:9px;width:30px;height:30px;border:none;background:transparent;
  font-size:19px;line-height:1;color:#cfd8d5;cursor:pointer;padding:0}
.star.on{color:var(--star)}
.cname{font-size:15px;font-weight:800;letter-spacing:-.02em}
.ctag{margin-top:5px;display:flex;gap:5px;flex-wrap:wrap}
.tag{font-size:11px;font-weight:700;padding:2px 7px;border-radius:5px;background:var(--surface2);color:var(--ink2)}
.tag.lv{background:var(--teal-bg);color:var(--teal)}
.tag.bk{background:var(--gold-bg);color:var(--gold)}
.cnext{margin-top:9px;padding-top:9px;border-top:1px dashed var(--line);font-size:12.5px;color:var(--ink2)}
.cnext b{color:var(--teal);font-weight:800}
.empty{padding:50px 16px;text-align:center;color:var(--muted);font-size:14px;line-height:1.9}
.dday{display:inline-block;margin-left:6px;font-size:11px;font-weight:800;padding:1px 6px;border-radius:5px}
.dd-soon{background:var(--red-bg);color:var(--red)}
.dd-near{background:var(--gold-bg);color:var(--gold)}
.dd-far{background:var(--surface2);color:var(--muted)}
.dd-done{background:var(--surface2);color:var(--muted)}
.none{color:var(--muted)}
/* 패널 공통 */
.sheet{position:fixed;inset:0;background:rgba(16,28,26,.42);display:none;z-index:40}
.sheet.on{display:block}
.panel{position:absolute;left:50%;transform:translateX(-50%);top:26px;bottom:26px;width:min(720px,calc(100% - 24px));
  background:var(--surface);border-radius:14px;overflow:auto}
.panel.sm{bottom:auto;max-height:calc(100% - 52px);width:min(480px,calc(100% - 24px))}
.ph{position:sticky;top:0;background:var(--surface);border-bottom:1px solid var(--line);padding:15px 18px 12px;display:flex;gap:10px;align-items:flex-start;z-index:2}
.ph h2{margin:0;font-size:18px;font-weight:800;letter-spacing:-.02em}
.x{margin-left:auto;border:1px solid var(--line);background:var(--surface);border-radius:8px;
  width:30px;height:30px;font-size:16px;color:var(--ink2);cursor:pointer;flex:none}
.pb{padding:14px 18px 26px}
.dfil{margin-top:7px}
.flabel{font-size:12px;font-weight:800;color:var(--muted);margin-right:2px;letter-spacing:.04em}
.chip.dep.on{background:var(--gold);border-color:var(--gold);color:#3a2f06}
.dfil .hint{margin:0 0 0 4px}
.dsec{font-size:12px;font-weight:800;color:var(--teal);background:var(--teal-bg);
  display:inline-block;padding:2px 9px;border-radius:6px;margin:10px 0 4px}
.dtab{display:flex;gap:5px;margin-bottom:11px;flex-wrap:wrap}
.dtab button{padding:6px 15px;font-size:13.5px;font-weight:800;border:1px solid var(--line);
  background:var(--surface);border-radius:8px;color:var(--ink2);cursor:pointer}
.dtab button.on{background:var(--ink);border-color:var(--ink);color:#fff}
.gtab{display:flex;gap:6px;margin-bottom:13px}
.gtab.wrap{flex-wrap:wrap}
.gtab.wrap button{padding:6px 11px;font-size:12.5px}
.gtab button{padding:6px 13px;font-size:13px;font-weight:700;border:1px solid var(--line);
  background:var(--surface);border-radius:999px;color:var(--ink2);cursor:pointer}
.gtab button.on{background:var(--teal);border-color:var(--teal);color:#fff}
h3{margin:17px 0 8px;font-size:12px;font-weight:800;color:var(--muted);letter-spacing:.06em}
h3:first-child{margin-top:0}
table{width:100%;border-collapse:collapse;font-size:13.5px}
td{padding:8px 2px;border-bottom:1px solid var(--line);vertical-align:top}
td:first-child{width:104px;color:var(--ink2);font-weight:700}
.notice{background:var(--blue-bg);color:var(--blue);border-radius:9px;padding:11px 13px;font-size:13px;line-height:1.6}
.bkrow td:first-child{width:88px}
.ht{margin:0 0 4px;font-size:14px;line-height:1.75;color:var(--ink2)}
.ht b{color:var(--ink)}
.hnote{display:inline-block;margin-top:4px;font-size:13px;color:var(--gold);font-weight:700}
#hpanel h3{margin-top:20px}
.bnote{font-size:12px;color:var(--gold);font-weight:700;margin-top:6px}
.pub{display:inline-block;font-size:11px;font-weight:700;padding:0 5px;border-radius:4px;background:var(--surface2);color:var(--muted);margin-left:2px}
.sem{display:inline-block;font-size:10.5px;font-weight:800;padding:1px 5px;border-radius:4px;margin-right:5px;vertical-align:1px}
.sem.s1{background:var(--teal-bg);color:var(--teal)}
.sem.s2{background:#e4eef7;color:var(--blue)}
.nsec{font-size:12px;font-weight:800;color:var(--teal);margin:12px 0 4px;letter-spacing:.03em}
.nline{font-size:13px;line-height:1.9;color:var(--ink2)}
.nline b{color:var(--ink);font-weight:800;margin-right:2px}
.nline.sm{font-size:12.5px;color:var(--muted)}
.nline.sm b{color:var(--ink2);font-weight:700}
.ntbl td:first-child{width:130px}
.okmark{font-size:11.5px;font-weight:700;color:var(--teal);background:var(--teal-bg);padding:1px 6px;border-radius:5px;margin-left:5px}
.difmark{font-size:11.5px;font-weight:800;color:var(--red);background:var(--red-bg);padding:1px 6px;border-radius:5px;margin-left:5px}
.rng{margin-top:5px;padding:7px 9px;background:var(--surface2);border-radius:7px;font-size:12.5px;line-height:1.65}
.rng b{color:var(--teal);font-weight:800;margin-right:3px}

/* 상세 — 오른쪽에 NEIS 달력 칸 */
.panel.wide{width:min(1140px,calc(100% - 24px))}
.pcols{display:flex;align-items:flex-start}
.pb{flex:1 1 auto;min-width:0}
.pside{flex:0 0 0;width:0;overflow:hidden;transition:none;border-left:1px solid var(--line);
  padding:0;align-self:stretch;background:#fbfcfc}
.panel.wide .pside{flex:0 0 430px;width:430px;padding:14px 16px 22px}
.topbar{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-bottom:13px}
.topbar .btn{margin-left:auto;padding:7px 13px;font-size:12.5px}
.nshead{display:flex;align-items:baseline;gap:8px;margin-bottom:9px}
.nshead b{font-size:14px;font-weight:800}
/* 작은 달력 12장 */
.mctip{background:var(--surface2);border-radius:8px;padding:9px 12px;font-size:12.5px;
  color:var(--muted);line-height:1.55;margin-top:12px;min-height:38px}
.mctip.on{background:var(--teal-bg);color:var(--teal)}
.mctip b{color:var(--ink);font-weight:800;margin-right:4px}
.mctip.on b{color:var(--teal)}
table.mct td.has{cursor:pointer}
table.mct td.sel{outline:2px solid var(--ink);outline-offset:-2px}
.mcwrap{display:grid;grid-template-columns:repeat(3,1fr);gap:9px 8px;margin-top:9px}
.mc{background:#fff;border:1px solid var(--line);border-radius:7px;padding:5px 5px 6px}
.mch{font-size:11px;font-weight:800;color:var(--ink2);text-align:center;margin-bottom:3px}
table.mct{width:100%;border-collapse:collapse;table-layout:fixed}
table.mct th{font-size:8.5px;font-weight:700;color:var(--muted);padding:0 0 2px;line-height:1}
table.mct th.s{color:#a33a3a} table.mct th.a{color:#2b5f8a}
table.mct td{font-size:9.5px;text-align:center;padding:1.5px 0;line-height:1.25;
  color:var(--ink2);border-radius:3px}
table.mct td.o{color:transparent}
table.mct td.e-exam{background:#f9dcdc;color:#8f2f2f;font-weight:800}
table.mct td.e-vac{background:#d9ece7;color:#0d6858;font-weight:800}
table.mct td.e-mock{background:#fce7d2;color:#8c4b0e;font-weight:800}
table.mct td.e-etc{background:#e8ecec;color:#5b6b68;font-weight:700}
.mcleg{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:10px}
.lg{font-size:11px;font-weight:800;padding:2px 8px;border-radius:5px}
.lg.e-exam{background:#f9dcdc;color:#8f2f2f} .lg.e-vac{background:#d9ece7;color:#0d6858}
.lg.e-mock{background:#fce7d2;color:#8c4b0e} .lg.e-etc{background:#e8ecec;color:#5b6b68}
@media(max-width:900px){
  .panel.wide{width:min(720px,calc(100% - 24px))}
  .pcols{flex-direction:column}
  .panel.wide .pside{flex:1 1 auto;width:100%;border-left:none;border-top:1px solid var(--line)}
  .mcwrap{grid-template-columns:repeat(2,1fr)}
}

/* 내보내기 폼 */
.fl{display:block;font-size:12px;font-weight:800;color:var(--muted);margin:15px 0 6px;letter-spacing:.04em}
.fl:first-child{margin-top:0}
input[type=text],input[type=password],input[type=email]{width:100%;padding:10px 12px;font-size:14px;
  border:1.5px solid var(--line);border-radius:9px;outline:none;background:var(--surface);color:var(--ink)}
input[type=text]:focus,input[type=password]:focus,input[type=email]:focus{border-color:var(--teal-l)}
/* 4자리 비밀번호 — 가운데에 크게 */
input.pin{text-align:center;letter-spacing:.55em;text-indent:.55em;font-size:19px;font-weight:700;padding:11px 12px}
.radio{display:flex;flex-direction:column;gap:7px}
.radio label,.checks label{display:flex;gap:8px;align-items:center;font-size:14px;cursor:pointer}
.checks{display:flex;gap:14px;flex-wrap:wrap}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:26px;z-index:900;
  background:var(--ink);color:#fff;padding:12px 18px;border-radius:11px;font-size:14px;font-weight:700;
  box-shadow:0 6px 24px rgba(0,0,0,.28);display:none;max-width:calc(100% - 32px);cursor:pointer}
#toast.on{display:block}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--red);
  margin-left:6px;vertical-align:2px}
#asheet{z-index:600}   /* 문(#gate)보다 위에 떠야 관리자가 들어올 수 있다 */
#gate{display:none;position:fixed;inset:0;z-index:500;background:var(--bg);
  align-items:center;justify-content:center;padding:18px;overflow:auto}
#gate .panel{max-width:430px;width:100%;max-height:none}
.cuts{display:flex;gap:7px;flex-wrap:wrap;margin-top:2px}
.cuts label{display:flex;align-items:center;gap:5px}
.cuts label span{font-size:11.5px;font-weight:800;color:var(--muted);width:11px;text-align:right}
.cuts input{width:62px;text-align:center;padding:8px 6px}
.sctbl td{font-size:13px}
.sctbl td:first-child{width:118px}
.scnum{font-weight:800;color:var(--teal)}
.admonly{border:1.5px dashed var(--gold);border-radius:10px;padding:11px 13px;margin-top:10px;background:var(--gold-bg)}
.admonly .aotag{font-size:11px;font-weight:800;color:var(--gold);letter-spacing:.04em}
/* 통계 화면 */
.scard{background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:16px 17px;margin-top:12px}
.ct{font-size:15.5px;font-weight:800;letter-spacing:-.02em;margin:0}
.cd{font-size:12.5px;color:var(--muted);margin:4px 0 13px;line-height:1.65}
.bar{display:grid;grid-template-columns:150px 1fr 64px;gap:10px;align-items:center;margin-bottom:7px}
.bar .nm{font-size:13px;font-weight:700;color:var(--ink2);text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .tr{background:var(--surface2);border-radius:0 4px 4px 0;height:20px}
.bar .fl{height:20px;border-radius:0 4px 4px 0}
.bar .vl{font-size:12.5px;font-weight:800;color:var(--ink2)}
.bar .vl small{font-weight:600;color:var(--muted)}
#tpanel th{text-align:left;font-size:11.5px;font-weight:800;color:var(--muted);letter-spacing:.04em;
  padding:0 6px 7px;border-bottom:1px solid var(--line)}
#tpanel td{padding:9px 6px;border-bottom:1px solid var(--line);vertical-align:middle;font-size:13.5px}
#tpanel td.n{font-weight:800;color:var(--teal);text-align:right}
#tpanel td.rk{width:26px;color:var(--muted);font-weight:800;font-size:12px}
#tpanel td.more{color:var(--muted);font-size:12.5px}
.hero{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:2px}
.st{flex:1;min-width:126px;background:var(--surface2);border-radius:11px;padding:12px 14px}
.st .k{font-size:11.5px;font-weight:800;color:var(--muted);letter-spacing:.04em}
.st .v{font-size:24px;font-weight:800;letter-spacing:-.03em;margin-top:2px;color:var(--teal)}
.st .u{font-size:12px;color:var(--muted);margin-left:3px;font-weight:600}
.fil{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:12px;padding:10px 11px;
  background:var(--surface2);border-radius:10px}
.fil .lb{font-size:11.5px;font-weight:800;color:var(--muted)}
.fil select{padding:6px 10px;font-size:13px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink)}
.empty2{padding:24px 10px;text-align:center;color:var(--muted);font-size:13.5px;line-height:1.9;
  border:1.5px dashed var(--line);border-radius:10px}
.warn{background:var(--gold-bg);color:var(--gold);border-radius:9px;padding:11px 13px;font-size:12.5px;line-height:1.75;margin-top:12px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:760px){.two{grid-template-columns:1fr}.bar{grid-template-columns:106px 1fr 56px}}
.note{font-size:11.5px;color:var(--muted);margin-top:8px}
.mrow{display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:10px 12px;border:1.5px solid var(--line);border-radius:9px;margin-top:8px}
.mrow .btn{padding:7px 14px;font-size:13px;flex:none}
.showme{display:flex;gap:9px;align-items:center;font-size:14px;font-weight:600;cursor:pointer;
  margin-top:10px;padding:10px 12px;border:1.5px solid var(--line);border-radius:9px;background:var(--surface2)}
.showme input{width:17px;height:17px;flex:none;cursor:pointer}
.hint{font-size:12px;color:var(--muted);margin-top:6px;line-height:1.6}
.acts{display:flex;gap:8px;margin-top:20px}
.acts .btn{flex:1;padding:12px}
footer{max-width:1080px;margin:0 auto;padding:0 16px 40px;font-size:11.5px;color:var(--muted);line-height:1.7}
@media(max-width:520px){ .grid{grid-template-columns:1fr} .panel{top:0;bottom:0;border-radius:0;width:100%}
  .panel.sm{top:auto;bottom:0;border-radius:14px 14px 0 0} }

/* 보기 전환 */
.viewtab{display:flex;gap:6px;margin-top:9px}
.vt{padding:6px 16px;font-size:13px;font-weight:800;border:1px solid var(--line);
  border-radius:999px;background:var(--surface);color:var(--ink2);cursor:pointer}
.vt.on{background:var(--ink);border-color:var(--ink);color:#fff}
/* 달력 */
.calhead{display:flex;align-items:center;gap:9px;margin-bottom:11px;flex-wrap:wrap}
.ctitle{font-size:17px;font-weight:800;letter-spacing:-.02em;min-width:118px;text-align:center}
.cnames{font-size:12px;color:var(--muted);flex:1 1 100%;line-height:1.6}
table.cal{width:100%;border-collapse:collapse;table-layout:fixed;background:var(--surface)}
table.cal th{padding:6px 2px;font-size:12px;font-weight:800;color:var(--ink2);
  background:var(--surface2);border:1px solid var(--line)}
table.cal th.sun,table.cal td.sun .dnum{color:#a33a3a}
table.cal th.sat,table.cal td.sat .dnum{color:#2b5f8a}
table.cal td{border:1px solid var(--line);vertical-align:top;padding:4px 4px 5px;height:96px}
table.cal td.out{background:#fafbfb}
table.cal td.out .dnum{color:#c8d2cf}
.dnum{font-size:12px;font-weight:800;color:var(--ink2);margin-bottom:3px}
.evs{display:flex;flex-direction:column;gap:2px}
.ev{font-size:11px;font-weight:600;padding:2.5px 5px;border-radius:4px;line-height:1.4;
  white-space:normal;word-break:keep-all}
.ev b{font-weight:800}
.ev span{font-weight:600;opacity:.75}
.ev.mid{background:#fdeee0;color:#9a5410}
.ev.fin{background:#f9e3e3;color:#a33a3a}
.ev.va{background:#e6f2ef;color:#0f7766}
.ev.op{background:#e4eef7;color:#2b5f8a}
.ev.mid.f{box-shadow:inset 2.5px 0 0 #c26a17}
.ev.fin.f{box-shadow:inset 2.5px 0 0 #a33a3a}
.callegend{display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap}
.callegend .ev{font-size:11.5px}
@media(max-width:640px){
  table.cal td{height:auto;min-height:52px;padding:3px 2px 4px}
  .ev{font-size:9px;padding:1.5px 3px;line-height:1.35}
  .dnum{font-size:10.5px}
}
/* 달력 인쇄 */
.calpage{page-break-inside:avoid}
.calpage.brk{page-break-after:always}
table.calp{font-size:8pt;margin-top:2mm}
table.calp th{border:.6pt solid #9aa8a4;background:#eef3f2;padding:2.4pt;font-size:8.4pt}
table.calp td{border:.6pt solid #c2cecb;height:auto;padding:2pt 2.4pt 3pt}
table.calp .dnum{font-size:8.4pt;margin-bottom:1.6pt}
table.calp .ev{font-size:7pt;padding:1.4pt 2.4pt;border-radius:2pt;line-height:1.32;font-weight:600}
table.calp .ev b{font-weight:800}
table.calp .ev.mid{background:#fdeee0;color:#8c4b0e}
table.calp .ev.fin{background:#f9e3e3;color:#963434}
table.calp .ev.va{background:#e6f2ef;color:#0d6858}
table.calp .ev.op{background:#e4eef7;color:#27567d}

/* ===== 인쇄 ===== */
#print{display:none}
@media print{
  body{background:#fff}
  /* 배경색·표 색이 인쇄에서 빠지지 않게 한다 */

<script>/* 라이브러리 없이 .xlsx 를 만든다 — ZIP(STORE) + 최소 SpreadsheetML.
   외부 CDN 에 기대지 않는다. 학교·학원 망에서 CDN 이 막혀도 동작한다. */
var MiniXlsx=(function(){
  var CRCT=(function(){var t=[],c,n,k;for(n=0;n<256;n++){c=n;for(k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0;}return t;})();
  function crc32(u8){var c=0xFFFFFFFF;for(var i=0;i<u8.length;i++)c=CRCT[(c^u8[i])&0xFF]^(c>>>8);return (c^0xFFFFFFFF)>>>0;}
  var enc=new TextEncoder();
  function esc(s){return String(s==null?'':s).replace(/[&<>]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;'}[c];})
    .replace(/[\x00-\x08\x0B\x0C\x0E-\x1F]/g,'');}
  function col(n){var s='';n++;while(n>0){var m=(n-1)%26;s=String.fromCharCode(65+m)+s;n=(n-m-1)/26;}return s;}
  function sheetXml(aoa,widths){
    var x='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
      +'<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">';
    if(widths&&widths.length){ x+='<cols>'+widths.map(function(w,i){
      return '<col min="'+(i+1)+'" max="'+(i+1)+'" width="'+w+'" customWidth="1"/>';}).join('')+'</cols>'; }
    x+='<sheetData>';
    aoa.forEach(function(row,r){
      x+='<row r="'+(r+1)+'">';
      row.forEach(function(v,c){
        if(v==null||v==='') return;
        var ref=col(c)+(r+1), st=r===0?' s="1"':'';
        if(typeof v==='number'&&isFinite(v)) x+='<c r="'+ref+'"'+st+'><v>'+v+'</v></c>';
        else x+='<c r="'+ref+'" t="inlineStr"'+st+'><is><t xml:space="preserve">'+esc(v)+'</t></is></c>';
      });
      x+='</row>';
    });
    x+='</sheetData></worksheet>';
    return x;
  }
  var STYLES='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
    +'<styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">'
    +'<fonts count="2"><font><sz val="11"/><name val="맑은 고딕"/></font>'
    +'<font><b/><sz val="11"/><color rgb="FF0F7766"/><name val="맑은 고딕"/></font></fonts>'
    +'<fills count="3"><fill><patternFill patternType="none"/></fill>'
    +'<fill><patternFill patternType="gray125"/></fill>'
    +'<fill><patternFill patternType="solid"><fgColor rgb="FFE6F2EF"/><bgColor indexed="64"/></patternFill></fill></fills>'
    +'<borders count="2"><border/><border><bottom style="thin"><color rgb="FF9AA8A4"/></bottom></border></borders>'
    +'<cellStyleXfs count="1"><xf/></cellStyleXfs>'
    +'<cellXfs count="2"><xf xfId="0"/>'
    +'<xf xfId="0" fontId="1" fillId="2" borderId="1" applyFont="1" applyFill="1" applyBorder="1">'
    +'<alignment horizontal="center" vertical="center"/></xf></cellXfs></styleSheet>';
  function build(files){                       // [{name, data:Uint8Array}]
    var chunks=[], cd=[], off=0;
    files.forEach(function(f){
      var nm=enc.encode(f.name), c=crc32(f.data), n=f.data.length;
      var lh=new Uint8Array(30+nm.length), dv=new DataView(lh.buffer);
      dv.setUint32(0,0x04034b50,true); dv.setUint16(4,20,true); dv.setUint16(6,0x0800,true);
      dv.setUint16(8,0,true); dv.setUint16(10,0,true); dv.setUint16(12,0x2821,true);
      dv.setUint32(14,c,true); dv.setUint32(18,n,true); dv.setUint32(22,n,true);
      dv.setUint16(26,nm.length,true); dv.setUint16(28,0,true); lh.set(nm,30);
      chunks.push(lh, f.data);
      var ch=new Uint8Array(46+nm.length), dv2=new DataView(ch.buffer);
      dv2.setUint32(0,0x02014b50,true); dv2.setUint16(4,20,true); dv2.setUint16(6,20,true);
      dv2.setUint16(8,0x0800,true); dv2.setUint16(10,0,true);
      dv2.setUint16(12,0,true); dv2.setUint16(14,0x2821,true);
      dv2.setUint32(16,c,true); dv2.setUint32(20,n,true); dv2.setUint32(24,n,true);
      dv2.setUint16(28,nm.length,true); dv2.setUint32(42,off,true); ch.set(nm,46);
      cd.push(ch); off+=lh.length+n;
    });
    var cdLen=cd.reduce(function(a,b){return a+b.length;},0);
    var end=new Uint8Array(22), dve=new DataView(end.buffer);
    dve.setUint32(0,0x06054b50,true); dve.setUint16(8,files.length,true); dve.setUint16(10,files.length,true);
    dve.setUint32(12,cdLen,true); dve.setUint32(16,off,true);
    var all=chunks.concat(cd,[end]);
    var total=all.reduce(function(a,b){return a+b.length;},0), out=new Uint8Array(total), p=0;
    all.forEach(function(u){ out.set(u,p); p+=u.length; });
    return out;
  }
  function download(aoa, widths, filename, sheetName){
    var F=[
     {name:'[Content_Types].xml', data:enc.encode('<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
      +'<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">'
      +'<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>'
      +'<Default Extension="xml" ContentType="application/xml"/>'
      +'<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>'
      +'<Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>'
      +'<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>'
      +'</Types>')},
     {name:'_rels/.rels', data:enc.encode('<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
      +'<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'
      +'<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/>'
      +'</Relationships>')},
     {name:'xl/workbook.xml', data:enc.encode('<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
      +'<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" '
      +'xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">'
      +'<sheets><sheet name="'+esc(sheetName||'Sheet1')+'" sheetId="1" r:id="rId1"/></sheets></workbook>')},
     {name:'xl/_rels/workbook.xml.rels', data:enc.encode('<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
      +'<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'
      +'<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/>'
      +'<Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/>'
      +'</Relationships>')},
     {name:'xl/styles.xml', data:enc.encode(STYLES)},
     {name:'xl/worksheets/sheet1.xml', data:enc.encode(sheetXml(aoa,widths))}
    ];
    var blob=new Blob([build(F)],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
    var a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=filename; a.click();
    setTimeout(function(){URL.revokeObjectURL(a.href);},2000);
  }
  return {download:download, _build:build, _sheetXml:sheetXml};
})();
</script>
<script>/* ===== 교과와 과목 ===== */
var DEPTS = ['수학','국어','영어','사회','과학'];

var SUBJ_BY_DEPT = {

  },
  '중': {}   // 중학교는 「{교과} {N}학년」 꼴로 만든다 (아래 midSubjects)
};
DEPTS.forEach(function(d){
  SUBJ_BY_DEPT['중'][d] = ['1학년','2학년','3학년'].map(function(g){ return d+' '+g; });
});

/* 과목 이름 → 교과 */
var _DEPT_OF = (function(){
  var m={};
  ['고','중'].forEach(function(lv){
    DEPTS.forEach(function(d){
      (SUBJ_BY_DEPT[lv][d]||[]).forEach(function(s){ m[s]=d; });
    });
  });
  return m;
})();
function deptOf(subject){
  if(_DEPT_OF[subject]) return _DEPT_OF[subject];
  for(var i=0;i<DEPTS.length;i++){ if(subject.indexOf(DEPTS[i])===0) return DEPTS[i]; }
  return '기타';
}
function subjectsFor(lvl, dept){
  return (SUBJ_BY_DEPT[lvl==='중'?'중':'고'][dept]||[]).slice();
}

/* 지난 학년도(2015 개정) 과목 — 2025학년도 고2·고3이 배운 것 */

  '사회': ['한국사','통합사회','생활과 윤리','윤리와 사상','한국지리','세계지리','세계사','동아시아사',
           '경제','정치와 법','사회\u00b7문화','사회문제 탐구','여행지리'],
  '과학': ['통합과학','과학탐구실험','물리학I','물리학II','화학I','화학II',
           '생명과학I','생명과학II','지구과학I','지구과학II','과학사','생활과 과학','융합과학']
};
/* 학년도 — 앞의 것이 기본 */
var YEARS = ['2026','2025'];

/* 그 학년도 그 학년이 몇 등급제인가 (0 = 등급 없음) */
function cutCount(lvl, grade, year){
  if(lvl!=='고') return 0;
  if(String(year)==='2025') return grade==='1' ? 5 : 9;   // 2025 — 고1만 2022 개정
  return grade==='3' ? 9 : 5;                              // 2026 — 고3만 2015 개정
}

/* 고1은 전국이 같다 — 교과마다 1학기 · 2학기 공통·통합 과목 */

<script>/* ===== 윗층 저장소 — 선생님이 고친 것을 모두가 보게 한다 =====

var STORE=(function(){
  var P=(typeof FB_PROJECT!=='undefined'&&FB_PROJECT)?FB_PROJECT:'';
  var K=(typeof FB_KEY!=='undefined'&&FB_KEY)?FB_KEY:'';

  var okRead=false;

          });

        });
    }
    return page('').then(function(){
      all.sort(function(a,b){ return a._at<b._at?-1:(a._at>b._at?1:0); });   // 나중 것이 이긴다
      LOG=all; okRead=true;
      all.forEach(apply);
      return all.length;
    }).catch(function(){ okRead=false; return 0; });
  }

  /* ---------- 보내기 ---------- */
  function add(body){
    if(!on()) return Promise.reject(0);
    var at=new Date().toISOString();
    var payload={fields:{j:{stringValue:JSON.stringify(body)}, at:{stringValue:at}}};
    return fetch(base()+'?key='+encodeURIComponent(K),
        {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)})
      .then(function(r){ if(!r.ok) throw 0; return r.json(); })
      .then(function(){
        var c=JSON.parse(JSON.stringify(body)); c._at=at;
        LOG.push(c); apply(c);           // 보낸 사람 화면에 바로 보이게
        return true;
      });
  }

  /* ---------- 화면 자료에 얹기 ---------- */
  function who(b){ return b.show===false ? '익명' : (b.name+(b.org?' ('+b.org+')':'')); }

  function apply(b){
    if(!b||!b.school) return;
    try{
      if(b.kind==='book')      applyBook(b);
      else if(b.kind==='subj') applySubj(b);
      else if(b.kind==='rng')  applyRng(b);
      else if(b.kind==='exam') applyExam(b);
      else if(b.kind==='score')applyScore(b);
    }catch(e){}
  }

  function applyBook(b){
    var subs=b.subjects||[]; if(!subs.length) return;
    if(b.pub){                                   // 교과서 출판사
      var t=DATA.textbook[b.school]||(DATA.textbook[b.school]={});
      subs.forEach(function(s){ t[s]=b.pub; });
    }
    var g=b.grade||'1', sem=b.sem||'';
    var bs=DATA.books[b.school]||(DATA.books[b.school]={});
    var slot=bs[g]||(bs[g]={items:[],note:''});
    if(!slot.items) slot.items=[];
    subs.forEach(function(s){
      var hit=null;
      for(var i=0;i<slot.items.length;i++){
        if(slot.items[i][0]===s && (!sem || !slot.items[i][2] || slot.items[i][2]===sem)){ hit=i; break; }
      }
      var row=[s, b.book||'', sem];
      if(hit==null) slot.items.push(row); else slot.items[hit]=row;
    });
    stamp(b);
  }

  function applySubj(b){
    var s=DATA.subjects[b.school]||(DATA.subjects[b.school]={});
    var g=b.grade||'2';
    s[g]={'1':(b.sj1||[]).slice(), '2':(b.sj2||[]).slice()};
    stamp(b);
  }

  function applyRng(b){
    var r=DATA.ranges[b.school]||(DATA.ranges[b.school]={});
    var g=b.grade||'2'; var slot=r[g]||(r[g]={});
    var out=[];
    (b.ranges||'').split('\n').forEach(function(ln){
      ln=ln.trim(); if(!ln) return;
      var i=ln.indexOf(':');
      if(i<0) out.push([ln,'']); else out.push([ln.slice(0,i).trim(), ln.slice(i+1).trim()]);
    });
    slot[String(b.exam)]=out;
    stamp(b);
  }

  function applyExam(b){
    var rows=DATA.schools.filter(function(x){ return x.name===b.school && x.lvl===b.lvl; });
    var r=rows[b.gradeIdx||0]; if(!r) return;
    if(!r.ex) r.ex=[[],[],[],[]];
    r.ex[b.exam]= b.start? [b.start, b.end||b.start] : [];
    stamp(b);
  }

  /* 등급컷 · 평균 — DATA.scores[학교][학년][학기+시험][과목] */
  function applyScore(b){
    if(!DATA.scores) DATA.scores={};
    var s=DATA.scores[b.school]||(DATA.scores[b.school]={});
    var y=s[b.year||'2026']||(s[b.year||'2026']={});
    var g=y[b.grade||'1']||(y[b.grade||'1']={});
    var k=(b.sem||'1')+(b.exam||'중간');
    var e=g[k]||(g[k]={});
    e[b.subject]={ avg:b.avg, sd:b.sd, n:b.n, cuts:(b.cuts||[]).slice(),
                   src:b.src||'', by:who(b), at:(b._at||'').slice(0,10) };
    stamp(b);
  }

  /* 누가 마지막으로 손댔는지 (화면 아래에 한 줄로 쓴다) */
  var MARK={};
  function stamp(b){ MARK[b.school]={by:who(b), at:(b._at||'').slice(0,10)}; }
  function markOf(name){ return MARK[name]||null; }

  function logOf(name){
    return LOG.filter(function(x){ return x.school===name; })
              .map(function(x){ return {by:who(x), at:(x._at||'').slice(0,10), kind:x.kind}; })
              .reverse();
  }

  return {on:on, live:live, load:load, add:add, markOf:markOf, logOf:logOf,
          all:function(){return LOG.slice();}, count:function(){return LOG.length;}};
})();
</script>
<script>/* ===== 가입 · 승인 · 로그인 =====
   신청은 누구나, 승인은 김병진T만(파이어베이스 콘솔에서 ok 를 true 로).
   비밀번호는 원문을 보내지 않고 지문(SHA-256)으로만 보낸다 — 김병진T도 원문을 모른다.
   4자리는 경우의 수가 1만 가지라 자물쇠가 아니라 이름표에 가깝다. */
var AUTH=(function(){

  /* ---------- SHA-256 (라이브러리 없이) ---------- */
  var K=[0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,
         0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,
         0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,
         0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,
         0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,
         0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,
         0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,
         0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];
  function rr(x,n){ return (x>>>n)|(x<<(32-n)); }
  function utf8(s){ var b=[],i,c; s=unescape(encodeURIComponent(s));
    for(i=0;i<s.length;i++) b.push(s.charCodeAt(i)&255); return b; }
  function sha256(str){
    var b=utf8(str), L=b.length*8;
    b.push(0x80); while((b.length%64)!==56) b.push(0);
    b.push(0,0,0,0, (L>>>24)&255,(L>>>16)&255,(L>>>8)&255,L&255);
    var H=[0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
    var w=new Array(64),i,j,a,bb,c,d,e,f,g,h,t1,t2,s0,s1;
    for(i=0;i<b.length;i+=64){
      for(j=0;j<16;j++) w[j]=(b[i+j*4]<<24)|(b[i+j*4+1]<<16)|(b[i+j*4+2]<<8)|b[i+j*4+3];
      for(j=16;j<64;j++){
        s0=rr(w[j-15],7)^rr(w[j-15],18)^(w[j-15]>>>3);
        s1=rr(w[j-2],17)^rr(w[j-2],19)^(w[j-2]>>>10);
        w[j]=(w[j-16]+s0+w[j-7]+s1)|0;
      }
      a=H[0];bb=H[1];c=H[2];d=H[3];e=H[4];f=H[5];g=H[6];h=H[7];
      for(j=0;j<64;j++){
        s1=rr(e,6)^rr(e,11)^rr(e,25);
        t1=(h+s1+((e&f)^(~e&g))+K[j]+w[j])|0;
        s0=rr(a,2)^rr(a,13)^rr(a,22);
        t2=(s0+((a&bb)^(a&c)^(bb&c)))|0;
        h=g;g=f;f=e;e=(d+t1)|0;d=c;c=bb;bb=a;a=(t1+t2)|0;
      }
      H[0]=(H[0]+a)|0;H[1]=(H[1]+bb)|0;H[2]=(H[2]+c)|0;H[3]=(H[3]+d)|0;
      H[4]=(H[4]+e)|0;H[5]=(H[5]+f)|0;H[6]=(H[6]+g)|0;H[7]=(H[7]+h)|0;
    }
    return H.map(function(x){ return ('00000000'+(x>>>0).toString(16)).slice(-8); }).join('');
  }
  function fp(name,pin){ return sha256('dgcal|'+String(name).replace(/\s/g,'')+'|'+String(pin)); }

  /* ---------- 저장소 ---------- */
  var P=(typeof FB_PROJECT!=='undefined'&&FB_PROJECT)?FB_PROJECT:'';
  var KEY=(typeof FB_KEY!=='undefined'&&FB_KEY)?FB_KEY:'';
  function on(){ return !!(P&&KEY); }
  function base(){ return 'https://firestore.googleapis.com/v1/projects/'+P
    +'/databases/(default)/documents/members'; }

  var MEM=[], loaded=false;
  function load(){
    if(!on()) return Promise.resolve(0);
    var all=[];
    function page(tok){
      var u=base()+'?key='+encodeURIComponent(KEY)+'&pageSize=300'+(tok?'&pageToken='+encodeURIComponent(tok):'');
      return fetch(u).then(function(r){ if(!r.ok) throw 0; return r.json(); }).then(function(d){
        (d.documents||[]).forEach(function(doc){
          var f=doc.fields||{};
          all.push({ n:(f.n&&f.n.stringValue)||'', o:(f.o&&f.o.stringValue)||'',
                     h:(f.h&&f.h.stringValue)||'',
                     ok:!!(f.ok&&(f.ok.booleanValue===true)),
                     at:(f.at&&f.at.stringValue)||'', doc:doc.name });
        });
        if(d.nextPageToken) return page(d.nextPageToken);
      });
    }
    return page('').then(function(){ MEM=all; loaded=true; return all.length; })
      .catch(function(){ loaded=false; return 0; });
  }

  function signup(name,org,pin){
    var body={fields:{ n:{stringValue:name}, o:{stringValue:org||''},
                       h:{stringValue:fp(name,pin)},
                       at:{stringValue:new Date().toISOString()},
                       ok:{booleanValue:false} }};
    return fetch(base()+'?key='+encodeURIComponent(KEY),
      {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})
      .then(function(r){ if(!r.ok) throw 0; return true; });
  }

  /* ---------- 로그인 ---------- */
  var ME=null;
  try{ ME=JSON.parse(localStorage.getItem('dgcal.who')||'null'); }catch(e){}
  function me(){ return ME; }
  function nameKey(s){ return String(s||'').replace(/\s/g,''); }

  function find(name){
    var k=nameKey(name);
    return MEM.filter(function(m){ return nameKey(m.n)===k; });
  }
  /* 0 통과 · 1 이름없음(신청 안 함) · 2 승인대기 · 3 비번틀림 */
  function check(name,pin){
    var hit=find(name); if(!hit.length) return 1;
    var h=fp(name,pin);
    var same=hit.filter(function(m){ return m.h===h; });
    if(!same.length) return hit.every(function(m){ return !m.ok; }) ? 2 : 3;
    return same.some(function(m){ return m.ok; }) ? 0 : 2;
  }
  function login(name,pin){
    var r=check(name,pin);
    if(r===0){
      var m=find(name).filter(function(x){ return x.ok; })[0]||{};
      ME={n:m.n||name, o:m.o||'', at:new Date().toISOString()};
      try{ localStorage.setItem('dgcal.who', JSON.stringify(ME)); }catch(e){}
    }
    return r;
  }
  function logout(){ ME=null; try{ localStorage.removeItem('dgcal.who'); }catch(e){} }

  /* 저장된 사람이 아직 승인 상태인지 다시 본다 (승인이 취소되면 풀린다) */
  function verify(){
    if(!ME||!loaded) return;
    var hit=find(ME.n);
    if(hit.length && !hit.some(function(m){ return m.ok; })) logout();
  }
  function pending(){ return MEM.filter(function(m){ return !m.ok; }).length; }

  /* ---------- 관리자 (김병진T) ---------- */
  var ADM=(typeof FB_ADMIN!=='undefined'&&FB_ADMIN)?FB_ADMIN:'';
  var TOK=null;
  try{ TOK=JSON.parse(localStorage.getItem('dgcal.adm')||'null'); }catch(e){}
  function isAdmin(){ return !!(TOK&&TOK.uid===ADM); }
  function saveTok(t){ TOK=t; try{ localStorage.setItem('dgcal.adm',JSON.stringify(t)); }catch(e){} }

  /* 0 통과 · 1 아이디/비번 틀림 · 2 관리자가 아님 */
  function adminLogin(email,pw){
    return fetch('https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key='+encodeURIComponent(KEY),
      {method:'POST',headers:{'Content-Type':'application/json'},
       body:JSON.stringify({email:email,password:pw,returnSecureToken:true})})
      .then(function(r){ if(!r.ok) throw 1; return r.json(); })
      .then(function(d){
        if(d.localId!==ADM) throw 2;
        saveTok({uid:d.localId, id:d.idToken, rt:d.refreshToken,
                 exp:Date.now()+(+d.expiresIn||3600)*1000-60000});
        ME={n:'김병진', o:'수경수학학원', admin:true, at:new Date().toISOString()};
        try{ localStorage.setItem('dgcal.who', JSON.stringify(ME)); }catch(e){}
        return 0;
      }).catch(function(e){ return e===2?2:1; });
  }
  function adminOut(){ TOK=null; try{ localStorage.removeItem('dgcal.adm'); }catch(e){} logout(); }

  function token(){
    if(!TOK) return Promise.reject(0);
    if(Date.now()<TOK.exp) return Promise.resolve(TOK.id);
    return fetch('https://securetoken.googleapis.com/v1/token?key='+encodeURIComponent(KEY),
      {method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},
       body:'grant_type=refresh_token&refresh_token='+encodeURIComponent(TOK.rt)})
      .then(function(r){ if(!r.ok) throw 0; return r.json(); })
      .then(function(d){
        saveTok({uid:TOK.uid, id:d.id_token, rt:d.refresh_token,
                 exp:Date.now()+(+d.expires_in||3600)*1000-60000});
        return TOK.id;
      });
  }

  /* 승인 / 승인 취소 — ok 한 칸만 바꾼다 */
  function setOk(docName, ok){
    return token().then(function(t){
      return fetch('https://firestore.googleapis.com/v1/'+docName
          +'?key='+encodeURIComponent(KEY)+'&updateMask.fieldPaths=ok',
        {method:'PATCH',headers:{'Content-Type':'application/json','Authorization':'Bearer '+t},
         body:JSON.stringify({fields:{ok:{booleanValue:!!ok}}})});
    }).then(function(r){ if(!r.ok) throw 0; return true; });
  }
  function list(){ return MEM.slice().sort(function(a,b){ return a.at<b.at?1:-1; }); }

  /* 기다리는 사람만 세어 온다 — 전체를 받지 않으므로 가볍다 */
  function pendingCount(){
    if(!on()) return Promise.resolve(0);
    var url='https://firestore.googleapis.com/v1/projects/'+P
      +'/databases/(default)/documents:runQuery?key='+encodeURIComponent(KEY);
    var q={structuredQuery:{
      from:[{collectionId:'members'}],
      where:{fieldFilter:{field:{fieldPath:'ok'},op:'EQUAL',value:{booleanValue:false}}},
      select:{fields:[{fieldPath:'n'}]}, limit:50 }};
    return fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(q)})
      .then(function(r){ if(!r.ok) throw 0; return r.json(); })
      .then(function(d){
        var names=[];
        (d||[]).forEach(function(x){ if(x.document){
          var f=x.document.fields||{}; names.push((f.n&&f.n.stringValue)||''); } });
        return names;
      });
  }

  return {on:on, load:load, signup:signup, login:login, logout:logout,
          me:me, verify:verify, pending:pending, count:function(){return MEM.length;},
          fp:fp, sha256:sha256,
          hasAdmin:function(){return !!ADM;}, isAdmin:isAdmin,
          adminLogin:adminLogin, adminOut:adminOut, setOk:setOk, list:list, token:token,
          pendingCount:pendingCount};
})();
</script>
<script>/* ===== 관리자 화면 — 승인 · 승인 취소 (김병진T만) ===== */
var ADMIN=(function(){
  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
  var p;

  function open(){
    p=document.getElementById('apanel');
    document.getElementById('asheet').classList.add('on');
    if(!AUTH.isAdmin()){ form(); return; }
    list();                       // 있는 것부터 곧바로 보이고
    AUTH.load().then(list);       // 최신으로 다시 그린다
  }
  function close(){ document.getElementById('asheet').classList.remove('on'); }

  function head(t){ return '<div class="ph"><h2>'+t+'</h2><button class="x" id="ax">×</button></div><div class="pb">'; }
  function bindX(){ document.getElementById('ax').onclick=close; }

  function form(msg){
    p.innerHTML=head('관리자 로그인')
      +'<label class="fl">이메일</label><input type="email" id="aem" autocomplete="username">'
      +'<label class="fl">비밀번호</label><input type="password" id="apw" autocomplete="current-password">'
      +'<div class="acts"><button class="btn" id="ago">로그인</button></div>'
      +'<div class="hint" id="amsg">'+(msg||'파이어베이스에 만드신 계정입니다. 선생님들의 4자리와는 다릅니다.')+'</div></div>';
    bindX();
    var go=document.getElementById('ago');
    function run(){
      var e=(document.getElementById('aem').value||'').trim();
      var w=document.getElementById('apw').value||'';
      if(!e||!w){ document.getElementById('amsg').textContent='이메일과 비밀번호를 넣어 주십시오.'; return; }
      go.disabled=true; document.getElementById('amsg').textContent='확인하는 중…';
      AUTH.adminLogin(e,w).then(function(r){
        go.disabled=false;
        if(r===0){ if(typeof LOGIN!=='undefined') LOGIN.ungate();
                   try{ if(window.Notification && Notification.permission==='default')
                          Notification.requestPermission(); }catch(e){}
                   if(typeof DGCAL!=='undefined'){ DGCAL.whoPaint(); DGCAL.refresh(); }
                   if(window.DGWATCH) DGWATCH.start();
                   AUTH.load().then(list); return; }
        form(r===2 ? '이 계정은 관리자가 아닙니다.' : '이메일이나 비밀번호가 다릅니다.');
      });
    }
    go.onclick=run;
    document.getElementById('apw').onkeydown=function(ev){ if(ev.key==='Enter') run(); };
  }

  function row(m){
    return '<div class="mrow" data-doc="'+esc(m.doc)+'">'
      +'<div><b>'+esc(m.n)+'</b>'+(m.o?' <span class="hint" style="margin:0">'+esc(m.o)+'</span>':'')
      +'<div class="hint" style="margin:2px 0 0">'+esc((m.at||'').slice(0,10))+'</div></div>'
      +'<button class="btn'+(m.ok?' ghost':'')+'" data-ok="'+(m.ok?'0':'1')+'">'
      +(m.ok?'승인 취소':'승인')+'</button></div>';
  }

  function list(){
    var all=AUTH.list();
    var wait=all.filter(function(m){return !m.ok;});
    var okd=all.filter(function(m){return m.ok;});
    p.innerHTML=head('승인 관리')
      +'<div class="hint" style="margin:0 0 12px">승인하시면 그 선생님이 바로 들어오실 수 있습니다. '
      +'취소하시면 다음에 여실 때 다시 막힙니다.</div>'
      +'<label class="fl">승인 기다리는 분 '+wait.length+'명</label>'
      +(wait.length? wait.map(row).join('') : '<div class="hint">없습니다.</div>')
      +'<label class="fl" style="margin-top:18px">쓰고 계신 분 '+okd.length+'명</label>'
      +(okd.length? okd.map(row).join('') : '<div class="hint">아직 없습니다.</div>')
      +'<div class="acts"><button class="btn ghost" id="arel">새로 받기</button>'
      +'<button class="btn ghost" id="aout">관리자 로그아웃</button></div>'
      +'<div class="hint" id="amsg"></div></div>';
    bindX();
    document.getElementById('arel').onclick=function(){
      if(window.DGWATCH) DGWATCH.once();
      AUTH.load().then(list); };
    document.getElementById('aout').onclick=function(){ AUTH.adminOut();
      if(typeof DGCAL!=='undefined') DGCAL.whoPaint(); close();
      if(typeof LOGIN!=='undefined' && typeof LOCK_VIEW!=='undefined' && LOCK_VIEW) LOGIN.gate(); };
    p.querySelectorAll('.mrow button').forEach(function(b){
      b.onclick=function(){
        var doc=b.parentNode.dataset.doc, want=b.dataset.ok==='1';
        b.disabled=true; b.textContent='…';
        AUTH.setOk(doc,want).then(function(){ return AUTH.load(); })
          .then(function(){ if(window.DGWATCH) DGWATCH.once(); return list(); })
          .catch(function(){ b.disabled=false; b.textContent=want?'승인':'승인 취소';
            document.getElementById('amsg').textContent='바꾸지 못했습니다. 규칙이 아직 안 올라갔거나 로그인이 풀렸을 수 있습니다.'; });
      };
    });
  }

  return {open:open, close:close};
})();
</script>
<script>/* ===== 통계 · 모아보기 ===== */
var STATS=(function(){
  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
  var TEAL=['#0f7766','#2c8977','#4a9c8a','#68af9d','#86c2b0','#a4d5c3','#c2e0d6','#d0e7de','#dceee7','#e6f2ef'];
  var MIN_SCHOOL=5;          // 이보다 적으면 순위를 감춘다
  var p, tab='book';
  var F={year:'2026', grade:'1', ex:'2중간', subject:'', dept:'수학'};

  function open(){
    p=document.getElementById('tpanel');
    p.classList.add('wide');
    document.getElementById('tsheet').classList.add('on');
    draw();
  }
  function close(){ document.getElementById('tsheet').classList.remove('on'); }

  function draw(){
    var TABS=[['book','부교재'],['pub','교과서'],['score','등급컷 · 평균'],['cal','시험일정'],['who','참여 현황']];
    p.innerHTML='<div class="ph"><div><h2>통계 · 모아보기</h2>'
      +'<div class="hint" style="margin:2px 0 0">선생님들이 모아 주신 자료를 한눈에 봅니다</div></div>'
      +'<button class="x" id="tx">×</button></div>'
      +'<div class="pb"><div class="gtab wrap">'
      + TABS.map(function(t){ return '<button data-t="'+t[0]+'" class="'+(tab===t[0]?'on':'')+'">'+t[1]+'</button>'; }).join('')
      +'</div><div id="tbody"></div></div>';
    document.getElementById('tx').onclick=close;
    p.querySelectorAll('.gtab button').forEach(function(b){
      b.onclick=function(){ tab=b.dataset.t; draw(); }; });
    var body=document.getElementById('tbody');
    if(tab==='book') body.innerHTML=viewBook();
    else if(tab==='pub') body.innerHTML=viewPub();
    else if(tab==='score'){ body.innerHTML=viewScore(); bindScore(); }
    else if(tab==='cal') body.innerHTML=viewCal();
    else body.innerHTML=viewWho();
    if(tab==='book'||tab==='pub') bindDept();
  }
  function bindDept(){
    p.querySelectorAll('.dchip').forEach(function(b){
      b.onclick=function(){ F.dept=b.dataset.d; draw(); }; });
  }
  function deptRow(){
    return '<div class="fil"><span class="lb">교과</span>'
      + DEPTS.map(function(d){ return '<button class="chip dchip'+(F.dept===d?' on':'')+'" data-d="'+d+'">'+d+'</button>'; }).join('')
      +'</div>';
  }

  /* ---------- 막대 ---------- */
  function bars(rows, unit, one){
    if(!rows.length) return '<div class="empty2">아직 없습니다.</div>';
    var max=Math.max.apply(null, rows.map(function(r){return r[1];})) || 1;
    return rows.map(function(r,i){
      return '<div class="bar"><div class="nm" title="'+esc(r[0])+'">'+esc(r[0])+'</div>'
        +'<div class="tr"><div class="fl" style="width:'+Math.max(2,Math.round(r[1]/max*100))+'%;background:'
        +(one?TEAL[0]:TEAL[Math.min(i,TEAL.length-1)])+'"></div></div>'
        +'<div class="vl">'+r[1]+'<small>'+(unit||'')+'</small></div></div>';
    }).join('');
  }
  function st(k,v,u,gold){
    return '<div class="st"><div class="k">'+k+'</div><div class="v"'+(gold?' style="color:var(--gold)"':'')
      +'>'+v+'<span class="u">'+(u||'')+'</span></div></div>';
  }
  function card(t,d,inner){
    return '<div class="scard"><h2 class="ct">'+t+'</h2>'
      +(d?'<p class="cd">'+d+'</p>':'')+inner+'</div>';
  }

  /* ---------- 1. 부교재 ---------- */
  function viewBook(){
    var BK=DATA.books, cnt={}, byBook={}, sch={}, slots=0;
    Object.keys(BK).forEach(function(nm){
      Object.keys(BK[nm]).forEach(function(gr){
        (BK[nm][gr].items||[]).forEach(function(it){
          if(deptOf(it[0])!==F.dept) return;
          slots++; sch[nm]=1;
          var b=it[1]; if(!b || b==='부교재 없음') return;
          cnt[b]=(cnt[b]||0)+1;
          (byBook[b]=byBook[b]||[]).push([nm,gr,it[0],it[2]]);
        });
      });
    });
    var rows=Object.keys(cnt).map(function(k){return [k,cnt[k]];})
      .sort(function(a,b){return b[1]-a[1];}).slice(0,12);
    var total=Object.keys(DATA.books).length;
    var all=0; DATA.schools.forEach(function(s){ if(s.lvl==='고') all++; });
    var h='<div class="hero">'
      + st('부교재 등록', Object.keys(sch).length, '개교')
      + st('등록된 칸', slots, '칸')
      + st('쓰이는 교재', rows.length, '종')
      + st('아직 빈 학교', Math.max(0, 192-Object.keys(DATA.books).length), '개교', 1)
      +'</div>';
    h+=deptRow();
    h+=card('많이 쓰는 부교재',
      esc(F.dept)+' · 등록된 '+Object.keys(sch).length+'개교에서 모은 것입니다. 학교 수가 적으면 「대구 전체 경향」으로 보기는 이릅니다.',
      bars(rows,' 칸'));
    var top=rows[0];
    if(top){
      var ls=byBook[top[0]].slice(0,14);
      h+=card('「'+esc(top[0])+'」을 쓰는 학교', '가장 많이 쓰이는 교재의 학교 목록입니다.',
        '<table><tr><th>학교</th><th>학년</th><th>과목</th><th>학기</th></tr>'
        + ls.map(function(x){ return '<tr><td>'+esc(x[0])+'</td><td>'+esc(x[1])+'학년</td><td>'+esc(x[2])+'</td>'
            +'<td>'+(x[3]?'<span class="tag t">'+esc(x[3]==='12'?'1·2':x[3])+'학기</span>':'<span class="tag">-</span>')+'</td></tr>'; }).join('')
        + (byBook[top[0]].length>14?'<tr><td colspan="4" class="more">… 그 밖 '+(byBook[top[0]].length-14)+'칸</td></tr>':'')
        +'</table>');
    }
    return h;
  }

  /* ---------- 2. 교과서 ---------- */
  function viewPub(){
    var TB=DATA.textbook, cnt={}, sch={}, hi=0, mid=0;
    Object.keys(TB).forEach(function(nm){
      var isHi=/고등학교$/.test(nm); if(isHi) hi++; else mid++;
      Object.keys(TB[nm]).forEach(function(sj){
        if(deptOf(sj)!==F.dept) return;
        var pb=TB[nm][sj]; if(!pb) return;
        cnt[pb]=(cnt[pb]||0)+1; sch[nm]=1;
      });
    });
    var rows=Object.keys(cnt).map(function(k){return [k,cnt[k]];})
      .sort(function(a,b){return b[1]-a[1];}).slice(0,12);
    var slots=0; Object.keys(cnt).forEach(function(k){ slots+=cnt[k]; });
    var h='<div class="hero">'
      + st('교과서 등록', Object.keys(TB).length, '개교')
      + st('고등학교', hi, '개교')
      + st('중학교', mid, '개교')
      + st(esc(F.dept)+' 칸', slots, '칸')
      +'</div>';
    h+=deptRow();
    h+=card(esc(F.dept)+' 교과서 출판사',
      '교육청 자료로 채운 것이라 거의 전수입니다. 학교·과목 칸 수로 셌습니다.',
      bars(rows,' 칸'));
    return h;
  }

  /* ---------- 3. 등급컷 · 평균 ---------- */
  function pick(){                        // 지금 고른 조건에 맞는 학교별 값
    var out=[], SC=DATA.scores||{};
    var sem=F.ex.charAt(0), ex=F.ex.slice(1);
    Object.keys(SC).forEach(function(nm){
      var e=(((SC[nm]||{})[F.year]||{})[F.grade]||{})[sem+ex];
      if(!e) return;
      Object.keys(e).forEach(function(sj){
        if(F.subject && sj!==F.subject) return;
        if(!F.subject && deptOf(sj)!==F.dept) return;
        out.push({name:nm, subject:sj, v:e[sj]});
      });
    });
    return out;
  }
  function subjOptions(){
    var s={}, SC=DATA.scores||{};
    var sem=F.ex.charAt(0), ex=F.ex.slice(1);
    Object.keys(SC).forEach(function(nm){
      var e=(((SC[nm]||{})[F.year]||{})[F.grade]||{})[sem+ex];
      if(e) Object.keys(e).forEach(function(sj){ s[sj]=(s[sj]||0)+1; });
    });
    return Object.keys(s).sort(function(a,b){return s[b]-s[a];});
  }
  function viewScore(){
    var opts=subjOptions();
    if(!F.subject && opts.length) F.subject=opts[0];
    var h='<div class="fil">'
      +'<span class="lb">학년도</span><select id="fy">'+YEARS.map(function(y){
          return '<option'+(F.year===y?' selected':'')+'>'+y+'</option>';}).join('')+'</select>'
      +'<span class="lb">학년</span><select id="fg">'+['1','2','3'].map(function(x){
          return '<option value="'+x+'"'+(F.grade===x?' selected':'')+'>'+x+'학년</option>';}).join('')+'</select>'
      +'<span class="lb">시험</span><select id="fe">'
      + [['1중간','1학기 중간'],['1기말','1학기 기말'],['2중간','2학기 중간'],['2기말','2학기 기말']].map(function(x){
          return '<option value="'+x[0]+'"'+(F.ex===x[0]?' selected':'')+'>'+x[1]+'</option>';}).join('')+'</select>'
      +'<span class="lb">과목</span><select id="fs">'
      + (opts.length? opts.map(function(x){ return '<option'+(F.subject===x?' selected':'')+'>'+esc(x)+'</option>'; }).join('')
                    : '<option>(아직 없음)</option>')+'</select></div>';

    var rows=pick();
    if(!rows.length){
      return h+card('아직 자료가 없습니다','',
        '<div class="empty2">고른 조건으로 들어온 학교가 없습니다.<br>'
        +'2학기 중간고사는 <b>중학교 9월 15일 · 고등학교 9월 18일</b>부터 시작합니다.<br>'
        +'시험이 끝나면 이 자리에 순위가 나옵니다.</div>')
        + guard();
    }
    if(rows.length<MIN_SCHOOL){
      return h+card('아직 자료가 적습니다', esc(F.subject),
        '<div class="empty2"><b>'+rows.length+'개교</b>만 들어와 있어 순위를 내지 않습니다.<br>'
        +MIN_SCHOOL+'개교부터 보여 드립니다 — 몇 곳으로 낸 1등은 1등이 아닙니다.</div>'
        +'<table><tr><th>학교</th><th style="text-align:right">1등급컷</th><th style="text-align:right">평균</th></tr>'
        + rows.map(function(r){ return '<tr><td>'+esc(r.name)+'</td>'
            +'<td class="n">'+((r.v.cuts||[])[0]!=null?r.v.cuts[0]:'-')+'</td>'
            +'<td class="n">'+(r.v.avg!=null?r.v.avg:'-')+'</td></tr>'; }).join('')+'</table>')
        + guard();
    }
    function tbl(list,label){
      return '<table><tr><th class="rk"></th><th>학교</th><th style="text-align:right">1등급컷</th>'
        +'<th style="text-align:right">평균</th></tr>'
        + list.map(function(r,i){ return '<tr><td class="rk">'+(i+1)+'</td><td>'+esc(r.name)+'</td>'
            +'<td class="n">'+((r.v.cuts||[])[0]!=null?r.v.cuts[0]:'-')+'</td>'
            +'<td class="n">'+(r.v.avg!=null?r.v.avg:'-')+'</td></tr>'; }).join('')+'</table>'
        +'<div class="note">'+rows.length+'개교 기준</div>';
    }
    var withCut=rows.filter(function(r){ return (r.v.cuts||[])[0]!=null; });
    var hi=withCut.slice().sort(function(a,b){ return b.v.cuts[0]-a.v.cuts[0]; }).slice(0,10);
    var lo=withCut.slice().sort(function(a,b){ return a.v.cuts[0]-b.v.cuts[0]; }).slice(0,10);
    h+='<div class="two">'
      + card('1등급컷이 높은 학교', esc(F.year)+' · '+esc(F.grade)+'학년 · '+esc(F.subject), tbl(hi))
      + card('1등급컷이 낮은 학교', esc(F.year)+' · '+esc(F.grade)+'학년 · '+esc(F.subject), tbl(lo))
      +'</div>';
    var avgs=rows.filter(function(r){ return r.v.avg!=null; }).map(function(r){ return r.v.avg; });
    if(avgs.length){
      var bands=[['80점 이상',function(x){return x>=80;}],['70 ~ 79',function(x){return x>=70&&x<80;}],
                 ['60 ~ 69',function(x){return x>=60&&x<70;}],['50 ~ 59',function(x){return x>=50&&x<60;}],
                 ['40 ~ 49',function(x){return x>=40&&x<50;}],['30 ~ 39',function(x){return x>=30&&x<40;}],
                 ['30점 미만',function(x){return x<30;}]];
      var br=bands.map(function(b){ return [b[0], avgs.filter(b[1]).length]; }).filter(function(x){return x[1];});
      var mean=Math.round(avgs.reduce(function(a,b){return a+b;},0)/avgs.length*10)/10;
      h+=card('학교 평균이 어떻게 퍼져 있나',
        esc(F.subject)+' · 학교 평균들의 평균은 <b>'+mean+'점</b>입니다.', bars(br,' 개교',1));
    }
    return h+guard();
  }
  function guard(){
    return '<div class="warn"><b>순위를 볼 때 알아두실 것</b><br>'
      +'· <b>같은 조건끼리만</b> — 학년도·학년·시험·과목을 고정해야 비교가 됩니다.<br>'
      +'· <b>'+MIN_SCHOOL+'개교 미만이면 순위를 감춥니다</b> — 몇 곳으로 낸 1등은 1등이 아닙니다.<br>'
      +'· 여기 숫자는 <b>선생님들이 넣어 주신 것</b>입니다. 중요한 판단 전에는 학교 발표로 다시 확인해 주십시오.</div>';
  }
  function bindScore(){
    ['fy','fg','fe','fs'].forEach(function(id){
      var el=document.getElementById(id); if(!el) return;
      el.onchange=function(){
        if(id==='fy') F.year=el.value;
        else if(id==='fg'){ F.grade=el.value; F.subject=''; }
        else if(id==='fe'){ F.ex=el.value; F.subject=''; }
        else F.subject=el.value;
        draw();
      };
    });
  }

  /* ---------- 4. 시험일정 ---------- */
  function viewCal(){
    var TODAY=new Date(); TODAY.setHours(0,0,0,0);
    var idx={'1중간':0,'1기말':1,'2중간':2,'2기말':3}[F.ex]!=null?{'1중간':0,'1기말':1,'2중간':2,'2기말':3}[F.ex]:2;
    var rows=[];
    DATA.schools.forEach(function(s){
      if(s.lvl!=='고'&&s.lvl!=='중') return;
      var e=(s.ex||[])[idx]; if(!e||!e[0]) return;
      rows.push({name:s.name, lvl:s.lvl, d:e[0]});
    });
    var seen={}, uniq=[];
    rows.sort(function(a,b){ return a.d<b.d?-1:1; }).forEach(function(r){
      var k=r.lvl+'|'+r.name; if(seen[k]) return; seen[k]=1; uniq.push(r); });
    function dd(s){ var p=s.split('-'), d=new Date(+p[0],+p[1]-1,+p[2]);
      var n=Math.round((d-TODAY)/86400000);
      return (n<0?'지남':n===0?'오늘':'D-'+n); }
    function fmt(s){ var p=s.split('-'), d=new Date(+p[0],+p[1]-1,+p[2]);
      return (+p[1])+'월 '+(+p[2])+'일('+'일월화수목금토'[d.getDay()]+')'; }
    var h='<div class="fil"><span class="lb">시험</span><select id="ce">'
      + [['1중간','1학기 중간'],['1기말','1학기 기말'],['2중간','2학기 중간'],['2기말','2학기 기말']].map(function(x){
          return '<option value="'+x[0]+'"'+(F.ex===x[0]?' selected':'')+'>'+x[1]+'</option>';}).join('')
      +'</select></div>';
    h+=card('시험이 이른 학교', '교육청 자료라 전수입니다. 중·고 '+uniq.length+'개교.',
      '<table><tr><th class="rk"></th><th>학교</th><th>시작일</th><th style="text-align:right">남은 날</th></tr>'
      + uniq.slice(0,12).map(function(r,i){ return '<tr><td class="rk">'+(i+1)+'</td>'
          +'<td>'+esc(r.name)+' <span class="tag">'+esc(r.lvl)+'</span></td><td>'+fmt(r.d)+'</td>'
          +'<td class="n">'+dd(r.d)+'</td></tr>'; }).join('')+'</table>');
    // 주별
    var wk={};
    uniq.forEach(function(r){
      var p=r.d.split('-'), d=new Date(+p[0],+p[1]-1,+p[2]);
      var day=d.getDay(); var mon=new Date(d); mon.setDate(d.getDate()-((day+6)%7));
      var key=(mon.getMonth()+1)+'월 '+Math.ceil(mon.getDate()/7)+'주';
      wk[key]=(wk[key]||0)+1;
    });
    var order=Object.keys(wk);
    h+=card('주마다 몇 개교가 시험을 보나',
      '언제가 바쁜지 미리 보는 자리입니다. 보강·특강 잡으실 때 쓰십시오.',
      bars(order.map(function(k){return [k,wk[k]];}),' 개교',1));
    var el;
    setTimeout(function(){ el=document.getElementById('ce');
      if(el) el.onchange=function(){ F.ex=el.value; draw(); }; },0);
    return h;
  }

  /* ---------- 5. 참여 현황 ---------- */
  function viewWho(){
    if(typeof STORE==='undefined' || !STORE.on())
      return '<div class="empty2">저장소가 켜져 있지 않습니다.</div>';
    var log=STORE.all? STORE.all() : [];
    var cnt={}, kinds={};
    log.forEach(function(x){
      var w=(x.show===false)?'익명':(x.name+(x.org?'|'+x.org:''));
      cnt[w]=(cnt[w]||0)+1;
      kinds[x.kind]=(kinds[x.kind]||0)+1;
    });
    var rows=Object.keys(cnt).map(function(k){return [k,cnt[k]];}).sort(function(a,b){return b[1]-a[1];});
    var KN={book:'과목·부교재',subj:'배우는 과목',rng:'시험범위',exam:'시험일정',score:'등급컷·평균'};
    var h='<div class="hero">'
      + st('모인 자료', log.length, '건')
      + st('채워 주신 분', rows.length, '명')
      +'</div>';
    h+=card('누가 얼마나 채워 주셨나',
      '이름을 보이기로 하신 분만 나옵니다. 「익명」을 고르신 분은 수만 셉니다.',
      rows.length
        ? '<table><tr><th class="rk"></th><th>선생님</th><th>학원</th><th style="text-align:right">채운 칸</th></tr>'
          + rows.slice(0,20).map(function(r,i){ var q=r[0].split('|');
              return '<tr><td class="rk">'+(i+1)+'</td><td>'+esc(q[0])+'</td>'
              +'<td>'+esc(q[1]||'—')+'</td><td class="n">'+r[1]+'</td></tr>'; }).join('')+'</table>'
        : '<div class="empty2">아직 없습니다.</div>');
    var kr=Object.keys(kinds).map(function(k){return [KN[k]||k,kinds[k]];}).sort(function(a,b){return b[1]-a[1];});
    if(kr.length) h+=card('어떤 자료가 모였나','', bars(kr,' 건',1));
    // 빈 학교
    var empty=[];
    DATA.schools.forEach(function(s){
      if(s.lvl!=='고') return;
      if(DATA.books[s.name]) return;
      if(empty.indexOf(s.name)<0) empty.push(s.name);
    });
    h+=card('부교재가 아직 비어 있는 고등학교',
      esc(empty.length)+'개교입니다. 재원생이 있으시면 채워 주십시오.',
      '<table><tr><th>학교</th><th>교과서</th></tr>'
      + empty.slice(0,20).map(function(n){ return '<tr><td>'+esc(n)+'</td><td>'
          +(DATA.textbook[n]?'<span class="tag t">있음</span>':'<span class="tag g">없음</span>')+'</td></tr>'; }).join('')
      + (empty.length>20?'<tr><td colspan="2" class="more">… 그 밖 '+(empty.length-20)+'개교</td></tr>':'')
      +'</table>');
    return h;
  }

  return {open:open, close:close};
})();
</script>
<script>/* ===== 로그인 · 가입 신청 창 ===== */
var LOGIN=(function(){
  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
  var p, after=null, GATE=false;

  function open(tab, cb){
    p=document.getElementById('lpanel'); after=cb||null; GATE=false;
    draw(tab||'in');
    document.getElementById('lsheet').classList.add('on');
  }
  function close(){ if(!GATE) document.getElementById('lsheet').classList.remove('on'); }

  /* 문 — 로그인 전에는 아무것도 안 보이게 */
  function gate(){
    p=document.getElementById('gpanel'); after=null; GATE=true;
    document.getElementById('gate').style.display='flex';
    draw('in');
  }
  function ungate(){
    GATE=false;
    var g=document.getElementById('gate'); if(g) g.style.display='none';
  }

  function draw(tab){
    var h='<div class="ph"><h2>'+(GATE
        ? '2026학년도 대구 학사일정 찾기'
        : (tab==='in'?'로그인':'가입 신청'))+'</h2>'
      +(GATE?'':'<button class="x" id="lx">×</button>')+'</div><div class="pb">'
      +(GATE?'<div class="hint" style="margin:0 0 12px">선생님들이 함께 만드는 자료입니다. '
        +'<b>로그인하셔야 보실 수 있습니다.</b> 처음이시면 아래 「처음이신가요」에서 신청해 주십시오.</div>':'')
      +'<div class="gtab wrap" style="margin-bottom:14px">'
      +'<button data-t="in" class="'+(tab==='in'?'on':'')+'">로그인</button>'
      +'<button data-t="up" class="'+(tab==='up'?'on':'')+'">처음이신가요</button></div>';

    if(tab==='in'){
      h+='<label class="fl">이름</label>'
        +'<input type="text" id="lname" placeholder="예: 홍길동" autocomplete="username">'
        +'<label class="fl">비밀번호 (숫자 4자리)</label>'
        +'<input type="password" class="pin" id="lpin" inputmode="numeric" maxlength="4" placeholder="0000" autocomplete="current-password">'
        +'<div class="acts"><button class="btn" id="lgo">로그인</button></div>'
        +'<div class="hint" id="lmsg">한 번 하시면 이 기기에서는 다음부터 저절로 됩니다.</div>';
    }else{
      h+='<label class="fl">이름 <span class="hint" style="font-weight:600;margin:0">— 성과 이름을 다 적어 주십시오</span></label>'
        +'<input type="text" id="uname" placeholder="예: 홍길동">'
        +'<label class="fl">학원 (안 적으셔도 됩니다)</label>'
        +'<input type="text" id="uorg" placeholder="예: ○○수학학원">'
        +'<label class="fl">쓰실 비밀번호 (숫자 4자리)</label>'
        +'<div style="display:flex;gap:10px">'
        +'<input type="password" class="pin" id="upin" inputmode="numeric" maxlength="4" placeholder="0000">'
        +'<input type="password" class="pin" id="upin2" inputmode="numeric" maxlength="4" placeholder="••••"></div>'
        +'<div class="hint">비밀번호는 <b>원문이 보내지지 않습니다.</b> 알아볼 수 없는 지문으로 바뀌어 저장되므로 운영자도 무엇인지 모릅니다. '
        +'다만 4자리는 경우의 수가 적으니 <b>다른 곳에서 쓰시는 비밀번호는 피해 주십시오.</b></div>'
        +'<div class="acts"><button class="btn" id="ugo">신청하기</button></div>'
        +'<div class="hint" id="umsg">신청하시면 김병진T가 확인한 뒤 열어 드립니다. 대개 하루 안에 됩니다.</div>';
    }
    if(GATE && typeof AUTH!=='undefined' && AUTH.hasAdmin())
      h+='<div class="hint" style="text-align:center;margin-top:16px">'
        +'<a href="#" id="ladm" style="color:var(--muted)">관리자로 들어가기</a></div>';
    h+='</div>';
    p.innerHTML=h;
    var xb=document.getElementById('lx'); if(xb) xb.onclick=close;
    p.querySelectorAll('.gtab button').forEach(function(b){
      b.onclick=function(){ draw(b.dataset.t); }; });
    var la=document.getElementById('ladm');
    if(la) la.onclick=function(e){ e.preventDefault(); ADMIN.open(); };
    if(tab==='in') bindIn(); else bindUp();
  }

  function msg(id,t,bad){
    var e=document.getElementById(id); if(!e) return;
    e.innerHTML=t; e.style.color=bad?'var(--bad,#c0392b)':'';
  }

  function bindIn(){
    var go=document.getElementById('lgo');
    function run(){
      var n=(document.getElementById('lname').value||'').trim();
      var pin=(document.getElementById('lpin').value||'').trim();
      if(n.replace(/\s/g,'').length<2){ msg('lmsg','성과 이름을 다 적어 주십시오.',1); return; }
      if(!/^\d{4}$/.test(pin)){ msg('lmsg','비밀번호는 숫자 4자리입니다.',1); return; }
      go.disabled=true; msg('lmsg','확인하는 중…');
      AUTH.load().then(function(){
        var r=AUTH.login(n,pin);
        go.disabled=false;
        if(r===0){
          if(GATE){ ungate(); if(typeof DGCAL!=='undefined'&&DGCAL.refresh) DGCAL.refresh(); }
          else close();
          if(typeof DGCAL!=='undefined'&&DGCAL.whoPaint) DGCAL.whoPaint();
          if(after){ var f=after; after=null; f(); } return; }
        if(r===1) msg('lmsg','그 이름으로 신청된 것이 없습니다. 위의 <b>「처음이신가요」</b>에서 먼저 신청해 주십시오.',1);
        else if(r===2) msg('lmsg','아직 <b>승인 전</b>입니다. 김병진T가 열어 드리면 바로 들어오실 수 있습니다.',1);
        else msg('lmsg','비밀번호가 다릅니다. 잊으셨으면 김병진T에게 말씀해 주십시오.',1);
      }).catch(function(){ go.disabled=false; msg('lmsg','확인하지 못했습니다. 잠시 뒤 다시 해 주십시오.',1); });
    }
    go.onclick=run;
    document.getElementById('lpin').onkeydown=function(e){ if(e.key==='Enter') run(); };
  }

  function bindUp(){
    var go=document.getElementById('ugo');
    go.onclick=function(){
      var n=(document.getElementById('uname').value||'').trim();
      var o=(document.getElementById('uorg').value||'').trim();
      var a=(document.getElementById('upin').value||'').trim();
      var b=(document.getElementById('upin2').value||'').trim();
      if(n.replace(/\s/g,'').length<2){ msg('umsg','성과 이름을 다 적어 주십시오.',1); return; }
      if(!/^\d{4}$/.test(a)){ msg('umsg','비밀번호는 숫자 4자리입니다.',1); return; }
      if(a!==b){ msg('umsg','두 번 적으신 비밀번호가 다릅니다.',1); return; }
      go.disabled=true; msg('umsg','보내는 중…');
      AUTH.signup(n,o,a).then(function(){
        p.innerHTML='<div class="ph"><h2>신청했습니다</h2>'+(GATE?'':'<button class="x" id="lx">×</button>')+'</div>'
          +'<div class="pb"><div class="notice">'
          +'<b>'+esc(n)+'</b> 선생님으로 신청이 들어갔습니다.<br>'
          +'김병진T가 확인한 뒤 열어 드립니다. 열리면 <b>같은 이름과 비밀번호</b>로 로그인하시면 됩니다.<br>'
          +'비밀번호는 잊지 마십시오 — 저장된 것이 지문뿐이라 알려 드릴 수가 없습니다.'
          +'</div><div class="acts"><button class="btn ghost" id="lclose">'+(GATE?'로그인 화면으로':'닫기')+'</button></div></div>';
        var xb2=document.getElementById('lx'); if(xb2) xb2.onclick=close;
        document.getElementById('lclose').onclick=function(){ if(GATE) draw('in'); else close(); };
      }).catch(function(){ go.disabled=false; msg('umsg','보내지 못했습니다. 잠시 뒤 다시 해 주십시오.',1); });
    };
  }

  /* 로그인해야 되는 일을 감싼다 */
  function need(fn){
    if(!AUTH.on()){ fn(); return; }          // 저장소가 없으면 예전처럼 그냥 쓴다
    if(AUTH.me()){ fn(); return; }
    open('in', fn);
  }

  return {open:open, close:close, need:need, gate:gate, ungate:ungate};
})();
</script>
<script>/* ===== 수정 제안 ===== */
var SUGGEST=(function(){
  var API='/api/suggest';
  var DEMO=(location.protocol==='file:');   // 파일로 열면 시늉만 낸다 (시안)
  var READY=DEMO;                            // 서버가 살아 있으면 true
  if(!DEMO){
    fetch(API,{method:'GET'}).then(function(r){ READY=(r.status!==404); })
      .catch(function(){ READY=false; });
  }
  READY=false;   // 2단계(자동 전송) 붙기 전까지는 복사해서 보내기
  var ME=null;
  try{ ME=JSON.parse(localStorage.getItem('dgcal.me')||'null'); }catch(e){}
  function DIRECT(){ return typeof STORE!=='undefined' && STORE.on(); }   // 바로 고칠 수 있는가
  /* 성적(등급컷·평균) 칸을 볼 수 있는가 — 지금은 관리자만 */
  function CANSCORE(){
    if(typeof SHOW_SCORE!=='undefined' && SHOW_SCORE) return true;
    return typeof AUTH!=='undefined' && AUTH.isAdmin && AUTH.isAdmin();
  }
  /* 그 학교 그 학년 그 학기에 배우는 과목이 확정돼 있는가
     — 고1과 중학교는 전국이 같아 늘 확정, 고2·고3은 등록돼 있어야 한다 */
  function fixedSubjects(lvl, name, grade, sem){
    var reg=((DATA.subjects||{})[name]||{})[grade];
    if(lvl==='중'){
      return {fixed:true, list:DEPTS.map(function(d){ return d+' '+grade+'학년'; })};
    }
    if(lvl==='고' && grade==='1'){
      var out=[];
      DEPTS.forEach(function(d){ var c=G1_COMMON[d]; if(c) out=out.concat(c[sem==='2'?1:0]); });
      if(reg) (reg[sem]||[]).forEach(function(x){ if(out.indexOf(x)<0) out.push(x); });
      return {fixed:true, list:out};
    }
    if(reg && (reg[sem]||[]).length) return {fixed:true, list:(reg[sem]||[]).slice()};
    return {fixed:false, list:[]};
  }

  /* 오늘이 몇 학기인가 — 그 학교 2학기 개학일로 본다 */
  function semNow(g){
    var se=null;
    (g.rows||[]).forEach(function(r){ if(r.se && !se) se=r.se; });
    if(!se) return (new Date().getMonth()+1)>=8 ? '2' : '1';
    var p=se.split('-'), d=new Date(+p[0],+p[1]-1,+p[2]);
    return (new Date()>=d) ? '2' : '1';
  }
  function WHO(){                                     // 로그인했으면 그 이름으로 고정
    var a=(typeof AUTH!=='undefined' && AUTH.on()) ? AUTH.me() : null;
    if(a) return {name:a.n, org:a.o||'', fixed:true};
    return {name:(ME&&ME.name)||'', org:(ME&&ME.org)||'', fixed:false};
  }

  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}

  var SUBJ={
    '고':['공통수학1','공통수학2','대수','미적분1','확률과 통계','미적분2','기하','경제 수학','인공지능 수학','기타'],
    '중':['1학년','2학년','3학년','기타'],
    '초':['기타'], '특수':['기타'], '각종':['기타']
  };
  var curD='수학';   // 창을 열 때 첫 화면에서 고른 교과를 따른다
  var EXNAME=['1학기 중간','1학기 기말','2학기 중간','2학기 기말'];

  function open(g, tab){
    var p=document.getElementById('spanel'), kind=tab||'book';
    if(typeof selDepts!=='undefined' && selDepts.length===1) curD=selDepts[0];
    var grades=g.rows.map(function(r){return r.grade||'-';});
    function form(){
      var h='';
      if(g.lvl==='고'||g.lvl==='중'){
        h+='<div class="dtab">'+DEPTS.map(function(d){
          return '<button data-d="'+d+'" class="'+(d===curD?'on':'')+'">'+d+'</button>';}).join('')+'</div>';
      }
      h+='<div class="gtab wrap" style="margin-bottom:14px">'
        +'<button data-k="book" class="'+(kind==='book'?'on':'')+'">과목 · 부교재</button>'
        +(g.lvl==='고'?'<button data-k="subj" class="'+(kind==='subj'?'on':'')+'">한 해 과목 한꺼번에</button>':'')
        +(g.lvl!=='초'?'<button data-k="rng" class="'+(kind==='rng'?'on':'')+'">시험범위</button>':'')
        +(g.lvl!=='초'&&CANSCORE()?'<button data-k="score" class="'+(kind==='score'?'on':'')+'">등급컷 · 평균</button>':'')
        +'<button data-k="exam" class="'+(kind==='exam'?'on':'')+'">시험일정 정정</button></div>';
      if(kind==='book'){
        h+='<label class="fl">학년</label><div class="checks">'
          + ['1','2','3'].map(function(x,i){
              return '<label><input type="radio" name="sgr" value="'+x+'"'+(i===0?' checked':'')+'> '+x+'학년</label>';}).join('')
          +'</div>'
          +'<label class="fl">몇 학기</label><div class="checks">'
          +'<label><input type="radio" name="ssem" value="1" checked> 1학기</label>'
          +'<label><input type="radio" name="ssem" value="2"> 2학기</label>'
          +'<label><input type="radio" name="ssem" value="12"> 두 학기 다</label></div>'
          +'<label class="fl">과목 <span class="hint" style="font-weight:600;margin:0">— 같은 책을 쓰면 여러 개 고르셔도 됩니다</span></label>'
          +'<div class="checks" id="subbox"></div>'
          +'<label class="fl">교과서 출판사</label>'
          +'<input type="text" id="spub" placeholder="예: 비상교육 / 좋은책신사고 / 지학사">'
          +'<div class="hint" id="pubnow">모르시면 비워 두셔도 됩니다.</div>'
          +'<label class="fl">부교재 이름</label>'
          +'<input type="text" id="sbook" placeholder="예: 올림포스 유형편 / 부교재 없음">'
          +'<div class="hint" id="booknow">모르시면 비워 두셔도 됩니다.</div>'
          +'<div class="hint"><b>비워 두시면 과목만 등록됩니다.</b><br>'
          +'그 학교가 <b>부교재를 안 쓰는 것</b>이면 「부교재 없음」이라고 적어 주십시오 — 비워 두는 것과 다릅니다.<br>'
          +'출판사와 부교재는 고른 과목에 한꺼번에 들어갑니다. 과목마다 다르면 따로 보내 주십시오.</div>';
      }else if(kind==='subj'){
        h+='<label class="fl">학년</label><div class="checks">'
          + ['1','2','3'].map(function(x,i){
              return '<label><input type="radio" name="sgr3" value="'+x+'"'+(x==='2'?' checked':'')+'> '+x+'학년</label>';}).join('')
          +'</div>'
          +'<div class="hint" id="g1note"></div>'
          +'<label class="fl">1학기에 배우는 '+esc(curD)+' 과목</label><div class="checks" id="sj1">'
          + subjectsFor(g.lvl,curD).map(function(s2){ return '<label><input type="checkbox" name="sj1" value="'+esc(s2)+'"> '+esc(s2)+'</label>';}).join('')
          +'</div>'
          +'<label class="fl">2학기에 배우는 '+esc(curD)+' 과목</label><div class="checks" id="sj2">'
          + subjectsFor(g.lvl,curD).map(function(s2){ return '<label><input type="checkbox" name="sj2" value="'+esc(s2)+'"> '+esc(s2)+'</label>';}).join('')
          +'</div>'
          +'<div class="hint">1학기와 2학기를 <b>한 번에</b> 알려 주실 때 쓰는 자리입니다. 한 학기만 아시면 앞의 「과목 · 부교재」에서 그 학기만 고르셔도 됩니다.</div>';
      }else if(kind==='rng'){
        h+='<label class="fl">어느 시험입니까</label><select id="rex" style="width:100%;border-radius:9px;padding:10px 12px;font-size:14px">'
          + EXNAME.map(function(s2,i){return '<option value="'+i+'">'+s2+'</option>';}).join('')+'</select>'
          +'<label class="fl">학년</label><div class="checks">'
          + (g.lvl==='고'?['1','2','3']:['1','2','3']).map(function(x){
              return '<label><input type="radio" name="sgr4" value="'+x+'"'+(x==='2'?' checked':'')+'> '+x+'학년</label>';}).join('')
          +'</div>'
          +'<label class="fl">과목과 범위</label>'
          +'<textarea id="rtxt" placeholder="예)\n대수 : 수열 전체 + 등차수열의 합\n미적분1 : 극한 ~ 미분계수" '
          +'style="width:100%;height:120px;padding:11px 12px;border:1.5px solid var(--line);border-radius:9px;'
          +'font-size:14px;line-height:1.7;resize:vertical;font-family:inherit"></textarea>'
          +'<div class="hint">한 줄에 한 과목씩, <b>과목 : 범위</b> 꼴로 적어 주십시오. 사진으로 갖고 계시면 그대로 보내 주셔도 됩니다.</div>';
      }else if(kind==='score'){
        var sm=semNow(g), grs=['1','2','3'];
        h+='<label class="fl">학년도</label><div class="checks">'
          + YEARS.map(function(y,i){
              return '<label><input type="radio" name="syr" value="'+y+'"'+(i===0?' checked':'')+'> '+y+'학년도</label>';}).join('')
          +'</div>'
          +'<label class="fl">학년</label><div class="checks">'
          + grs.map(function(x,i){
              return '<label><input type="radio" name="sgr5" value="'+x+'"'+(i===0?' checked':'')+'> '+x+'학년</label>';}).join('')
          +'</div>'
          +'<label class="fl">학기</label><div class="checks">'
          +'<label><input type="radio" name="ssem5" value="1"'+(sm==='1'?' checked':'')+'> 1학기</label>'
          +'<label><input type="radio" name="ssem5" value="2"'+(sm==='2'?' checked':'')+'> 2학기</label></div>'
          +'<label class="fl">어느 시험</label><div class="checks">'
          +'<label><input type="radio" name="sex5" value="중간" checked> 중간고사</label>'
          +'<label><input type="radio" name="sex5" value="기말"> 기말고사</label></div>'
          +'<label class="fl">과목</label><div id="scsub"></div>'
          +'<div id="scbody"></div>'
          +'<div class="hint">학교가 공식으로 낸 값을 넣어 주십시오. '
          +'<b>재원생 몇 명으로 낸 값이 아니라</b> 학교 평균·등급컷입니다. 모르는 칸은 비워 두셔도 됩니다.</div>';
      }else{
        h+='<label class="fl">어느 시험입니까</label><select id="sex" style="width:100%;border-radius:9px;padding:10px 12px;font-size:14px">'
          + EXNAME.map(function(s,i){return '<option value="'+i+'">'+s+'</option>';}).join('')+'</select>'
          + (g.rows.length>1?'<label class="fl">학년</label><div class="checks">'
              +g.rows.map(function(r,i){return '<label><input type="radio" name="sgr2" value="'+i+'"'+(i===0?' checked':'')+'> '+esc(r.grade)+'학년</label>';}).join('')
              +'</div>':'')
          +'<div style="display:flex;gap:10px"><div style="flex:1"><label class="fl">바뀐 시작일</label>'
          +'<input type="date" id="sd1" style="width:100%;padding:10px;border:1.5px solid var(--line);border-radius:9px;font-size:14px"></div>'
          +'<div style="flex:1"><label class="fl">바뀐 종료일</label>'
