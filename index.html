  function msg(id,t,bad){
    var e=document.getElementById(id); if(!e) return;
    e.innerHTML=t; e.style.color=bad?'var(--bad,#c0392b)':'';
  }

  function bindIn(){
    var go=document.getElementById('lgo');
    function run(){
      var n=(document.getElementById('lname').value||'').trim();
      var pin=(document.getElementById('lpin').value||'').trim();
      if(n.replace(/\s/g,'').length<2){ msg('lmsg','성과 이름을 다 적어 주십시오.',1); return; }
      if(!/^\d{4}$/.test(pin)){ msg('lmsg','비밀번호는 숫자 4자리입니다.',1); return; }
      go.disabled=true; msg('lmsg','확인하는 중…');
      AUTH.load().then(function(){
        var r=AUTH.login(n,pin);
        go.disabled=false;
        if(r===0){
          if(GATE){ ungate(); if(typeof DGCAL!=='undefined'&&DGCAL.refresh) DGCAL.refresh(); }
          else close();
          if(typeof DGCAL!=='undefined'&&DGCAL.whoPaint) DGCAL.whoPaint();
          if(typeof DGSYNC==='function') DGSYNC();       // 다른 기기에서 담은 즐겨찾기를 받아온다
          if(after){ var f=after; after=null; f(); } return; }
        if(r===1) msg('lmsg','그 이름으로 신청된 것이 없습니다. 위의 <b>「처음이신가요」</b>에서 먼저 신청해 주십시오.',1);
        else if(r===2) msg('lmsg','아직 <b>승인 전</b>입니다. 김병진T가 열어 드리면 바로 들어오실 수 있습니다.',1);
        else msg('lmsg','비밀번호가 다릅니다. 잊으셨으면 김병진T에게 말씀해 주십시오.',1);
      }).catch(function(){ go.disabled=false; msg('lmsg','확인하지 못했습니다. 잠시 뒤 다시 해 주십시오.',1); });
    }
    go.onclick=run;
    document.getElementById('lpin').onkeydown=function(e){ if(e.key==='Enter') run(); };
  }

  function bindUp(){
    var go=document.getElementById('ugo');
    go.onclick=function(){
      var n=(document.getElementById('uname').value||'').trim();
      var o=(document.getElementById('uorg').value||'').trim();
      var r=(p.querySelector('input[name="urole"]:checked')||{}).value||'parent';
      var a=(document.getElementById('upin').value||'').trim();
      var b=(document.getElementById('upin2').value||'').trim();
      if(n.replace(/\s/g,'').length<2){ msg('umsg','성과 이름을 다 적어 주십시오.',1); return; }
      if(!/^\d{4}$/.test(a)){ msg('umsg','비밀번호는 숫자 4자리입니다.',1); return; }
      if(a!==b){ msg('umsg','두 번 적으신 비밀번호가 다릅니다.',1); return; }
      go.disabled=true; msg('umsg','보내는 중…');
      AUTH.signup(n,o,a,r).then(function(){
        var rn=(r==='parent')?'학부모':'학원 관계자';

          +'<b>'+esc(n)+'</b> 님이 <b>'+rn+'</b>로 신청되었습니다.<br>'
          +'김병진T가 확인한 뒤 열어 드립니다. 열리면 <b>같은 이름과 비밀번호</b>로 로그인하시면 됩니다.<br>'
          +'비밀번호는 잊지 마십시오 — 저장된 것이 지문뿐이라 알려 드릴 수가 없습니다.'
          +'</div><div class="acts"><button class="btn ghost" id="lclose">'+(GATE?'로그인 화면으로':'닫기')+'</button></div></div>';
        var xb2=document.getElementById('lx'); if(xb2) xb2.onclick=close;
        document.getElementById('lclose').onclick=function(){ if(GATE) draw('in'); else close(); };
      }).catch(function(){ go.disabled=false; msg('umsg','보내지 못했습니다. 잠시 뒤 다시 해 주십시오.',1); });
    };
  }

  /* 로그인해야 되는 일을 감싼다 */
  function need(fn){
    if(!AUTH.on()){ fn(); return; }          // 저장소가 없으면 예전처럼 그냥 쓴다
    if(AUTH.me()){ fn(); return; }
    open('in', fn);
  }
  function needEdit(fn){
    if(!AUTH.on()){ fn(); return; }
    if(AUTH.me()){
      if(AUTH.canEdit && AUTH.canEdit()){ fn(); return; }
      alert('학부모 계정은 정보 수정이 불가능합니다. 학교 일정과 학원 정보는 보실 수 있습니다.');
      return;
    }
    open('in', function(){
      if(AUTH.canEdit && AUTH.canEdit()) fn();
      else alert('학부모 계정은 정보 수정이 불가능합니다. 학교 일정과 학원 정보는 보실 수 있습니다.');
    });
  }

  return {open:open, close:close, need:need, needEdit:needEdit, gate:gate, ungate:ungate};
})();
</script>
<script>/* ===== 수정 제안 ===== */
var SUGGEST=(function(){
  var API='/api/suggest';
  var DEMO=(location.protocol==='file:');   // 파일로 열면 시늉만 낸다 (시안)
  var READY=DEMO;                            // 서버가 살아 있으면 true
  if(!DEMO){
    fetch(API,{method:'GET'}).then(function(r){ READY=(r.status!==404); })
      .catch(function(){ READY=false; });
  }
  READY=false;   // 2단계(자동 전송) 붙기 전까지는 복사해서 보내기
  var ME=null;
  try{ ME=JSON.parse(localStorage.getItem('dgcal.me')||'null'); }catch(e){}
  function DIRECT(){ return typeof STORE!=='undefined' && STORE.on(); }   // 바로 고칠 수 있는가
  /* 성적(등급컷·평균) 칸을 볼 수 있는가 — 지금은 관리자만 */
  function CANSCORE(){
    if(typeof SHOW_SCORE!=='undefined' && SHOW_SCORE) return true;
    return typeof AUTH!=='undefined' && AUTH.isAdmin && AUTH.isAdmin();
  }
  /* 그 학교 그 학년 그 학기에 배우는 과목이 확정돼 있는가
     — 고1과 중학교는 전국이 같아 늘 확정, 고2·고3은 등록돼 있어야 한다 */
  function fixedSubjects(lvl, name, grade, sem){
    var reg=((DATA.subjects||{})[name]||{})[grade];
    if(lvl==='중'){
      return {fixed:true, list:DEPTS.map(function(d){ return d+' '+grade+'학년'; })};
    }
    if(lvl==='고' && grade==='1'){
      var out=[];
      DEPTS.forEach(function(d){ var c=G1_COMMON[d]; if(c) out=out.concat(c[sem==='2'?1:0]); });
      if(reg) (reg[sem]||[]).forEach(function(x){ if(out.indexOf(x)<0) out.push(x); });
      return {fixed:true, list:out};
    }
    if(reg && (reg[sem]||[]).length) return {fixed:true, list:(reg[sem]||[]).slice()};
    return {fixed:false, list:[]};
  }

  /* 이 학교에 이미 들어 있는 시험범위가 어느 학년 어느 시험인가
     ★ 「고쳐 주기」를 누르면 ★그 자리부터★ 열어야 한다.
       1학기 중간(빈 칸)이 먼저 열리면 「등록된 게 안 보인다」로 읽힌다. */
  function rngHas(name){
    var r=(DATA.ranges||{})[name]||{}, out=[];
    Object.keys(r).forEach(function(gr){
      Object.keys(r[gr]||{}).forEach(function(ex){
        var n=(r[gr][ex]||[]).length;
        if(n) out.push({g:String(gr), e:String(ex), n:n});
      });
    });
    out.sort(function(a,b){ return a.e===b.e ? (a.g<b.g?-1:1) : (+b.e)-(+a.e); });  // 늦은 시험 먼저
    return out;
  }

  /* 오늘이 몇 학기인가 — 그 학교 2학기 개학일로 본다 */
  function semNow(g){
    var se=null;
    (g.rows||[]).forEach(function(r){ if(r.se && !se) se=r.se; });
    if(!se) return (new Date().getMonth()+1)>=8 ? '2' : '1';
    var p=se.split('-'), d=new Date(+p[0],+p[1]-1,+p[2]);
    return (new Date()>=d) ? '2' : '1';
  }
  function WHO(){                                     // 로그인했으면 그 이름으로 고정
    var a=(typeof AUTH!=='undefined' && AUTH.on()) ? AUTH.me() : null;
    if(a) return {name:a.n, org:a.o||'', fixed:true};
    return {name:(ME&&ME.name)||'', org:(ME&&ME.org)||'', fixed:false};
  }

  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}

  var SUBJ={
    '고':['공통수학1','공통수학2','대수','미적분1','확률과 통계','미적분2','기하','경제 수학','인공지능 수학','기타'],
    '중':['1학년','2학년','3학년','기타'],
    '초':['기타'], '특수':['기타'], '각종':['기타']
  };
  var curD='수학';   // 창을 열 때 첫 화면에서 고른 교과를 따른다
  var EXNAME=['1학기 중간','1학기 기말','2학기 중간','2학기 기말'];

  function open(g, tab){
    if(typeof AUTH!=='undefined' && AUTH.on() && AUTH.me() && AUTH.canEdit && !AUTH.canEdit()){
      alert('학부모 계정은 정보 수정이 불가능합니다. 학교 일정과 학원 정보는 보실 수 있습니다.');
      return;
    }
    var p=document.getElementById('spanel'), kind=tab||'book';

    function form(){

        h+='<div class="dtab">'+DEPTS.map(function(d){
          return '<button data-d="'+d+'" class="'+(d===curD?'on':'')+'">'+d+'</button>';}).join('')+'</div>';

      h+='<div class="gtab wrap" style="margin-bottom:14px">'

        +(g.lvl==='고'?'<button data-k="subj" class="'+(kind==='subj'?'on':'')+'">한 해 과목 한꺼번에</button>':'')
        +(g.lvl!=='초'?'<button data-k="rng" class="'+(kind==='rng'?'on':'')+'">시험범위</button>':'')
        +(g.lvl!=='초'?'<button data-k="plan" class="'+(kind==='plan'?'on':'')+'">시험 시간표</button>':'')
        +(g.lvl!=='초'&&CANSCORE()?'<button data-k="score" class="'+(kind==='score'?'on':'')+'">등급컷 · 평균</button>':'')
        +'<button data-k="exam" class="'+(kind==='exam'?'on':'')+'">시험일정 정정</button></div>';
      if(kind==='book'){
        h+='<label class="fl">학년</label><div class="checks">'
          + ['1','2','3'].map(function(x,i){
              return '<label><input type="radio" name="sgr" value="'+x+'"'+(i===0?' checked':'')+'> '+x+'학년</label>';}).join('')
          +'</div>'
          +'<label class="fl">몇 학기</label><div class="checks">'
          +'<label><input type="radio" name="ssem" value="1" checked> 1학기</label>'
          +'<label><input type="radio" name="ssem" value="2"> 2학기</label>'
          +'<label><input type="radio" name="ssem" value="12"> 두 학기 다</label></div>'
          +'<label class="fl">과목 <span class="hint" style="font-weight:600;margin:0">— 같은 책을 쓰면 여러 개 고르셔도 됩니다</span></label>'
          +'<div class="checks" id="subbox"></div>'
          +'<label class="fl">교과서 출판사</label>'
          +'<input type="text" id="spub" placeholder="예: 비상교육 / 좋은책신사고 / 지학사">'
          +'<div class="hint" id="pubnow">모르시면 비워 두셔도 됩니다.</div>'
          +'<label class="fl">부교재 이름</label>'
          +'<input type="text" id="sbook" placeholder="예: 올림포스 유형편 / 부교재 없음">'
          +'<div class="hint" id="booknow">모르시면 비워 두셔도 됩니다.</div>'

    function draw(){

          } else {

    /* ---------- 시험 시간표 칸 그리기 (260830 — 학년별 · 교시별) ---------- */
    var PDAYS=[], PMAX=3;
    function paintPlan(){
      var body=document.getElementById('pbody'); if(!body) return;
      function yrNow(){ return (typeof YEARS!=='undefined')?YEARS[0]:'2026'; }
      function pick(){
        var v=String((p.querySelector('input[name=pgr]:checked')||{}).value||'0:1').split(':');
        return {gi:+v[0]||0, gr:v[1]||'1'};
      }
      /* 저장된 자리 하나 — 새 학년키로 먼저 찾고, 없으면 옛 행키(「1~2」)도 본다 */
      function slotOf(gi,gr,ei){
        var r=g.rows[gi]||{}, k=(ei<2?'1':'2')+(ei%2===0?'중간':'기말');
        var yy=(((DATA.plans||{})[g.name]||{})[yrNow()])||{};
        var e=(yy[gr]||{})[k];
        if(!e && String(gr)!==String(r.grade||'')) e=(yy[String(r.grade||'')]||{})[k];
        return e||null;
      }
      /* 과목 이름 자동완성 — 그 학교 그 학년에 등록된 것으로 채운다 */
      function sjList(gr,ei){
        var out=['자습','정규수업'], sm=(ei<2)?'1':'2';
        var reg=((DATA.subjects||{})[g.name]||{})[gr]||{};
        (reg[sm]||[]).forEach(function(x){ if(x&&out.indexOf(x)<0) out.push(x); });
        if(g.lvl==='고' && gr==='1' && typeof G1_COMMON!=='undefined'){
          Object.keys(G1_COMMON).forEach(function(d){
            ((G1_COMMON[d]||[])[sm==='1'?0:1]||[]).forEach(function(x){ if(out.indexOf(x)<0) out.push(x); }); });
        }
        var bk=((DATA.books||{})[g.name]||{})[gr];
        if(bk) (bk.items||[]).forEach(function(it){ if(it&&it[0]&&out.indexOf(it[0])<0) out.push(it[0]); });
        return out;
      }
      function grab(){
        var m={};
        body.querySelectorAll('.pin3').forEach(function(x){

      function fill(pre){

          if(sb) sb.disabled=true; return;
        }
        var old=slotOf(s2.gi,s2.gr,ei)||{}, op=old.periods||{}, od=old.days||{};

          PMAX=3;

        function val(d2,i2){
          if(pre) return (pre[d2]||[])[i2]||'';
          if(op[d2]) return op[d2][i2]||'';
          return (i2===0 && od[d2]) ? od[d2] : '';      /* 옛 자료(한 줄)는 1교시 칸에 얹어 준다 */
        }
        /* 다른 학년에 이미 넣은 것이 있으면 베끼기 단추를 붙인다 */

        var h='<div class="ppbar"><button type="button" id="ppadd">＋ 교시 늘리기</button>'

          +'</div>'
          +'<label class="fl">날짜 · 교시별 과목</label>';
        var sj=sjList(s2.gr,ei);
        var d=new Date(e[0].split('-')[0], +e[0].split('-')[1]-1, +e[0].split('-')[2]);
        var e0=e[1]||e[0];
        var end=new Date(e0.split('-')[0], +e0.split('-')[1]-1, +e0.split('-')[2]);
        while(d<=end){
          var key=d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2);
          var wd='일월화수목금토'[d.getDay()];
          PDAYS.push(key);
          h+='<div class="ppday"><div class="ppdh">'+(d.getMonth()+1)+'월 '+d.getDate()+'일('+wd+')'
            +'<span class="ppno">'+PMAX+'교시까지</span></div>';
          for(var i2=0;i2<PMAX;i2++){
            var t=(typeof TT_TIME!=='undefined'&&TT_TIME[i2])||[(i2+1)+'교시','',''];
            var vv=val(key,i2);
            h+='<div class="pprow"><div class="ppl">'+t[0]+(t[2]?'<span>'+t[2]+'</span>':'')+'</div>'
              +'<input type="text" class="pin3" list="ppsj" data-d="'+key+'" data-p="'+i2+'" '
              +'placeholder="비우면 시험 없음" value="'+esc(vv)+'">'
              +'<button type="button" class="ppj'+(vv==='자습'?' on':'')+'" data-d="'+key+'" data-p="'+i2+'">자습</button></div>';
          }
          h+='</div>';
          d.setDate(d.getDate()+1);
        }
        h+='<datalist id="ppsj">'+sj.map(function(x){return '<option value="'+esc(x)+'">';}).join('')+'</datalist>';

        document.getElementById('ppadd').onclick=function(){ if(PMAX<8){ var m=grab(); PMAX++; fill(m); } };
        document.getElementById('ppdel').onclick=function(){ if(PMAX>1){ var m=grab(); PMAX--; fill(m); } };
        body.querySelectorAll('button.ppcp').forEach(function(b2){ b2.onclick=function(){
          var v=String(b2.dataset.v).split(':'), o=slotOf(+v[0],v[1],ei);
          if(!o||!o.periods) return;
          var m={}, mx=1;
          PDAYS.forEach(function(k2){ m[k2]=(o.periods[k2]||[]).slice(); if(m[k2].length>mx) mx=m[k2].length; });
          PMAX=Math.min(8,Math.max(1,mx)); fill(m);
        }; });
        body.querySelectorAll('button.ppj').forEach(function(b3){ b3.onclick=function(){
          var inp=body.querySelector('.pin3[data-d="'+b3.dataset.d+'"][data-p="'+b3.dataset.p+'"]');
          if(!inp) return;
          if(inp.value==='자습'){ inp.value=''; b3.classList.remove('on'); }
          else{ inp.value='자습'; b3.classList.add('on'); }
        }; });
        body.querySelectorAll('.pin3').forEach(function(x){ x.oninput=function(){
          var bb=body.querySelector('button.ppj[data-d="'+x.dataset.d+'"][data-p="'+x.dataset.p+'"]');
          if(bb) bb.classList.toggle('on', x.value==='자습');
        }; });
      }
      p.querySelectorAll('input[name=pgr],input[name=pex]').forEach(function(x){
        x.onchange=function(){ fill(null); }; });

    /* ---------- 등급컷 · 평균 칸 그리기 ---------- */

                 ? yr+'학년도 '+gr+'학년이 배우던 과목입니다. 지난 자료라 <b>목록에서 직접 고르시면 됩니다.</b>'
                 : '이 학교 '+gr+'학년 '+sem+'학기에 <b>배우는 과목</b>만 나옵니다.')+'</div>'
             : '<div class="hint" style="color:var(--red)"><b>이 학교 '+gr+'학년 '+sem+'학기 과목이 아직 등록되지 않았습니다.</b><br>'
               +'그래서 지금은 넣을 수 없습니다. 앞의 <b>「한 해 과목 한꺼번에」</b>에서 배우는 과목을 먼저 등록해 주십시오.</div>');

          +'<input type="text" id="scavg" inputmode="decimal" placeholder="평균 (예: 42.7)"'+dis+'>'
          +'<input type="text" id="scsd" inputmode="decimal" placeholder="표준편차"'+dis+'>'
          +'<input type="text" id="scn" inputmode="numeric" placeholder="응시 인원"'+dis+'></div>'
          +'<div class="hint">표준편차까지 있으면 「몇 점이면 상위 몇 %」를 낼 수 있습니다. 성적표에 같이 찍혀 나옵니다.</div>';
        if(nG){
          h+='<label class="fl">등급컷 (원점수) — '+nG+'등급제</label><div class="cuts">';
          for(var i=1;i<nG;i++) h+='<label><span>'+i+'</span>'
            +'<input type="text" class="cut" data-i="'+i+'" inputmode="numeric" placeholder="-"'+dis+'></label>';
          h+='</div><div class="hint">아는 등급만 넣으셔도 됩니다. '
            +(nG===9?'9등급제입니다.':'5등급제입니다.')+'</div>';
        }else{
          h+='<div class="hint">중학교는 석차등급이 없어 <b>평균만</b> 받습니다.</div>';
        }
        h+='<label class="fl">어디서 나온 값입니까</label><div class="checks">'
          +'<label><input type="radio" name="scsrc" value="학교 공식" checked'+dis+'> 학교 공식 발표</label>'
          +'<label><input type="radio" name="scsrc" value="성적표"'+dis+'> 성적표에서</label>'
          +'<label><input type="radio" name="scsrc" value="기타"'+dis+'> 그 밖</label></div>'

      /* 지금 등록된 값을 칸에 채운다 — 한 칸만 고치실 수 있게 */
      function scNow(){
        var yr=(p.querySelector('input[name=syr]:checked')||{}).value||YEARS[0];
        var gr=(p.querySelector('input[name=sgr5]:checked')||{}).value||'1';
        var sem=(p.querySelector('input[name=ssem5]:checked')||{}).value||'1';
        var ex=(p.querySelector('input[name=sex5]:checked')||{}).value||'중간';
        var sub=(document.getElementById('scsel')||{}).value||'';
        var slot=((((DATA.scores||{})[g.name]||{})[yr]||{})[gr]||{})[sem+ex]||{};

        put('scavg', v&&v.avg); put('scsd', v&&v.sd); put('scn', v&&v.n);

          var c=(v&&v.cuts)||[], q=c[+x.dataset.i-1]; x.value=(q==null?'':q); });

    /* ---------- 한 해 과목 칸 — 지금 등록된 것에 체크해 둔다 ----------
       ★ 다른 교과(국어·영어…) 과목은 이 화면에 안 나온다.
         그대로 두지 않으면 보내는 순간 지워지므로 SJKEEP 에 담아 함께 보낸다. */
    var SJKEEP={'1':[], '2':[]};
    function paintSubj(){
      function fill(){
        var gr=(p.querySelector('input[name=sgr3]:checked')||{}).value||'2';
        var reg=((DATA.subjects||{})[g.name]||{})[gr]||{};
        var kept=[];
        ['1','2'].forEach(function(sm){
          var box=document.getElementById('sj'+sm); if(!box) return;
          var have=(reg[sm]||[]).slice();
          var ins=Array.prototype.slice.call(box.querySelectorAll('input'));
          var opts=ins.map(function(x){ return x.value; });
          SJKEEP[sm]=have.filter(function(x){ return opts.indexOf(x)<0; });
          SJKEEP[sm].forEach(function(x){ if(kept.indexOf(x)<0) kept.push(x); });
          ins.forEach(function(x){ x.checked = have.indexOf(x.value)>=0; });
        });
        var now=document.getElementById('sjnow');
        if(!now) return;
        var any=(reg['1']||[]).length||(reg['2']||[]).length;

          ? '<b style="color:var(--gold)">지금 등록된 과목에 체크해 두었습니다.</b> 더할 것만 누르고, 뺄 것은 체크를 지우십시오.'
          : '아직 등록된 것이 없습니다.')
          + (kept.length ? '<br>다른 교과 과목 <b>'+kept.length+'개</b>('+esc(kept.join(' · '))+')는 그대로 둡니다.' : '');
      }
      p.querySelectorAll('input[name=sgr3]').forEach(function(x){ x.addEventListener('change', fill); });
      fill();
    }

    function send(){

      }else if(kind==='plan'){
        var pv=String((p.querySelector('input[name=pgr]:checked')||{}).value||'0:1').split(':');
        var gi2=+pv[0]||0;
        var ei2=+(p.querySelector('input[name=pex]:checked')||{}).value||0;
        body.year=(typeof YEARS!=='undefined')?YEARS[0]:'2026';
        body.grade=pv[1]||((g.rows[gi2]||{}).grade||'1');
        body.sem=(ei2<2)?'1':'2';
        body.exam=(ei2%2===0)?'중간':'기말';
        /* 260830 — periods 가 참값이고, days 는 그것을 한 줄로 접은 것이다(옛 화면이 그대로 읽는다) */
        body.days={}; body.periods={};
        var PV={};
        p.querySelectorAll('.pin3').forEach(function(x){
          (PV[x.dataset.d]=PV[x.dataset.d]||[])[+x.dataset.p]=(x.value||'').trim(); });
        PDAYS.forEach(function(d2){
          var a=(PV[d2]||[]).slice();
          for(var i3=0;i3<a.length;i3++) if(a[i3]==null) a[i3]='';

          var real=a.filter(function(v){ return v && v!=='자습' && v!=='정규수업'; });

        body.grade=(p.querySelector('input[name=sgr5]:checked')||{}).value;
        body.sem=(p.querySelector('input[name=ssem5]:checked')||{}).value;
        body.exam=(p.querySelector('input[name=sex5]:checked')||{}).value;
        body.subject=(document.getElementById('scsel')||{}).value||'';
        var num=function(id){ var v=(document.getElementById(id).value||'').trim();
                              return v===''?null:(isNaN(+v)?null:+v); };
        body.avg=num('scavg'); body.sd=num('scsd'); body.n=num('scn');
        body.cuts=[];
        p.querySelectorAll('.cut').forEach(function(x){
          var v=(x.value||'').trim(); body.cuts[+x.dataset.i-1]= v===''?null:(isNaN(+v)?null:+v); });
        body.src=(p.querySelector('input[name=scsrc]:checked')||{}).value||'';
        if(body.avg===null && !body.cuts.filter(function(x){return x!=null;}).length){
          alert('평균이나 등급컷 중 하나는 넣어 주십시오.'); return; }
      }else{
        body.exam=+document.getElementById('sex').value;
        var gr=p.querySelector('input[name=sgr2]:checked');
        body.gradeIdx=gr?+gr.value:0;
        body.start=document.getElementById('sd1').value;
        body.end=document.getElementById('sd2').value;
        if(!body.start && !(body.note||'').length){ alert('바뀐 날짜를 넣거나, 한마디에 사정을 적어 주십시오.'); return; }
      }
      try{ localStorage.setItem('dgcal.me', JSON.stringify({name:name,org:org,show:show})); }catch(e){}
      var btn=document.getElementById('ssend');
      if(typeof STORE!=='undefined' && STORE.on()){      // 바로 고치기
        btn.disabled=true; btn.textContent='고치는 중…';
        STORE.add(body).then(function(){
          if(typeof DGCAL!=='undefined' && DGCAL.refresh) DGCAL.refresh();
          saved(body);
        }).catch(function(){
          btn.disabled=false; btn.textContent='바로 고치기';
          alert('고치지 못했습니다. 인터넷을 확인하시고 다시 눌러 주십시오.\n그래도 안 되면 아래 글을 복사해서 보내 주십시오.');
          handoff(body);
        });
        return;
      }
      if(!READY || DEMO){ handoff(body); return; }
      btn.disabled=true; btn.textContent='보내는 중…';
      fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})
        .then(function(r){ if(!r.ok) throw 0; return r.json(); })
        .then(function(){ done(body); })
        .catch(function(){ btn.disabled=false; btn.textContent='보내기';
          alert('보내지 못했습니다. 잠시 뒤 다시 해 주십시오.'); });
    }
    function textOf(b){
      var L=['[학사일정 수정 제안]', b.school];
    if(b.dept) L.push('교과 : '+b.dept);
      if(b.kind==='book'){
        var pubCh = b.pub && b.pub!==b.pub0;
        var bkCh  = b.book && b.book!==b.book0;
        var what=[]; if(pubCh) what.push('교과서'); if(bkCh) what.push('부교재');
        L.push('구분 : '+(what.length? what.join(' · ')+' 고침' : '배우는 과목'));
        L.push('학년 : '+(b.grade||'-')+'학년 '+(b.sem==='12'?'1·2학기':b.sem+'학기'));
        L.push('과목 : '+b.subjects.join(' · '));
        function line(label, now, val){
          if(!val) return label+' : (모름)';
          if(!now)  return label+' : '+val;
          if(now===val) return label+' : '+val+'  (그대로)';
          return label+' : '+now+'  →  ★'+val;
        }
        L.push(line('교과서', b.pub0, b.pub));
        L.push(line('부교재', b.book0, b.book));
      }else if(b.kind==='subj'){
        L.push('구분 : 배우는 과목');
        L.push('학년 : '+(b.grade||'-')+'학년');
        L.push('1학기 : '+(b.sj1.length? b.sj1.join(' · ') : '(없음)'));
        L.push('2학기 : '+(b.sj2.length? b.sj2.join(' · ') : '(없음)'));
      }else if(b.kind==='rng'){
        L.push('구분 : 시험범위');
        L.push('시험 : '+EXNAME[b.exam]);
        L.push('학년 : '+(b.grade||'-')+'학년');
        L.push('범위 :');
        b.ranges.split('\n').forEach(function(x){ if(x.trim()) L.push('  '+x.trim()); });
      }else if(b.kind==='plan'){
        L.push('구분 : 시험 시간표');
        L.push('학년 : '+(b.year||'')+'학년도 '+(b.grade||'-')+'학년 '+(b.sem||'-')+'학기 '+(b.exam||'')+'고사');
        if(b.periods && Object.keys(b.periods).length){         /* 260830 — 교시별로 적는다 */
          Object.keys(b.periods).sort().forEach(function(k){
            var q=k.split('-');
            L.push('  '+(+q[1])+'/'+(+q[2])+' :');
            (b.periods[k]||[]).forEach(function(v,i){
              L.push('    '+(i+1)+'교시 : '+(v||'(없음)')); });
          });
        }else{
          Object.keys(b.days||{}).sort().forEach(function(k){
            var q=k.split('-'); L.push('  '+(+q[1])+'/'+(+q[2])+' : '+b.days[k]); });
        }
      }else if(b.kind==='score'){
        L.push('구분 : 등급컷 · 평균');
        L.push('학년 : '+(b.year||'')+'학년도 '+(b.grade||'-')+'학년 '+(b.sem||'-')+'학기 '+(b.exam||'')+'고사');
        L.push('과목 : '+(b.subject||''));
        if(b.avg!=null) L.push('평균 : '+b.avg+(b.sd!=null?'  (표준편차 '+b.sd+')':'')+(b.n!=null?'  응시 '+b.n+'명':''));
        var cs=(b.cuts||[]).map(function(v,i){ return v==null?null:((i+1)+'등급 '+v); }).filter(Boolean);
        if(cs.length) L.push('등급컷 : '+cs.join(' · '));
        if(b.src) L.push('출처 : '+b.src);
      }else{
        L.push('구분 : 시험일정 정정');
        L.push('시험 : '+EXNAME[b.exam]);
        if(g.rows.length>1) L.push('학년 : '+((g.rows[b.gradeIdx]||{}).grade||'-')+'학년');
        L.push('바뀐 날짜 : '+(b.start? b.start+(b.end&&b.end!==b.start?' ~ '+b.end:'') : '(적지 않음)'));
      }
      if(b.note) L.push('근거 : '+b.note);
      L.push('보낸 이 : '+b.name+(b.org? ' ('+b.org+')':''));
      if(b.show===false) L.push('  ※ 화면에는 「익명」으로 넣어 주십시오');
      return L.join('\n');
    }
    function handoff(b){
      var t=textOf(b);
      p.innerHTML='<div class="ph"><h2>이 글을 보내 주십시오</h2><button class="x" id="sx">×</button></div>'
        +'<div class="pb"><div class="hint" style="margin:0 0 9px">아래 글을 복사해서 <b>단톡방이나 문자로</b> 김병진T에게 보내 주십시오. 확인 뒤 모두의 화면에 반영됩니다.</div>'
        +'<textarea id="sout" readonly style="width:100%;height:186px;padding:12px;border:1.5px solid var(--line);'
        +'border-radius:9px;font-size:13.5px;line-height:1.7;resize:vertical;background:var(--surface2);color:var(--ink);'
        +'font-family:inherit">'+esc(t)+'</textarea>'
        +'<div class="acts"><button class="btn" id="scopy">글 복사하기</button>'
        +'<button class="btn ghost" id="sclose">닫기</button></div>'
        +'<div class="hint" id="scopied">복사한 뒤 단톡방에 붙여넣기 하시면 됩니다.</div></div>';
      document.getElementById('sx').onclick=close;
      document.getElementById('sclose').onclick=close;
      document.getElementById('scopy').onclick=function(){
        var ta=document.getElementById('sout');
        ta.focus(); ta.select(); try{ ta.setSelectionRange(0,99999); }catch(e){}
        var ok=false; try{ ok=document.execCommand('copy'); }catch(e){}
        if(navigator.clipboard&&navigator.clipboard.writeText){
          navigator.clipboard.writeText(ta.value).then(function(){ mark(true); },function(){ mark(ok); });
        } else mark(ok);
      };
      function mark(ok){
        document.getElementById('scopied').innerHTML = ok
          ? '<b style="color:var(--teal)">복사했습니다.</b> 단톡방에 붙여넣기 하시면 됩니다.'
          : '복사가 안 되면 글을 길게 눌러 직접 복사해 주십시오.';
        var c=document.getElementById('scopy'); c.textContent='복사됨';
        setTimeout(function(){ c.textContent='글 복사하기'; },1800);
      }
    }
    function done(b){
      p.innerHTML='<div class="ph"><h2>보냈습니다</h2><button class="x" id="sx">×</button></div>'
        +'<div class="pb"><div class="notice">'
        +'<b>'+esc(b.school)+'</b> 건이 김병진T에게 전달되었습니다.<br>'
        +'확인 뒤 화면에 반영됩니다. 그 전에는 다른 분께 보이지 않습니다.'
        +'</div><div class="acts"><button class="btn ghost" id="sclose">닫기</button></div></div>';
      document.getElementById('sx').onclick=close;
      document.getElementById('sclose').onclick=close;
    }
    function saved(b){
      p.innerHTML='<div class="ph"><h2>고쳤습니다</h2><button class="x" id="sx">×</button></div>'
        +'<div class="pb"><div class="notice">'
        +'<b>'+esc(b.school)+'</b> 정보가 바뀌었습니다. <b>모든 선생님 화면에 바로 반영됩니다.</b><br>'
        +'잘못 넣으셨으면 다시 고쳐 주시면 됩니다 — 나중에 넣은 것이 이깁니다.<br>'
        +'고친 내역은 남으니 언제든 되돌릴 수 있습니다.'
        +'</div><div class="acts"><button class="btn ghost" id="sclose">닫기</button></div></div>';
      document.getElementById('sx').onclick=close;
      document.getElementById('sclose').onclick=close;
    }
    draw(); document.getElementById('ssheet').classList.add('on');
  }
  function close(){ document.getElementById('ssheet').classList.remove('on'); }
  return {open:open, close:close, ready:function(){return READY;}};
})();
</script>

    +'<p class="ht">오른쪽 위 <b>「인쇄 · 내보내기」</b> 를 누릅니다. <b>학원 이름</b>을 넣으면 인쇄물 맨 위에 찍히고, 한 번 넣으면 기억합니다.<br>'
    +'<b>PDF</b> — 인쇄 창에서 «대상»을 «PDF로 저장»으로 고르시면 파일로 남습니다. 휴대폰에서도 됩니다 (아이폰은 공유에서 「PDF로 저장」, 안드로이드는 프린터 목록에서 「PDF로 저장」).<br>'
    +'<b>엑셀</b> — 바로 파일이 내려받아집니다. 휴대폰에서도 파일로 떨어집니다.</p>'
    +'<h3>11 · 늘 최신입니다</h3>'
    +'<p class="ht">자료가 고쳐지면 <b>다음에 이 주소를 여는 순간 새것이 보입니다.</b> 따로 받으실 것이 없습니다.<br>'
    +'화면 맨 아래 <b>「자료 판」</b> 과 <b>「화면 판」</b> 으로 언제 것인지 확인하실 수 있습니다. 옛것이 보이면 새로고침(F5)을 한 번 눌러 주십시오.<br>'
    +'<span class="hnote">바탕화면에 추가해 두신 분은 아이콘이 옛 화면을 붙들고 있을 수 있습니다. 화면이 이상하면 아이콘을 지우고 링크로 다시 들어가 다시 추가해 주십시오.</span></p>'
    +'<h3>12 · 알아 두실 것</h3>'
    +'<p class="ht"><b>초등학교에 시험이 없는 것은 정상입니다.</b> 정기시험을 치지 않습니다. 자료가 빠진 것이 아닙니다.<br>'
    +'<b>일부 학교는 시험일이 비어 있습니다.</b> 그 학교가 나이스에 아직 안 올린 것입니다. 아시면 7번에서 넣어 주십시오.<br>'
    +'<b>부교재는 학원 자체 조사분</b>이라 학사일정과 출처가 다릅니다.</p>'
    +'<div class="notice" style="margin-top:18px">중요한 날짜는 학교 공지로 한 번 더 확인해 주십시오. 학교 사정으로 바뀔 수 있습니다.</div>'
    +'</div>';
    document.getElementById('hx').onclick=close;
    document.getElementById('hsheet').classList.add('on');
  }
  function close(){ document.getElementById('hsheet').classList.remove('on'); }
  return {open:open, close:close};
})();
</script>
<script>/* ===== 달력 보기 ===== */
var CAL=(function(){
  var MONTHS=[];   // 학년도 2026-03 ~ 2027-02
  for(var i=0;i<12;i++){ var m=3+i; MONTHS.push(m<=12?[2026,m]:[2027,m-12]); }
  var cur=0;
  var W=['일','월','화','수','목','금','토'];

  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
  function abbr(n){
    return n.replace('여자고등학교','여고').replace('여자중학교','여중')
            .replace('여자상업고등학교','여상').replace('고등학교','고')
            .replace('중학교','중').replace('초등학교','초').replace('학교','').trim();
  }
  function key(y,m,d){ return y+'-'+('0'+m).slice(-2)+'-'+('0'+d).slice(-2); }
  function parse(s){ var p=s.split('-'); return new Date(+p[0],+p[1]-1,+p[2]); }

  /* 학교 묶음 → 날짜별 일정
     ★ 1~2학년과 3학년이 같은 날이면 한 줄로 합친다. 다를 때만 (3) 을 붙인다 */
  function build(groups){
    var map={};
    function put(d,o){ if(!d) return; (map[d]=map[d]||[]).push(o); }
    var EX=['1학기 중간','1학기 기말','2학기 중간','2학기 기말'];

    groups.forEach(function(g){
      var nm=abbr(g.name), rows=g.rows;
      function span(r,i){ var a=r.ex&&r.ex[i]?r.ex[i][0]:null, b=r.ex&&r.ex[i]?r.ex[i][1]:null;
        return a? a+'~'+(b||a) : null; }
      // 시험
      EX.forEach(function(n,i){
        var byKey={};
        rows.forEach(function(r){
          var s=span(r,i); if(!s) return;
          (byKey[s]=byKey[s]||[]).push(String(r.grade||''));
        });
        var keys=Object.keys(byKey);
        keys.forEach(function(s){
          var grades=byKey[s];
          var tag = (keys.length<=1 || rows.length<=1) ? nm
                  : nm+'('+grades.join('·').replace('1~2','1·2')+')';
          var p=s.split('~'), a=parse(p[0]), b=parse(p[1]), first=true;
          for(var t=new Date(a); t<=b; t.setDate(t.getDate()+1)){
            put(key(t.getFullYear(),t.getMonth()+1,t.getDate()),
                {k:(n.indexOf('중간')>=0?'mid':'fin'), t:tag, n:n.replace('학기 ','-'), first:first});
            first=false;
          }
        });
      });
      // 방학 · 개학
      [['ss','여름방학식','va'],['se','2학기 개학','op'],['ws_','겨울방학식','va'],['we','학년말 개학','op']]
      .forEach(function(spec){
        var byDay={};
        rows.forEach(function(r){ var d=r[spec[0]]; if(!d) return;
          (byDay[d]=byDay[d]||[]).push(String(r.grade||'')); });
        var days=Object.keys(byDay);
        days.forEach(function(d){
          var tag=(days.length<=1||rows.length<=1) ? nm
                : nm+'('+byDay[d].join('·').replace('1~2','1·2')+')';
          put(d,{k:spec[2], t:tag, n:spec[1]});
        });
      });
    });
    return map;
  }

  /* 한 달 표 만들기 — mode: 'screen' | 'print' */
  function month(y,m,map,mode){
    var first=new Date(y,m-1,1), start=new Date(first); start.setDate(1-first.getDay());
    var weeks=[], t=new Date(start), used=0;
    for(var w=0;w<6;w++){
      var row=[];
      for(var d=0;d<7;d++){
        var inM=(t.getMonth()===m-1);
        var k=key(t.getFullYear(),t.getMonth()+1,t.getDate());
        var items=(map[k]||[]);
        if(inM&&items.length) used++;
        row.push({d:t.getDate(), inM:inM, dow:d, items:items, k:k});
        t.setDate(t.getDate()+1);
      }
      weeks.push(row);
      if(w>=4 && t.getMonth()!==m-1) break;   // 6주가 필요 없으면 자른다
    }
    var cls = mode==='print' ? 'calp' : 'cals';
    var hstyle = mode==='print' ? ' style="height:'+(Math.floor(1420/weeks.length)/10)+'mm"' : '';
    var h='<table class="cal '+cls+'"><thead><tr>'
      +W.map(function(x,i){ return '<th class="'+(i===0?'sun':i===6?'sat':'')+'">'+x+'</th>'; }).join('')
      +'</tr></thead><tbody>';
    weeks.forEach(function(row){
      h+='<tr>';
      row.forEach(function(c){
        var cc=['cell']; if(!c.inM) cc.push('out');
        if(c.dow===0) cc.push('sun'); if(c.dow===6) cc.push('sat');
        h+='<td class="'+cc.join(' ')+'"'+hstyle+'><div class="dnum">'+c.d+'</div>';
        if(c.inM && c.items.length){
          // 같은 일정끼리 한 줄로 모은다 (한 날에 학교가 많아도 칸이 넘치지 않는다)
          var bag={}, order=[];
          c.items.forEach(function(x){
            var kk=x.k+'|'+x.n;
            if(!bag[kk]){ bag[kk]={k:x.k,n:x.n,names:[],first:false}; order.push(kk); }
            bag[kk].names.push(x.t);
            if(x.first) bag[kk].first=true;
          });
          order.sort(function(a,b){
            var R={mid:0,fin:1,va:2,op:3};
            return R[bag[a].k]-R[bag[b].k];
          });
          h+='<div class="evs">';
          order.forEach(function(kk){
            var e=bag[kk];
            h+='<div class="ev '+e.k+(e.first?' f':'')+'">'
              +'<b>'+esc(e.n)+'</b> '+esc(e.names.join(' · '))+'</div>';
          });
          h+='</div>';
        }
        h+='</td>';
      });
      h+='</tr>';
    });
    return h+'</tbody></table>';
  }

  function titleOf(i){ return MONTHS[i][0]+'년 '+MONTHS[i][1]+'월'; }

  function render(groups){
    var box=document.getElementById('calbox');
    if(!groups.length){
      box.innerHTML='<div class="empty">즐겨찾기가 비어 있습니다.<br>'
        +'목록에서 학교 카드의 별을 눌러 담으시면 그 학교들의 일정이 달력에 나옵니다.</div>';
      return;
    }
    var map=build(groups), y=MONTHS[cur][0], m=MONTHS[cur][1];
    box.innerHTML='<div class="calhead">'
      +'<button class="btn ghost" id="cprev">◀</button>'
      +'<div class="ctitle">'+titleOf(cur)+'</div>'
      +'<button class="btn ghost" id="cnext">▶</button>'
      +'<div class="cnames">'+groups.map(function(g){return esc(abbr(g.name));}).join(' · ')+'</div>'
      +'</div>'+month(y,m,map,'screen')
      +'<div class="callegend"><span class="ev mid">중간고사</span><span class="ev fin">기말고사</span>'
      +'<span class="ev va">방학식</span><span class="ev op">개학</span>'
      +'<span class="hint" style="margin:0">즐겨찾기 '+groups.length+'개교 · 중·고 3학년은 (3) 으로 표시됩니다</span></div>';
    document.getElementById('cprev').onclick=function(){ if(cur>0){cur--; render(groups);} };
    document.getElementById('cnext').onclick=function(){ if(cur<11){cur++; render(groups);} };
  }

  function printCal(groups, org, onlyThis){
    var map=build(groups);
    var list = onlyThis ? [cur] : MONTHS.map(function(_,i){return i;});
    // 일정이 하나도 없는 달은 뺀다 (전체 인쇄일 때)
    if(!onlyThis){
      list=list.filter(function(i){
        var y=MONTHS[i][0], m=MONTHS[i][1];
        for(var d=1;d<=31;d++){ if(map[key(y,m,d)]) return true; }
        return false;
      });
    }
    var names=groups.map(function(g){return abbr(g.name);}).join(' · ');
    var h='';
    list.forEach(function(i,idx){
      var y=MONTHS[i][0], m=MONTHS[i][1];
      h+='<div class="calpage'+(idx<list.length-1?' brk':'')+'">'
        +'<div class="prt-h">'
        +(org?'<div class="prt-org">'+esc(org)+'</div>':'')
        +'<div class="prt-t">'+y+'년 '+m+'월 학사일정</div>'
        +'<div class="prt-d">'+names+'</div></div>'
        +month(y,m,map,'print')
        +'<div class="prt-f">출처 · 대구광역시교육청 「2026학년도 학사일정 현황」 · 자료 판 '+esc(DATA.built)
        +'<br>학교 사정으로 일정이 바뀔 수 있습니다. 중요한 날짜는 학교 공지로 확인해 주십시오.</div></div>';
    });
    if(!h) h='<div class="calpage"><div class="prt-t">인쇄할 일정이 없습니다.</div></div>';
    document.getElementById('print').innerHTML=h;
    setTimeout(function(){ window.print(); },60);
  }

  return {render:render, printCal:printCal, monthTitle:function(){return titleOf(cur);}};
})();
</script>
<script>/* ===== NEIS 학사일정 =====
   인증키는 이 파일이 아니라 ★neis_key.js★ 에 따로 둔다.
   그 파일이 없으면 NEIS 기능만 조용히 꺼진다 (페이지는 그대로 뜬다). */
var NEIS = (function(){
  var KEY = (typeof NEIS_KEY!=='undefined' && NEIS_KEY) ? NEIS_KEY : '';
  var DEF = 'D10';                     // 어느 교육청인지 적어 두지 않은 학교는 대구
  var codeCache = {}, schedCache = {};

  function on(){ return !!KEY; }
  function api(path, qs){
    var u='https://open.neis.go.kr/hub/'+path+'?Type=json&'+qs;
    if(KEY) u+='&KEY='+encodeURIComponent(KEY);
    return fetch(u).then(function(r){ return r.json(); });
  }
  /* 학교마다 제 교육청을 본다 — 경북 학교를 대구에서 찾으면 엉뚱한 곳이 걸린다 */
  function codeOf(name, ofc){
    ofc = ofc || DEF;
    var ck = ofc+'|'+name;
    if(codeCache[ck]) return Promise.resolve(codeCache[ck]);
    return api('schoolInfo','pSize=20&ATPT_OFCDC_SC_CODE='+ofc+'&SCHUL_NM='+encodeURIComponent(name))
      .then(function(j){
        var rows=(j.schoolInfo&&j.schoolInfo[1]&&j.schoolInfo[1].row)||[];
        var hit=rows.filter(function(r){ return r.SCHUL_NM===name; })[0];
        if(!hit) hit=rows.filter(function(r){ return (r.SCHUL_NM||'').indexOf(name)===0; })[0];
        if(!hit) throw new Error('학교를 찾지 못했습니다');
        codeCache[ck]=hit.SD_SCHUL_CODE;
        return hit.SD_SCHUL_CODE;
      });
  }
  function schedule(name, from, to, force, ofc){
    ofc = ofc || DEF;
    var ck=ofc+'|'+name+'|'+from+'|'+to;
    if(schedCache[ck] && !force) return Promise.resolve(schedCache[ck]);
    if(force) delete schedCache[ck];
    return codeOf(name, ofc).then(function(code){
      return api('SchoolSchedule','pIndex=1&pSize=1000&ATPT_OFCDC_SC_CODE='+ofc
                 +'&SD_SCHUL_CODE='+code+'&AA_FROM_YMD='+from+'&AA_TO_YMD='+to);
    }).then(function(j){
      if(j.RESULT) throw new Error(j.RESULT.MESSAGE||'불러오지 못했습니다');
      var rows=(j.SchoolSchedule&&j.SchoolSchedule[1]&&j.SchoolSchedule[1].row)||[];
      var out=rows.map(function(x){
        var g=[]; if(x.ONE_GRADE_EVENT_YN==='Y')g.push('1');
                  if(x.TW_GRADE_EVENT_YN==='Y')g.push('2');
                  if(x.THREE_GRADE_EVENT_YN==='Y')g.push('3');
        return {d:x.AA_YMD, n:(x.EVENT_NM||'').trim(), g:g, sort:(x.SBTR_SCHYSMSTR_SC_NM||'')};
      });
      schedCache[ck]=out;
      return out;
    });
  }
  /* 이어진 날짜를 하나로 묶는다 — 「중간시험」이 나흘이면 한 줄이 된다 */
  function merge(rows){
    var by={};
    rows.forEach(function(x){
      var k=x.n+'|'+x.g.join('');
      (by[k]=by[k]||[]).push(x);
    });
    var out=[];
    Object.keys(by).forEach(function(k){
      var list=by[k].slice().sort(function(a,b){ return a.d<b.d?-1:1; });
      var s=list[0], prev=list[0];
      for(var i=1;i<=list.length;i++){
        var cur=list[i];
        var gap = cur ? (dnum(cur.d)-dnum(prev.d)) : 99;
        if(gap>1){
          out.push({n:s.n, g:s.g, from:s.d, to:prev.d});
          s=cur;
        }
        prev=cur;
      }
    });
    return out.sort(function(a,b){ return a.from<b.from?-1:1; });
  }
  function dnum(d){
    var y=+d.slice(0,4), m=+d.slice(4,6), dd=+d.slice(6,8);
    return Math.floor(Date.UTC(y,m-1,dd)/86400000);
  }
  /* 종류로 가른다 — 학교마다 시험 이름이 제각각이라 먼저 「시험이 아닌 것」을 걷어낸다 */
  var NOTEX=/모의|학력평가|학력고사|학력진단|수능|수학능력|영어듣기|기초학력|학업성취도|직업기초|지역인재|진단평가|선발/;
  function bucket(n){
    if(NOTEX.test(n)) return /모의|학력|수능|수학능력|성취도/.test(n) ? 'mock' : 'etc';
    if(/시험|고사|지필|평가/.test(n)) return 'exam';
    if(/방학|개학|종업|졸업|입학|시업/.test(n)) return 'vac';
    return 'etc';
  }
  return {on:on, schedule:schedule, codeOf:codeOf, merge:merge, bucket:bucket};
})();
</script>
<script>/* ===== NEIS 일정 — 작은 달력 12장 ===== */
var NEISVIEW = (function(){
  var W=['일','월','화','수','목','금','토'];
  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
  function ymd(d){ return {y:+d.slice(0,4), m:+d.slice(4,6), d:+d.slice(6,8)}; }

  /* 날짜 → [행사…] */
  function byDay(rows){
    var m={};
    rows.forEach(function(x){ (m[x.d]=m[x.d]||[]).push(x); });
    return m;
  }
  function kindOf(list){
    var k=['exam','vac','mock','etc'];
    for(var i=0;i<k.length;i++){
      for(var j=0;j<list.length;j++) if(NEIS.bucket(list[j].n)===k[i]) return k[i];
    }
    return 'etc';
  }
  function monthCal(y,m,map){
    var first=new Date(y,m-1,1), start=new Date(first); start.setDate(1-first.getDay());
    var t=new Date(start), h='<div class="mc"><div class="mch">'+y+'.'+m+'</div><table class="mct">';
    h+='<tr>'+W.map(function(w,i){ return '<th class="'+(i===0?'s':i===6?'a':'')+'">'+w+'</th>'; }).join('')+'</tr>';
    for(var r=0;r<6;r++){
      h+='<tr>';
      for(var c=0;c<7;c++){
        var inM=(t.getMonth()===m-1);
        var key=t.getFullYear()+('0'+(t.getMonth()+1)).slice(-2)+('0'+t.getDate()).slice(-2);
        var ev=inM?(map[key]||[]):[];
        var cls=[]; if(!inM) cls.push('o');
        if(ev.length) cls.push('e-'+kindOf(ev));
        var lab='';
        if(ev.length){
          var g0=ev.map(function(x){
            var gg=(x.g&&x.g.length&&x.g.length<3)?'('+x.g.join('·')+'학년)':'';
            return x.n+gg; }).join(' · ');
          lab=' data-ev="'+esc(g0)+'" data-d="'+key+'"';
          cls.push('has');
        }
        h+='<td class="'+cls.join(' ')+'"'+lab+'>'+(inM?t.getDate():'')+'</td>';
        t.setDate(t.getDate()+1);
      }
      h+='</tr>';
      if(r>=3 && t.getMonth()!==m-1) break;
    }
    return h+'</table></div>';
  }
  function render(rows){
    var map=byDay(rows);
    var h='<div class="mctip" id="mctip">색칠된 날짜를 누르면 무슨 날인지 여기에 나옵니다</div>';
    h+='<div class="mcwrap">';
    for(var i=0;i<12;i++){
      var mm=3+i, y=2026, m=mm;
      if(mm>12){ y=2027; m=mm-12; }
      h+=monthCal(y,m,map);
    }
    h+='</div>';
    h+='<div class="mcleg">'
      +'<span class="lg e-exam">시험</span><span class="lg e-vac">방학·개학</span>'
      +'<span class="lg e-mock">모의고사</span><span class="lg e-etc">휴업·행사</span>'
      +'<span class="hint" style="margin:0">날짜에 손을 올리면 행사 이름이 뜹니다</span></div>';
    return h;
  }
  /* 색칠된 날짜를 누르거나 손을 올리면 위 줄에 이름이 뜬다 (폰에서도 된다) */
  function bind(root){
    var tip=root.querySelector('#mctip');
    if(!tip) return;
    var base=tip.textContent;

function doExcel(gs,opt){
  var head=['학교','학교급','지원청','학년'];
  if(opt.sum) head=head.concat(['개학일','여름방학식','2학기 개학','겨울방학식','학년말 개학','종업식','졸업식']);
  if(opt.ex) head=head.concat(['1학기 중간 시작','1학기 중간 종료','1학기 기말 시작','1학기 기말 종료',
                               '2학기 중간 시작','2학기 중간 종료','2학기 기말 시작','2학기 기말 종료']);
  if(opt.bk) head=head.concat(['부교재']);
  if(opt.sr) head=head.concat(['배우는 과목(1학기)','배우는 과목(2학기)']);
  var aoa=[head];
  rowsFor(gs).forEach(function(x){
    var r=x.r, o=[x.g.name,x.g.lvl,x.g.off,x.grade];
    if(opt.sum) o=o.concat([r.open,r.ss,r.se,r.ws_,r.we,r.fin,r.grad].map(function(v){return v||'';}));
    if(opt.ex){ for(var i=0;i<4;i++){ var e=r.ex&&r.ex[i]?r.ex[i]:[null,null];
      o.push(e[0]||''); o.push(e[1]||''); } }
    if(opt.bk){ var b=BK[x.g.name], gr=x.grade, s='';
      if(b&&b[gr]) s=b[gr].items.map(function(y){return y[0]+' · '+y[1];}).join(' / ')+(b[gr].note?' ('+b[gr].note+')':'');
      o.push(s); }
    if(opt.sr){ var sj=subjectsOf(x.g.name,x.grade);
      o.push(sj&&sj['1']?sj['1'].join(' / '):''); o.push(sj&&sj['2']?sj['2'].join(' / '):''); }
    aoa.push(o); });
  var base=(orgNow()?orgNow()+'_':'')+'2026학사일정_'+new Date().toISOString().slice(0,10)+'.xlsx';
  var widths=head.map(function(h){ return h==='학교'?24:(h==='부교재'?48:(h.indexOf('시작')>0||h.indexOf('종료')>0?13:12)); });
  try{ MiniXlsx.download(aoa,widths,base,'학사일정'); }
  catch(e){
    var csv='\ufeff'+aoa.map(function(r){ return r.map(function(c){
      c=String(c==null?'':c); return /[",\n]/.test(c)?'"'+c.replace(/"/g,'""')+'"':c; }).join(','); }).join('\r\n');
    var a=document.createElement('a');
    a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));
    a.download=base.replace(/\.xlsx$/,'.csv'); a.click();
    setTimeout(function(){URL.revokeObjectURL(a.href);},1500);
  }
}

  b.style.display='';
  var m=AUTH.me();
  b.textContent = m ? (m.n+' · '+(AUTH.roleName?AUTH.roleName(m):'회원')) : '로그인';
  b.onclick = m
    ? function(){ if(confirm(m.n+' 님, 로그아웃하시겠습니까?\n다음에 다시 이름과 비밀번호를 넣으셔야 합니다.')){
        AUTH.logout(); whoPaint(); render();
        if(typeof LOCK_VIEW!=='undefined' && LOCK_VIEW) LOGIN.gate(); } }
    : function(){ LOGIN.open('in'); };
  admPaint();
}
function admPaint(){
  var a=document.getElementById('admBtn'); if(!a) return;
  if(typeof AUTH==='undefined' || !AUTH.on() || !AUTH.hasAdmin()){ a.style.display='none'; return; }
  a.style.display='';
  var w=AUTH.isAdmin()? WAIT.length : 0;
  a.innerHTML = AUTH.isAdmin()
    ? ('승인 관리'+(w?' '+w+'<span class="dot"></span>':''))
    : '관리자';
  a.style.borderColor = w? 'var(--red)' : '';
  a.style.color = w? 'var(--red)' : '';
  a.onclick=function(){ ADMIN.open(); };
}

/* ---------- 새 신청을 지켜본다 (관리자만) ---------- */
var WAIT=[], watchT=null;
function toast(msg, fn){
  var t=document.getElementById('toast'); if(!t) return;
  t.innerHTML=msg; t.classList.add('on');
  t.onclick=function(){ t.classList.remove('on'); if(fn) fn(); };
  clearTimeout(t._h); t._h=setTimeout(function(){ t.classList.remove('on'); }, 12000);
}
function watchOnce(first){
  if(typeof AUTH==='undefined' || !AUTH.isAdmin()) return;
  AUTH.pendingCount().then(function(names){
    var fresh=names.filter(function(n){ return WAIT.indexOf(n)<0; });
    WAIT=names; admPaint();
    var show=first? names : fresh;              // 들어오자마자도 알려 준다
    if(show.length){
      var who=show.slice(0,3).join(' · ')+(show.length>3?' 외 '+(show.length-3)+'명':'');
      toast((first?'승인 기다리는 분 '+show.length+'명 · <b>':'새 가입 신청 · <b>')
            +esc(who)+'</b> — 눌러서 승인하기', function(){ ADMIN.open(); });
      try{
        if(!first && window.Notification && Notification.permission==='granted')
          new Notification('학사일정 · 새 가입 신청', {body:who+' 선생님이 신청하셨습니다.'});
      }catch(e){}
    }
  }).catch(function(){});
}
function watchStart(){
  if(watchT) return;
  watchOnce(true);
  watchT=setInterval(function(){
    if(document.visibilityState==='visible') watchOnce(false);
  }, 30000);
  document.addEventListener('visibilitychange', function(){
    if(document.visibilityState==='visible') watchOnce(false);
  });
}
window.DGAPI={ fav:favList, list:function(){ return LIST.slice(); },
               byKey:function(k){ return BYKEY[k]||null; }, open:open };
window.DGWATCH={ start:watchStart, once:function(){ watchOnce(false); } };
window.DGCAL={ refresh:function(){
  LIST.forEach(function(g){ g.hasBooks=!!BK[g.name]; g.next=nextEvent(g); g.nexts=nextByRow(g); });
  render();
  if(OPENKEY && document.getElementById('sheet').classList.contains('on')) open(OPENKEY);
}, whoPaint:whoPaint };
render(); whoPaint();
/* 즐겨찾기를 기기끼리 잇는다.
   ★ 저장소를 아직 못 읽었으면 아무것도 하지 않는다 —
     안 읽은 채로 「서버에 없다」고 보고 올려 버리면 다른 기기 것을 지운다. */
function syncFav(){
  if(typeof STORE==='undefined' || !STORE.on()) return;
  if(!STORE.live()) return;                              // 못 읽었다 = 판단하지 않는다
  var me=(typeof AUTH!=='undefined'&&AUTH.on())?AUTH.me():null; if(!me) return;
  var srv=STORE.favOf(me.n);
  if(srv){
    FAV=srv.filter(function(k){ return BYKEY[k]; }); set('dgcal.fav',FAV);
    render(); renderSoon();
  }else if(FAV.length){ pushFav(); }                     // 그 사람 것이 아예 없을 때만 올린다
}
/* 로그인한 뒤에도 한 번 더 맞춘다. 저장소를 아직 못 읽었으면 읽고 나서 맞춘다. */
function syncFavAfterLogin(){
  if(typeof STORE==='undefined' || !STORE.on()) return;
  if(STORE.live()){ syncFav(); return; }
  STORE.load().then(function(){ syncFav(); DGCAL.refresh(); }).catch(function(){});
}
window.DGSYNC=syncFavAfterLogin;
if(typeof STORE!=='undefined' && STORE.on()){
  STORE.load().then(function(n){ syncFav(); if(n) DGCAL.refresh(); else renderSoon(); });
}
function locked(){ return (typeof LOCK_VIEW!=='undefined' && LOCK_VIEW)
                        && typeof AUTH!=='undefined' && AUTH.on(); }
if(typeof AUTH!=='undefined' && AUTH.on()){
  if(locked() && !AUTH.me()) LOGIN.gate();          // 아직 아무도 아니면 곧바로 문을 닫는다
  AUTH.load().then(function(){
    AUTH.verify(); whoPaint();
    if(locked()){ if(AUTH.me()) LOGIN.ungate(); else LOGIN.gate(); }
    syncFav(); renderSoon();
    if(AUTH.isAdmin()) watchStart();
  });
}
document.getElementById('lsheet').onclick=function(e){ if(e.target.id==='lsheet') LOGIN.close(); };
document.getElementById('asheet').onclick=function(e){ if(e.target.id==='asheet') ADMIN.close(); };
document.getElementById('tsheet').onclick=function(e){ if(e.target.id==='tsheet') STATS.close(); };
})();
</script>
