<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>2026 대구 학사일정 · 시험일정 찾기</title>
<style>
:root{
  --bg:#f6f8f8; --surface:#fff; --surface2:#eef3f2; --line:#dde5e3;
  --ink:#16211f; --ink2:#4a5c58; --muted:#7d908b;
  --teal:#0f7766; --teal-l:#168f7a; --teal-bg:#e6f2ef;
  --gold:#8a6d1f; --gold-bg:#f7f0dc; --red:#a33a3a; --red-bg:#f7e6e6;
  --blue:#2b5f8a; --blue-bg:#e6eef5; --star:#c9a227;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;
  font-size:15px;line-height:1.55;-webkit-text-size-adjust:100%}
header{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.hin{max-width:1080px;margin:0 auto;padding:14px 16px 12px}
.htop{display:flex;align-items:flex-start;gap:10px}
h1{margin:0 0 3px;font-size:17px;font-weight:800;letter-spacing:-.02em}
.sub{font-size:12px;color:var(--muted);margin-bottom:11px}
.btn{padding:8px 13px;font-size:13px;font-weight:700;border:1px solid var(--teal);
  background:var(--teal);color:#fff;border-radius:9px;cursor:pointer;white-space:nowrap}
.btn.ghost{background:var(--surface);color:var(--teal);border-color:var(--line)}
.btn:disabled{opacity:.4;cursor:default}
.searchrow{display:flex;gap:8px;align-items:center}
#q{flex:1;min-width:0;padding:11px 13px;font-size:15px;border:1.5px solid var(--line);
  border-radius:10px;background:var(--surface);color:var(--ink);outline:none}
#q:focus{border-color:var(--teal-l)}
.clr{padding:11px 12px;font-size:13px;border:1px solid var(--line);background:var(--surface);
  border-radius:10px;color:var(--ink2);cursor:pointer;white-space:nowrap}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px;align-items:center}
.chip{padding:6px 12px;font-size:13px;font-weight:700;border:1px solid var(--line);
  border-radius:999px;background:var(--surface);color:var(--ink2);cursor:pointer}
.chip.on{background:var(--teal);border-color:var(--teal);color:#fff}
.chip.fav.on{background:var(--star);border-color:var(--star);color:#3a2f06}
select{padding:6px 10px;font-size:13px;border:1px solid var(--line);border-radius:999px;
  background:var(--surface);color:var(--ink2)}
.count{font-size:12px;color:var(--muted);margin-left:auto}
main{max-width:1080px;margin:0 auto;padding:14px 16px 60px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(258px,1fr));gap:10px}
.card{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:13px 40px 13px 14px;cursor:pointer}
.card:hover{border-color:var(--teal-l)}
.star{position:absolute;top:9px;right:9px;width:30px;height:30px;border:none;background:transparent;
  font-size:19px;line-height:1;color:#cfd8d5;cursor:pointer;padding:0}
.star.on{color:var(--star)}
.cname{font-size:15px;font-weight:800;letter-spacing:-.02em}
.ctag{margin-top:5px;display:flex;gap:5px;flex-wrap:wrap}
.tag{font-size:11px;font-weight:700;padding:2px 7px;border-radius:5px;background:var(--surface2);color:var(--ink2)}
.tag.lv{background:var(--teal-bg);color:var(--teal)}
.tag.bk{background:var(--gold-bg);color:var(--gold)}
.cnext{margin-top:9px;padding-top:9px;border-top:1px dashed var(--line);font-size:12.5px;color:var(--ink2)}
.cnext b{color:var(--teal);font-weight:800}
.empty{padding:50px 16px;text-align:center;color:var(--muted);font-size:14px;line-height:1.9}
.dday{display:inline-block;margin-left:6px;font-size:11px;font-weight:800;padding:1px 6px;border-radius:5px}
.dd-soon{background:var(--red-bg);color:var(--red)}
.dd-near{background:var(--gold-bg);color:var(--gold)}
.dd-far{background:var(--surface2);color:var(--muted)}
.dd-done{background:var(--surface2);color:var(--muted)}
.none{color:var(--muted)}
/* 패널 공통 */
.sheet{position:fixed;inset:0;background:rgba(16,28,26,.42);display:none;z-index:40}
.sheet.on{display:block}
.panel{position:absolute;left:50%;transform:translateX(-50%);top:26px;bottom:26px;width:min(720px,calc(100% - 24px));
  background:var(--surface);border-radius:14px;overflow:auto}
.panel.sm{bottom:auto;max-height:calc(100% - 52px);width:min(480px,calc(100% - 24px))}
.ph{position:sticky;top:0;background:var(--surface);border-bottom:1px solid var(--line);padding:15px 18px 12px;display:flex;gap:10px;align-items:flex-start;z-index:2}
.ph h2{margin:0;font-size:18px;font-weight:800;letter-spacing:-.02em}
.x{margin-left:auto;border:1px solid var(--line);background:var(--surface);border-radius:8px;
  width:30px;height:30px;font-size:16px;color:var(--ink2);cursor:pointer;flex:none}
.pb{padding:14px 18px 26px}
.gtab{display:flex;gap:6px;margin-bottom:13px}
.gtab.wrap{flex-wrap:wrap}
.gtab.wrap button{padding:6px 11px;font-size:12.5px}
.gtab button{padding:6px 13px;font-size:13px;font-weight:700;border:1px solid var(--line);
  background:var(--surface);border-radius:999px;color:var(--ink2);cursor:pointer}
.gtab button.on{background:var(--teal);border-color:var(--teal);color:#fff}
h3{margin:17px 0 8px;font-size:12px;font-weight:800;color:var(--muted);letter-spacing:.06em}
h3:first-child{margin-top:0}
table{width:100%;border-collapse:collapse;font-size:13.5px}
td{padding:8px 2px;border-bottom:1px solid var(--line);vertical-align:top}
td:first-child{width:104px;color:var(--ink2);font-weight:700}
.notice{background:var(--blue-bg);color:var(--blue);border-radius:9px;padding:11px 13px;font-size:13px;line-height:1.6}
.bkrow td:first-child{width:88px}
.ht{margin:0 0 4px;font-size:14px;line-height:1.75;color:var(--ink2)}
.ht b{color:var(--ink)}
.hnote{display:inline-block;margin-top:4px;font-size:13px;color:var(--gold);font-weight:700}
#hpanel h3{margin-top:20px}
.bnote{font-size:12px;color:var(--gold);font-weight:700;margin-top:6px}
.pub{display:inline-block;font-size:11px;font-weight:700;padding:0 5px;border-radius:4px;background:var(--surface2);color:var(--muted);margin-left:2px}
.sem{display:inline-block;font-size:10.5px;font-weight:800;padding:1px 5px;border-radius:4px;margin-right:5px;vertical-align:1px}
.sem.s1{background:var(--teal-bg);color:var(--teal)}
.sem.s2{background:#e4eef7;color:var(--blue)}
.rng{margin-top:5px;padding:7px 9px;background:var(--surface2);border-radius:7px;font-size:12.5px;line-height:1.65}
.rng b{color:var(--teal);font-weight:800;margin-right:3px}
/* 내보내기 폼 */
.fl{display:block;font-size:12px;font-weight:800;color:var(--muted);margin:15px 0 6px;letter-spacing:.04em}
.fl:first-child{margin-top:0}
input[type=text]{width:100%;padding:10px 12px;font-size:14px;border:1.5px solid var(--line);
  border-radius:9px;outline:none;background:var(--surface);color:var(--ink)}
input[type=text]:focus{border-color:var(--teal-l)}
.radio{display:flex;flex-direction:column;gap:7px}
.radio label,.checks label{display:flex;gap:8px;align-items:center;font-size:14px;cursor:pointer}
.checks{display:flex;gap:14px;flex-wrap:wrap}
.hint{font-size:12px;color:var(--muted);margin-top:6px;line-height:1.6}
.acts{display:flex;gap:8px;margin-top:20px}
.acts .btn{flex:1;padding:12px}
footer{max-width:1080px;margin:0 auto;padding:0 16px 40px;font-size:11.5px;color:var(--muted);line-height:1.7}
@media(max-width:520px){ .grid{grid-template-columns:1fr} .panel{top:0;bottom:0;border-radius:0;width:100%}
  .panel.sm{top:auto;bottom:0;border-radius:14px 14px 0 0} }

/* 보기 전환 */
.viewtab{display:flex;gap:6px;margin-top:9px}
.vt{padding:6px 16px;font-size:13px;font-weight:800;border:1px solid var(--line);
  border-radius:999px;background:var(--surface);color:var(--ink2);cursor:pointer}
.vt.on{background:var(--ink);border-color:var(--ink);color:#fff}
/* 달력 */
.calhead{display:flex;align-items:center;gap:9px;margin-bottom:11px;flex-wrap:wrap}
.ctitle{font-size:17px;font-weight:800;letter-spacing:-.02em;min-width:118px;text-align:center}
.cnames{font-size:12px;color:var(--muted);flex:1 1 100%;line-height:1.6}
table.cal{width:100%;border-collapse:collapse;table-layout:fixed;background:var(--surface)}
table.cal th{padding:6px 2px;font-size:12px;font-weight:800;color:var(--ink2);
  background:var(--surface2);border:1px solid var(--line)}
table.cal th.sun,table.cal td.sun .dnum{color:#a33a3a}
table.cal th.sat,table.cal td.sat .dnum{color:#2b5f8a}
table.cal td{border:1px solid var(--line);vertical-align:top;padding:4px 4px 5px;height:96px}
table.cal td.out{background:#fafbfb}
table.cal td.out .dnum{color:#c8d2cf}
.dnum{font-size:12px;font-weight:800;color:var(--ink2);margin-bottom:3px}
.evs{display:flex;flex-direction:column;gap:2px}
.ev{font-size:11px;font-weight:600;padding:2.5px 5px;border-radius:4px;line-height:1.4;
  white-space:normal;word-break:keep-all}
.ev b{font-weight:800}
.ev span{font-weight:600;opacity:.75}
.ev.mid{background:#fdeee0;color:#9a5410}
.ev.fin{background:#f9e3e3;color:#a33a3a}
.ev.va{background:#e6f2ef;color:#0f7766}
.ev.op{background:#e4eef7;color:#2b5f8a}
.ev.mid.f{box-shadow:inset 2.5px 0 0 #c26a17}
.ev.fin.f{box-shadow:inset 2.5px 0 0 #a33a3a}
.callegend{display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap}
.callegend .ev{font-size:11.5px}
@media(max-width:640px){
  table.cal td{height:auto;min-height:52px;padding:3px 2px 4px}
  .ev{font-size:9px;padding:1.5px 3px;line-height:1.35}
  .dnum{font-size:10.5px}
}
/* 달력 인쇄 */
.calpage{page-break-inside:avoid}
.calpage.brk{page-break-after:always}
table.calp{font-size:8pt;margin-top:2mm}
table.calp th{border:.6pt solid #9aa8a4;background:#eef3f2;padding:2.4pt;font-size:8.4pt}
table.calp td{border:.6pt solid #c2cecb;height:auto;padding:2pt 2.4pt 3pt}
table.calp .dnum{font-size:8.4pt;margin-bottom:1.6pt}
table.calp .ev{font-size:7pt;padding:1.4pt 2.4pt;border-radius:2pt;line-height:1.32;font-weight:600}
table.calp .ev b{font-weight:800}
table.calp .ev.mid{background:#fdeee0;color:#8c4b0e}
table.calp .ev.fin{background:#f9e3e3;color:#963434}
table.calp .ev.va{background:#e6f2ef;color:#0d6858}
table.calp .ev.op{background:#e4eef7;color:#27567d}

/* ===== 인쇄 ===== */
#print{display:none}
@media print{
  body{background:#fff}
  /* 배경색·표 색이 인쇄에서 빠지지 않게 한다 */
  *{-webkit-print-color-adjust:exact !important;print-color-adjust:exact !important}
  header,main,footer,.sheet{display:none !important}
  #print{display:block}
  @page{size:A4 landscape;margin:10mm 9mm 12mm}
}
#print{font-size:9.5pt;color:#000;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.prt-h{display:flex;align-items:baseline;gap:10px;border-bottom:2px solid #111;padding-bottom:6px;margin-bottom:4px}
.prt-org{font-size:15pt;font-weight:800;letter-spacing:-.02em}
.prt-t{font-size:11pt;font-weight:700}
.prt-d{margin-left:auto;font-size:8.5pt;color:#555}
.prt-sub{font-size:8.5pt;color:#555;margin-bottom:9px}
table.prt{width:100%;border-collapse:collapse;font-size:8.6pt;table-layout:fixed}
table.prt th{background:#eef3f2;border:.6pt solid #9aa8a4;padding:4pt 3pt;font-weight:800;text-align:center;letter-spacing:-.02em}
table.prt td{border:.6pt solid #c2cecb;padding:4pt 3pt;text-align:center;vertical-align:middle;word-break:keep-all}
table.prt td.l{text-align:left}
table.prt tr{page-break-inside:avoid}
table.prt thead{display:table-header-group}
.prt-name{font-weight:800;letter-spacing:-.03em}
.prt-none{color:#999}
.prt-sec{font-size:10pt;font-weight:800;margin:13px 0 5px;padding-bottom:3px;border-bottom:1pt solid #111}
.prt-f{margin-top:9px;font-size:7.6pt;color:#666;line-height:1.5}
</style></head>
<body>
<header><div class="hin">
  <div class="htop">
    <div>
      <h1>2026학년도 대구 학사일정 찾기</h1>
      <div class="sub">방학 · 개학 · 정기시험 · 학교 부교재를 학교 이름으로 찾습니다</div>
    </div>
    <div style="margin-left:auto;display:flex;gap:7px"><button class="btn ghost" id="helpBtn">사용법</button><button class="btn ghost" id="expBtn">인쇄 · 내보내기</button></div>
  </div>
  <div class="searchrow">
    <input id="q" type="search" placeholder="학교 이름 (예: 시지고, 경신, 대구여자)" autocomplete="off">
    <button class="clr" id="clr">지우기</button>
  </div>
  <div class="filters" id="lv"></div>
  <div class="viewtab"><button class="vt on" data-v="list">목록</button><button class="vt" data-v="cal">달력</button></div>
</div></header>
<main>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" style="display:none"></div>
  <div id="calbox" style="display:none"></div>
</main>
<footer id="foot"></footer>
<div class="sheet" id="sheet"><div class="panel" id="panel"></div></div>
<div class="sheet" id="esheet"><div class="panel sm" id="epanel"></div></div>
<div class="sheet" id="ssheet"><div class="panel sm" id="spanel"></div></div>
<div class="sheet" id="hsheet"><div class="panel" id="hpanel"></div></div>
<div id="print"></div>
<script>/* 라이브러리 없이 .xlsx 를 만든다 — ZIP(STORE) + 최소 SpreadsheetML.
   외부 CDN 에 기대지 않는다. 학교·학원 망에서 CDN 이 막혀도 동작한다. */
var MiniXlsx=(function(){
  var CRCT=(function(){var t=[],c,n,k;for(n=0;n<256;n++){c=n;for(k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0;}return t;})();
  function crc32(u8){var c=0xFFFFFFFF;for(var i=0;i<u8.length;i++)c=CRCT[(c^u8[i])&0xFF]^(c>>>8);return (c^0xFFFFFFFF)>>>0;}
  var enc=new TextEncoder();
  function esc(s){return String(s==null?'':s).replace(/[&<>]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;'}[c];})
    .replace(/[\x00-\x08\x0B\x0C\x0E-\x1F]/g,'');}
  function col(n){var s='';n++;while(n>0){var m=(n-1)%26;s=String.fromCharCode(65+m)+s;n=(n-m-1)/26;}return s;}
  function sheetXml(aoa,widths){
    var x='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
      +'<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">';
    if(widths&&widths.length){ x+='<cols>'+widths.map(function(w,i){
      return '<col min="'+(i+1)+'" max="'+(i+1)+'" width="'+w+'" customWidth="1"/>';}).join('')+'</cols>'; }
    x+='<sheetData>';
    aoa.forEach(function(row,r){
      x+='<row r="'+(r+1)+'">';
      row.forEach(function(v,c){
        if(v==null||v==='') return;
        var ref=col(c)+(r+1), st=r===0?' s="1"':'';
        if(typeof v==='number'&&isFinite(v)) x+='<c r="'+ref+'"'+st+'><v>'+v+'</v></c>';
        else x+='<c r="'+ref+'" t="inlineStr"'+st+'><is><t xml:space="preserve">'+esc(v)+'</t></is></c>';
      });
      x+='</row>';
    });
    x+='</sheetData></worksheet>';
    return x;
  }
  var STYLES='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
    +'<styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">'
    +'<fonts count="2"><font><sz val="11"/><name val="맑은 고딕"/></font>'
    +'<font><b/><sz val="11"/><color rgb="FF0F7766"/><name val="맑은 고딕"/></font></fonts>'
    +'<fills count="3"><fill><patternFill patternType="none"/></fill>'
    +'<fill><patternFill patternType="gray125"/></fill>'
    +'<fill><patternFill patternType="solid"><fgColor rgb="FFE6F2EF"/><bgColor indexed="64"/></patternFill></fill></fills>'
    +'<borders count="2"><border/><border><bottom style="thin"><color rgb="FF9AA8A4"/></bottom></border></borders>'
    +'<cellStyleXfs count="1"><xf/></cellStyleXfs>'
    +'<cellXfs count="2"><xf xfId="0"/>'
    +'<xf xfId="0" fontId="1" fillId="2" borderId="1" applyFont="1" applyFill="1" applyBorder="1">'
    +'<alignment horizontal="center" vertical="center"/></xf></cellXfs></styleSheet>';
  function build(files){                       // [{name, data:Uint8Array}]
    var chunks=[], cd=[], off=0;
    files.forEach(function(f){
      var nm=enc.encode(f.name), c=crc32(f.data), n=f.data.length;
      var lh=new Uint8Array(30+nm.length), dv=new DataView(lh.buffer);
      dv.setUint32(0,0x04034b50,true); dv.setUint16(4,20,true); dv.setUint16(6,0x0800,true);
      dv.setUint16(8,0,true); dv.setUint16(10,0,true); dv.setUint16(12,0x2821,true);
      dv.setUint32(14,c,true); dv.setUint32(18,n,true); dv.setUint32(22,n,true);
      dv.setUint16(26,nm.length,true); dv.setUint16(28,0,true); lh.set(nm,30);
      chunks.push(lh, f.data);
      var ch=new Uint8Array(46+nm.length), dv2=new DataView(ch.buffer);
      dv2.setUint32(0,0x02014b50,true); dv2.setUint16(4,20,true); dv2.setUint16(6,20,true);
      dv2.setUint16(8,0x0800,true); dv2.setUint16(10,0,true);
      dv2.setUint16(12,0,true); dv2.setUint16(14,0x2821,true);
      dv2.setUint32(16,c,true); dv2.setUint32(20,n,true); dv2.setUint32(24,n,true);
      dv2.setUint16(28,nm.length,true); dv2.setUint32(42,off,true); ch.set(nm,46);
      cd.push(ch); off+=lh.length+n;
    });
    var cdLen=cd.reduce(function(a,b){return a+b.length;},0);
    var end=new Uint8Array(22), dve=new DataView(end.buffer);
    dve.setUint32(0,0x06054b50,true); dve.setUint16(8,files.length,true); dve.setUint16(10,files.length,true);
    dve.setUint32(12,cdLen,true); dve.setUint32(16,off,true);
    var all=chunks.concat(cd,[end]);
    var total=all.reduce(function(a,b){return a+b.length;},0), out=new Uint8Array(total), p=0;
    all.forEach(function(u){ out.set(u,p); p+=u.length; });
    return out;
  }
  function download(aoa, widths, filename, sheetName){
    var F=[
     {name:'[Content_Types].xml', data:enc.encode('<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
      +'<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">'
      +'<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>'
      +'<Default Extension="xml" ContentType="application/xml"/>'
      +'<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>'
      +'<Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>'
      +'<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>'
      +'</Types>')},
     {name:'_rels/.rels', data:enc.encode('<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
      +'<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'
      +'<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/>'
      +'</Relationships>')},
     {name:'xl/workbook.xml', data:enc.encode('<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
      +'<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" '
      +'xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">'
      +'<sheets><sheet name="'+esc(sheetName||'Sheet1')+'" sheetId="1" r:id="rId1"/></sheets></workbook>')},

        +'<input type="text" id="snote" placeholder="예: 학생 시간표에서 확인 / 학교 가정통신문">'
        +'<label class="fl">보내는 분 · 이 두 칸은 반드시 채워 주십시오</label>'
        +'<div style="display:flex;gap:10px">'
        +'<input type="text" id="sname" placeholder="이름" value="'+esc(ME&&ME.name||'')+'">'
        +'<input type="text" id="sorg" placeholder="학원" value="'+esc(ME&&ME.org||'')+'"></div>'
        +'<div class="hint">한 번 넣으면 이 브라우저에 기억해 둡니다. 누가 주신 정보인지 남기기 위한 것입니다.</div>'
        +'<div class="acts"><button class="btn" id="ssend">'+(READY?'보내기':'내용 만들기')+'</button></div>'
        +'<div class="hint">'+(READY
          ? '보내면 김병진T에게 바로 알림이 갑니다. 확인 뒤 화면에 반영되며, 그 전에는 아무에게도 보이지 않습니다.'
          : '누르면 아래에 정리된 글이 나옵니다. <b>복사해서 단톡방이나 문자로 보내 주십시오.</b> 확인 뒤 모두의 화면에 반영됩니다.')
        +'</div>';
      return h;
    }
    function draw(){
      p.innerHTML='<div class="ph"><div><h2>수정 제안</h2>'
        +'<div class="ctag"><span class="tag lv">'+esc(g.lvl)+'</span><span class="tag">'+esc(g.name)+'</span></div></div>'
        +'<button class="x" id="sx">×</button></div><div class="pb">'+form()+'</div>';
      p.querySelectorAll('.gtab button').forEach(function(b){
        b.onclick=function(){ kind=b.dataset.k; draw(); }; });
      var g1=p.querySelectorAll('input[name=sgr3]');
      if(g1.length){
        var note=document.getElementById('g1note');
        var upd=function(){
          var v=(p.querySelector('input[name=sgr3]:checked')||{}).value;
          note.innerHTML = v==='1'
            ? '<b style="color:var(--gold)">1학년은 전국이 같아 이미 들어가 있습니다</b> — 1학기 공통수학1, 2학기 공통수학2. 다른 경우에만 알려 주십시오.'
            : '';
        };
        g1.forEach(function(x){ x.onchange=upd; }); upd();
      }
      document.getElementById('sx').onclick=close;
      document.getElementById('ssend').onclick=send;
      var box=document.getElementById('subbox');
      if(box){
        var paint=function(){
          var gr=(p.querySelector('input[name=sgr]:checked')||{}).value;
          var sem=(p.querySelector('input[name=ssem]:checked')||{}).value;
          var list, note='';
          if(g.lvl!=='고'){ list=SUBJ[g.lvl]||SUBJ['고']; }
          else if(gr==='1'){
            list = sem==='2' ? ['공통수학2'] : (sem==='12'? ['공통수학1','공통수학2'] : ['공통수학1']);
            note='1학년은 전국이 같습니다 — 1학기 공통수학1, 2학기 공통수학2';
          } else {
            var reg=(DATA.subjects[g.name]||{})[gr];
            var pick = reg && sem!=='12' ? (reg[sem]||[]) : null;
            if(pick && pick.length){ list=pick; note='이 학교 '+gr+'학년 '+sem+'학기에 등록된 과목입니다'; }
            else { list=G2; note='이 학교 '+gr+'학년의 배우는 과목이 아직 등록되지 않아 전체를 보여 드립니다'; }
          }
          box.innerHTML=list.map(function(x){
            return '<label><input type="checkbox" name="ssubs" value="'+esc(x)+'"> '+esc(x)+'</label>';}).join('')
            +(note?'<div class="hint" style="flex:1 1 100%;margin:2px 0 0">'+note+'</div>':'');
        };
        p.querySelectorAll('input[name=sgr],input[name=ssem]').forEach(function(x){ x.onchange=paint; });
        paint();
      }
    }
    function send(){
      var name=(document.getElementById('sname').value||'').trim();
      var org=(document.getElementById('sorg').value||'').trim();
      if(!name||!org){ alert('이름과 학원을 채워 주십시오.'); return; }
      var body={school:g.name, lvl:g.lvl, kind:kind, name:name, org:org,
                note:(document.getElementById('snote').value||'').trim()};
      if(kind==='book'){
        body.grade=(p.querySelector('input[name=sgr]:checked')||{}).value;
        body.sem=(p.querySelector('input[name=ssem]:checked')||{}).value||'';
        body.subjects=Array.prototype.map.call(p.querySelectorAll('input[name=ssubs]:checked'),function(x){return x.value;});
        body.book=(document.getElementById('sbook').value||'').trim();
        body.pub=(document.getElementById('spub').value||'').trim();
        if(!body.subjects.length){ alert('과목을 하나 이상 골라 주십시오.'); return; }
      }else if(kind==='subj'){
        body.grade=(p.querySelector('input[name=sgr3]:checked')||{}).value;
        body.sj1=Array.prototype.map.call(p.querySelectorAll('input[name=sj1]:checked'),function(x){return x.value;});
        body.sj2=Array.prototype.map.call(p.querySelectorAll('input[name=sj2]:checked'),function(x){return x.value;});
        if(!body.sj1.length && !body.sj2.length){ alert('배우는 과목을 하나 이상 골라 주십시오.'); return; }
      }else if(kind==='rng'){
        body.exam=+document.getElementById('rex').value;
        body.grade=(p.querySelector('input[name=sgr4]:checked')||{}).value;
        body.ranges=(document.getElementById('rtxt').value||'').trim();
        if(!body.ranges){ alert('과목과 범위를 적어 주십시오.'); return; }
      }else{
        body.exam=+document.getElementById('sex').value;
        var gr=p.querySelector('input[name=sgr2]:checked');
        body.gradeIdx=gr?+gr.value:0;
        body.start=document.getElementById('sd1').value;
        body.end=document.getElementById('sd2').value;
        if(!body.start && !(body.note||'').length){ alert('바뀐 날짜를 넣거나, 한마디에 사정을 적어 주십시오.'); return; }
      }
      try{ localStorage.setItem('dgcal.me', JSON.stringify({name:name,org:org})); }catch(e){}
      var btn=document.getElementById('ssend');
      if(!READY || DEMO){ handoff(body); return; }
      btn.disabled=true; btn.textContent='보내는 중…';
      fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})
        .then(function(r){ if(!r.ok) throw 0; return r.json(); })
        .then(function(){ done(body); })
        .catch(function(){ btn.disabled=false; btn.textContent='보내기';
          alert('보내지 못했습니다. 잠시 뒤 다시 해 주십시오.'); });
    }
    function textOf(b){
      var L=['[학사일정 수정 제안]', b.school];
      if(b.kind==='book'){
        var what=[]; if(b.pub) what.push('교과서'); if(b.book) what.push('부교재');
        L.push('구분 : '+(what.length? what.join(' · ') : '배우는 과목'));
        L.push('학년 : '+(b.grade||'-')+'학년 '+(b.sem==='12'?'1·2학기':b.sem+'학기'));
        L.push('과목 : '+b.subjects.join(' · '));
        L.push('교과서 : '+(b.pub || '(모름)'));
        L.push('부교재 : '+(b.book || '(모름)'));
      }else if(b.kind==='subj'){
        L.push('구분 : 배우는 과목');
        L.push('학년 : '+(b.grade||'-')+'학년');
        L.push('1학기 : '+(b.sj1.length? b.sj1.join(' · ') : '(없음)'));
        L.push('2학기 : '+(b.sj2.length? b.sj2.join(' · ') : '(없음)'));
      }else if(b.kind==='rng'){
        L.push('구분 : 시험범위');
        L.push('시험 : '+EXNAME[b.exam]);
        L.push('학년 : '+(b.grade||'-')+'학년');
        L.push('범위 :');
        b.ranges.split('\n').forEach(function(x){ if(x.trim()) L.push('  '+x.trim()); });
      }else{
        L.push('구분 : 시험일정 정정');
        L.push('시험 : '+EXNAME[b.exam]);
        if(g.rows.length>1) L.push('학년 : '+((g.rows[b.gradeIdx]||{}).grade||'-')+'학년');
        L.push('바뀐 날짜 : '+(b.start? b.start+(b.end&&b.end!==b.start?' ~ '+b.end:'') : '(적지 않음)'));
      }
      if(b.note) L.push('근거 : '+b.note);
      L.push('보낸 이 : '+b.name+' ('+b.org+')');
      return L.join('\n');
    }
    function handoff(b){
      var t=textOf(b);
      p.innerHTML='<div class="ph"><h2>이 글을 보내 주십시오</h2><button class="x" id="sx">×</button></div>'
        +'<div class="pb"><div class="hint" style="margin:0 0 9px">아래 글을 복사해서 <b>단톡방이나 문자로</b> 김병진T에게 보내 주십시오. 확인 뒤 모두의 화면에 반영됩니다.</div>'
        +'<textarea id="sout" readonly style="width:100%;height:186px;padding:12px;border:1.5px solid var(--line);'
        +'border-radius:9px;font-size:13.5px;line-height:1.7;resize:vertical;background:var(--surface2);color:var(--ink);'
        +'font-family:inherit">'+esc(t)+'</textarea>'
        +'<div class="acts"><button class="btn" id="scopy">글 복사하기</button>'
        +'<button class="btn ghost" id="sclose">닫기</button></div>'
        +'<div class="hint" id="scopied">복사한 뒤 단톡방에 붙여넣기 하시면 됩니다.</div></div>';
      document.getElementById('sx').onclick=close;
      document.getElementById('sclose').onclick=close;
      document.getElementById('scopy').onclick=function(){
        var ta=document.getElementById('sout');
        ta.focus(); ta.select(); try{ ta.setSelectionRange(0,99999); }catch(e){}
        var ok=false; try{ ok=document.execCommand('copy'); }catch(e){}
        if(navigator.clipboard&&navigator.clipboard.writeText){
          navigator.clipboard.writeText(ta.value).then(function(){ mark(true); },function(){ mark(ok); });
        } else mark(ok);
      };
      function mark(ok){
        document.getElementById('scopied').innerHTML = ok
          ? '<b style="color:var(--teal)">복사했습니다.</b> 단톡방에 붙여넣기 하시면 됩니다.'
          : '복사가 안 되면 글을 길게 눌러 직접 복사해 주십시오.';
        var c=document.getElementById('scopy'); c.textContent='복사됨';
        setTimeout(function(){ c.textContent='글 복사하기'; },1800);
      }
    }
    function done(b){
      p.innerHTML='<div class="ph"><h2>보냈습니다</h2><button class="x" id="sx">×</button></div>'
        +'<div class="pb"><div class="notice">'
        +'<b>'+esc(b.school)+'</b> 건이 김병진T에게 전달되었습니다.<br>'
        +'확인 뒤 화면에 반영됩니다. 그 전에는 다른 분께 보이지 않습니다.'
        +'</div><div class="acts"><button class="btn ghost" id="sclose">닫기</button></div></div>';
      document.getElementById('sx').onclick=close;
      document.getElementById('sclose').onclick=close;
    }
    draw(); document.getElementById('ssheet').classList.add('on');
  }
  function close(){ document.getElementById('ssheet').classList.remove('on'); }
  return {open:open, close:close, ready:function(){return READY;}};
})();
</script>

<script>/* ===== 달력 보기 ===== */
var CAL=(function(){
  var MONTHS=[];   // 학년도 2026-03 ~ 2027-02
  for(var i=0;i<12;i++){ var m=3+i; MONTHS.push(m<=12?[2026,m]:[2027,m-12]); }
  var cur=0;
  var W=['일','월','화','수','목','금','토'];

  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
  function abbr(n){
    return n.replace('여자고등학교','여고').replace('여자중학교','여중')
            .replace('여자상업고등학교','여상').replace('고등학교','고')
            .replace('중학교','중').replace('초등학교','초').replace('학교','').trim();
  }
  function key(y,m,d){ return y+'-'+('0'+m).slice(-2)+'-'+('0'+d).slice(-2); }
  function parse(s){ var p=s.split('-'); return new Date(+p[0],+p[1]-1,+p[2]); }

  /* 학교 묶음 → 날짜별 일정
     ★ 1~2학년과 3학년이 같은 날이면 한 줄로 합친다. 다를 때만 (3) 을 붙인다 */
  function build(groups){
    var map={};
    function put(d,o){ if(!d) return; (map[d]=map[d]||[]).push(o); }
    var EX=['1학기 중간','1학기 기말','2학기 중간','2학기 기말'];

    groups.forEach(function(g){
      var nm=abbr(g.name), rows=g.rows;
      function span(r,i){ var a=r.ex&&r.ex[i]?r.ex[i][0]:null, b=r.ex&&r.ex[i]?r.ex[i][1]:null;
        return a? a+'~'+(b||a) : null; }
      // 시험
      EX.forEach(function(n,i){
        var byKey={};
        rows.forEach(function(r){
          var s=span(r,i); if(!s) return;
          (byKey[s]=byKey[s]||[]).push(String(r.grade||''));
        });
        var keys=Object.keys(byKey);
        keys.forEach(function(s){
          var grades=byKey[s];
          var tag = (keys.length<=1 || rows.length<=1) ? nm
                  : nm+'('+grades.join('·').replace('1~2','1·2')+')';
          var p=s.split('~'), a=parse(p[0]), b=parse(p[1]), first=true;
          for(var t=new Date(a); t<=b; t.setDate(t.getDate()+1)){
            put(key(t.getFullYear(),t.getMonth()+1,t.getDate()),
                {k:(n.indexOf('중간')>=0?'mid':'fin'), t:tag, n:n.replace('학기 ','-'), first:first});
            first=false;
          }
        });
      });
      // 방학 · 개학
      [['ss','여름방학식','va'],['se','2학기 개학','op'],['ws_','겨울방학식','va'],['we','학년말 개학','op']]
      .forEach(function(spec){
        var byDay={};
        rows.forEach(function(r){ var d=r[spec[0]]; if(!d) return;
          (byDay[d]=byDay[d]||[]).push(String(r.grade||'')); });
        var days=Object.keys(byDay);
        days.forEach(function(d){
          var tag=(days.length<=1||rows.length<=1) ? nm
                : nm+'('+byDay[d].join('·').replace('1~2','1·2')+')';
          put(d,{k:spec[2], t:tag, n:spec[1]});
        });
      });
    });
    return map;
  }

  /* 한 달 표 만들기 — mode: 'screen' | 'print' */
  function month(y,m,map,mode){
    var first=new Date(y,m-1,1), start=new Date(first); start.setDate(1-first.getDay());
    var weeks=[], t=new Date(start), used=0;
    for(var w=0;w<6;w++){
      var row=[];
      for(var d=0;d<7;d++){
        var inM=(t.getMonth()===m-1);
        var k=key(t.getFullYear(),t.getMonth()+1,t.getDate());
        var items=(map[k]||[]);
        if(inM&&items.length) used++;
        row.push({d:t.getDate(), inM:inM, dow:d, items:items, k:k});
        t.setDate(t.getDate()+1);
      }
      weeks.push(row);
      if(w>=4 && t.getMonth()!==m-1) break;   // 6주가 필요 없으면 자른다
    }
    var cls = mode==='print' ? 'calp' : 'cals';
    var hstyle = mode==='print' ? ' style="height:'+(Math.floor(1420/weeks.length)/10)+'mm"' : '';
    var h='<table class="cal '+cls+'"><thead><tr>'
      +W.map(function(x,i){ return '<th class="'+(i===0?'sun':i===6?'sat':'')+'">'+x+'</th>'; }).join('')
      +'</tr></thead><tbody>';
    weeks.forEach(function(row){
      h+='<tr>';
      row.forEach(function(c){
        var cc=['cell']; if(!c.inM) cc.push('out');
        if(c.dow===0) cc.push('sun'); if(c.dow===6) cc.push('sat');
        h+='<td class="'+cc.join(' ')+'"'+hstyle+'><div class="dnum">'+c.d+'</div>';
        if(c.inM && c.items.length){
          // 같은 일정끼리 한 줄로 모은다 (한 날에 학교가 많아도 칸이 넘치지 않는다)
          var bag={}, order=[];
          c.items.forEach(function(x){
            var kk=x.k+'|'+x.n;
            if(!bag[kk]){ bag[kk]={k:x.k,n:x.n,names:[],first:false}; order.push(kk); }
            bag[kk].names.push(x.t);
            if(x.first) bag[kk].first=true;
          });
          order.sort(function(a,b){
            var R={mid:0,fin:1,va:2,op:3};
            return R[bag[a].k]-R[bag[b].k];
          });
          h+='<div class="evs">';
          order.forEach(function(kk){
            var e=bag[kk];
            h+='<div class="ev '+e.k+(e.first?' f':'')+'">'
              +'<b>'+esc(e.n)+'</b> '+esc(e.names.join(' · '))+'</div>';
          });
          h+='</div>';
        }
        h+='</td>';
      });
      h+='</tr>';
    });
    return h+'</tbody></table>';
  }

  function titleOf(i){ return MONTHS[i][0]+'년 '+MONTHS[i][1]+'월'; }

  function render(groups){
    var box=document.getElementById('calbox');
    if(!groups.length){
      box.innerHTML='<div class="empty">즐겨찾기가 비어 있습니다.<br>'
        +'목록에서 학교 카드의 별을 눌러 담으시면 그 학교들의 일정이 달력에 나옵니다.</div>';
      return;
    }
    var map=build(groups), y=MONTHS[cur][0], m=MONTHS[cur][1];
    box.innerHTML='<div class="calhead">'
      +'<button class="btn ghost" id="cprev">◀</button>'
      +'<div class="ctitle">'+titleOf(cur)+'</div>'
      +'<button class="btn ghost" id="cnext">▶</button>'
      +'<div class="cnames">'+groups.map(function(g){return esc(abbr(g.name));}).join(' · ')+'</div>'
      +'</div>'+month(y,m,map,'screen')
      +'<div class="callegend"><span class="ev mid">중간고사</span><span class="ev fin">기말고사</span>'
      +'<span class="ev va">방학식</span><span class="ev op">개학</span>'
      +'<span class="hint" style="margin:0">즐겨찾기 '+groups.length+'개교 · 중·고 3학년은 (3) 으로 표시됩니다</span></div>';
    document.getElementById('cprev').onclick=function(){ if(cur>0){cur--; render(groups);} };
    document.getElementById('cnext').onclick=function(){ if(cur<11){cur++; render(groups);} };
  }

  function printCal(groups, org, onlyThis){
    var map=build(groups);
    var list = onlyThis ? [cur] : MONTHS.map(function(_,i){return i;});
    // 일정이 하나도 없는 달은 뺀다 (전체 인쇄일 때)
    if(!onlyThis){
      list=list.filter(function(i){
        var y=MONTHS[i][0], m=MONTHS[i][1];
        for(var d=1;d<=31;d++){ if(map[key(y,m,d)]) return true; }
        return false;
      });
    }
    var names=groups.map(function(g){return abbr(g.name);}).join(' · ');
    var h='';
    list.forEach(function(i,idx){
      var y=MONTHS[i][0], m=MONTHS[i][1];
      h+='<div class="calpage'+(idx<list.length-1?' brk':'')+'">'
        +'<div class="prt-h">'
        +(org?'<div class="prt-org">'+esc(org)+'</div>':'')
        +'<div class="prt-t">'+y+'년 '+m+'월 학사일정</div>'
        +'<div class="prt-d">'+names+'</div></div>'
        +month(y,m,map,'print')
        +'<div class="prt-f">출처 · 대구광역시교육청 「2026학년도 학사일정 현황」 · 자료 판 '+esc(DATA.built)
        +'<br>학교 사정으로 일정이 바뀔 수 있습니다. 중요한 날짜는 학교 공지로 확인해 주십시오.</div></div>';
    });
    if(!h) h='<div class="calpage"><div class="prt-t">인쇄할 일정이 없습니다.</div></div>';
    document.getElementById('print').innerHTML=h;
    setTimeout(function(){ window.print(); },60);
  }

  return {render:render, printCal:printCal, monthTitle:function(){return titleOf(cur);}};
})();
</script>

<script>(function(){
var S=DATA.schools, BK=DATA.books;
var TODAY=new Date(); TODAY.setHours(0,0,0,0);
var LV=['전체','초','중','고','특수','각종'], curLv='전체', curOff='전체', q='', favOnly=false;
var VIEW='list';

/* ---------- 저장소 (막혀 있어도 죽지 않게) ---------- */
var MEM={};
function get(k,d){ try{ var v=localStorage.getItem(k); return v==null?d:JSON.parse(v);}catch(e){ return (k in MEM)?MEM[k]:d; } }
function set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){ MEM[k]=v; } }
var FAV=get('dgcal.fav',[]); if(!Array.isArray(FAV)) FAV=[];
var ORG=get('dgcal.org','');

function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function dt(s){ if(!s) return null; var p=s.split('-'); return new Date(+p[0],+p[1]-1,+p[2]); }
function fmt(s){ if(!s) return null; var d=dt(s); return (d.getMonth()+1)+'월 '+d.getDate()+'일('+'일월화수목금토'[d.getDay()]+')'; }
function fmtS(s){ if(!s) return ''; var d=dt(s); return (d.getMonth()+1)+'/'+d.getDate()+'('+'일월화수목금토'[d.getDay()]+')'; }
function dday(s){ if(!s) return ''; var n=Math.round((dt(s)-TODAY)/86400000);
  var cls=n<0?'dd-done':n<=14?'dd-soon':n<=45?'dd-near':'dd-far';
  return '<span class="dday '+cls+'">'+(n<0?'지남':n===0?'오늘':'D-'+n)+'</span>'; }
function range(a,b){ if(!a) return null; return fmt(a)+(b&&b!==a?' ~ '+fmt(b):''); }
function rangeS(a,b){ if(!a) return ''; return fmtS(a)+(b&&b!==a?'~'+fmtS(b):''); }

/* ---------- 학교 묶기 ---------- */
var GROUP={};
S.forEach(function(s){ var k=s.lvl+'|'+s.name;
  (GROUP[k]=GROUP[k]||{key:k,lvl:s.lvl,name:s.name,off:s.off,est:s.est,typ:s.typ,rows:[]}).rows.push(s); });
var LIST=Object.keys(GROUP).map(function(k){return GROUP[k];});
LIST.sort(function(a,b){return a.name.localeCompare(b.name,'ko');});
var BYKEY={}; LIST.forEach(function(g){ BYKEY[g.key]=g; g.hasBooks=!!BK[g.name]; g.next=nextEvent(g); });

function events(r){ var e=[];
  if(r.ex) ['1학기 중간','1학기 기말','2학기 중간','2학기 기말'].forEach(function(n,i){
    if(r.ex[i]&&r.ex[i][0]) e.push({n:n+'고사',s:r.ex[i][0]}); });
  if(r.ss) e.push({n:'여름방학식',s:r.ss});
  if(r.se) e.push({n:'2학기 개학',s:r.se});
  if(r.ws_) e.push({n:'겨울방학식',s:r.ws_});
  return e; }
function nextEvent(g){ var a=[];
  g.rows.forEach(function(r){ events(r).forEach(function(e){a.push(e);}); });
  a=a.filter(function(e){return dt(e.s)>=TODAY;}).sort(function(x,y){return dt(x.s)-dt(y.s);});
  return a[0]||null; }
var SUBJ=DATA.subjects||{}, RANGE=DATA.ranges||{}, TB=DATA.textbook||{};
function pubOf(name,grade,subject){ var t=(TB[name]||{})[grade]; return (t&&t[subject])||null; }
function subjectsOf(name,grade){
  if(grade==='1') return {'1':['공통수학1'],'2':['공통수학2']};   // 고1은 전국 공통
  var s=SUBJ[name]; return (s&&s[grade])||null;
}
function semesterOf(name,grade,subject,given){
  if(given) return given;                       // 등록된 값이 먼저다
  if(subject==='공통수학1') return '1';
  if(subject==='공통수학2') return '2';
  var sj=subjectsOf(name,grade); if(!sj) return null;
  var in1=(sj['1']||[]).indexOf(subject)>=0, in2=(sj['2']||[]).indexOf(subject)>=0;
  if(in1&&in2) return '12';
  if(in1) return '1';
  if(in2) return '2';
  return null;
}
function semTag(s){
  if(s==='1') return '<span class="sem s1">1학기</span>';
  if(s==='2') return '<span class="sem s2">2학기</span>';
  if(s==='12') return '<span class="sem s1">1·2학기</span>';
  return '';
}
function rangesOf(name,grade){ var s=RANGE[name]; return (s&&s[grade])||null; }
function isFav(g){ return FAV.indexOf(g.key)>=0; }
function toggleFav(g){ var i=FAV.indexOf(g.key); if(i<0) FAV.push(g.key); else FAV.splice(i,1); set('dgcal.fav',FAV); }
function favList(){ return FAV.map(function(k){return BYKEY[k];}).filter(Boolean); }

/* ---------- 목록 ---------- */
function filtered(){
  var kw=q.trim().replace(/\s+/g,'');
  return LIST.filter(function(g){
    if(favOnly && !isFav(g)) return false;
    if(curLv!=='전체' && g.lvl!==curLv) return false;
    if(curOff!=='전체' && g.off!==curOff) return false;
    if(kw && g.name.replace(/\s+/g,'').indexOf(kw)<0) return false;
    return true; });
}
function render(){
  var isCal=(VIEW==='cal');
  document.getElementById('calbox').style.display=isCal?'block':'none';
  document.getElementById('grid').style.display=isCal?'none':'grid';
  if(isCal){
    document.getElementById('empty').style.display='none';
    document.getElementById('cnt').textContent=FAV.length+'개교';
    document.getElementById('favchip').textContent='즐겨찾기'+(FAV.length?' '+FAV.length:'');
    CAL.render(favList());
    return;
  }
  var out=filtered();
  document.getElementById('cnt').textContent=out.length+'개교';
  document.getElementById('favchip').textContent='즐겨찾기'+(FAV.length?' '+FAV.length:'');
  var grid=document.getElementById('grid'), em=document.getElementById('empty');
  if(!out.length){
    grid.innerHTML=''; em.style.display='block';
    em.innerHTML = favOnly&&!FAV.length
      ? '즐겨찾기가 비어 있습니다.<br>학교 카드 오른쪽 위의 별을 누르면 여기에 모입니다.'
      : '찾는 학교가 없습니다. 이름의 일부만 넣어 보십시오.';
    return; }
  em.style.display='none';
  grid.innerHTML=out.slice(0,400).map(function(g){
    return '<div class="card" data-k="'+esc(g.key)+'">'
      +'<button class="star'+(isFav(g)?' on':'')+'" data-star="'+esc(g.key)+'" title="즐겨찾기">'+(isFav(g)?'★':'☆')+'</button>'
      +'<div class="cname">'+esc(g.name)+'</div>'
      +'<div class="ctag"><span class="tag lv">'+esc(g.lvl)+'</span>'
        +(g.off?'<span class="tag">'+esc(g.off)+'</span>':'')
        +(g.typ?'<span class="tag">'+esc(g.typ)+'</span>':'')
        +(g.hasBooks?'<span class="tag bk">부교재</span>':'')+'</div>'
      +(g.next?'<div class="cnext">다음 일정 · <b>'+esc(g.next.n)+'</b> '+fmt(g.next.s)+dday(g.next.s)+'</div>'
              :'<div class="cnext none">남은 일정 없음</div>')
      +'</div>'; }).join('');
  if(out.length>400) grid.insertAdjacentHTML('beforeend','<div class="empty">앞의 400개만 보입니다. 이름을 더 넣어 좁혀 주십시오.</div>');
}

/* ---------- 상세 ---------- */
function open(key){
  var g=BYKEY[key], p=document.getElementById('panel'), gi=0;
  function row(l,v){ return '<tr><td>'+l+'</td><td>'+(v?fmt(v)+dday(v):'<span class="none">-</span>')+'</td></tr>'; }
  function body(){
    var r=g.rows[gi], h='';
    if(g.rows.length>1) h+='<div class="gtab">'+g.rows.map(function(rr,i){
      return '<button data-g="'+i+'" class="'+(i===gi?'on':'')+'">'+esc(rr.grade||'전체')+'학년</button>';}).join('')+'</div>';
    h+='<h3>방학 · 개학</h3><table>'+row('개학일(입학일)',r.open)+row('여름방학식',r.ss)+row('2학기 개학',r.se)
      +row('겨울방학식',r.ws_)+row('학년말 개학',r.we)+row('종업식',r.fin)+row('졸업식',r.grad)+'</table>';
    h+='<h3>정기시험</h3>';
    if(g.lvl==='초'){ h+='<div class="notice">초등학교는 정기시험이 없습니다. 시험 일정이 비어 있는 것이 정상입니다.</div>'; }
    else{
      var names=['1학기 중간','1학기 기말','2학기 중간','2학기 기말'],any=false,t='<table>';
      names.forEach(function(n,i){ var a=r.ex&&r.ex[i]?r.ex[i][0]:null,b=r.ex&&r.ex[i]?r.ex[i][1]:null;
        if(a) any=true;
        t+='<tr><td>'+n+'</td><td>'+(a?range(a,b)+dday(a):'<span class="none">미실시 또는 미기재</span>')+'</td></tr>'; });
      h+=t+'</table>';
      if(!any) h+='<div class="notice" style="margin-top:9px">이 학교는 정기시험 일정이 기재되어 있지 않습니다.</div>';
    }
    // 배우는 과목 · 시험범위 — 학년(1·2·3)마다 다르므로 학교 단위로 따로 낸다
    if(g.lvl==='고'){
      h+='<h3>배우는 과목</h3>';
      var gs=['1','2','3'], anyS=false, ts='<table class="bkrow">';
      gs.forEach(function(gr){
        var sj=subjectsOf(g.name,gr); if(!sj) return; anyS=true;
        var withPub=function(list){
          if(!list||!list.length) return '-';
          return list.map(function(x){ var p=pubOf(g.name,gr,x);
            return esc(x)+(p?' <span class="pub">'+esc(p)+'</span>':''); }).join(' · ');
        };
        ts+='<tr><td>'+gr+'학년</td><td>'
          +'<b>1학기</b> '+withPub(sj['1'])+'<br>'
          +'<b>2학기</b> '+withPub(sj['2'])+'</td></tr>';
      });
      h+=ts+'</table>';
      h+='<div class="hint">회색 표는 <b>교과서 출판사</b>입니다. 1학년은 전국이 같아 자동으로 들어갑니다'
        +(anyS?'':'')+'. 2·3학년은 학교마다 달라 <b>선생님들이 알려 주시는 대로 채워집니다.</b></div>';
      // 시험범위
      var rall=RANGE[g.name];
      h+='<h3>시험범위</h3>';
      if(rall){
        var tr='<table class="bkrow">';
        ['1','2','3'].forEach(function(gr){
          var byEx=rall[gr]; if(!byEx) return;
          ['0','1','2','3'].forEach(function(ei){
            var rr=byEx[ei]; if(!rr||!rr.length) return;
            tr+='<tr><td>'+gr+'학년<div class="hint" style="margin:2px 0 0">'+names[+ei]+'</div></td><td>'
              +rr.map(function(x){ return '<b>'+esc(x[0])+'</b> '+esc(x[1]); }).join('<br>')+'</td></tr>';
          });
        });
        h+=tr+'</table>';
      } else {
        h+='<div class="notice">아직 등록되지 않았습니다. 가정통신문이나 학교 공지로 아시는 범위가 있으면 아래에서 알려 주십시오.</div>';
      }
    }
    var b=BK[g.name];
    if(b){ h+='<h3>학교 부교재</h3><table class="bkrow">';
      Object.keys(b).sort().forEach(function(gr){
        var its=b[gr].items.slice().sort(function(p,q){
          var sp=semesterOf(g.name,gr,p[0],p[2])||'9', sq=semesterOf(g.name,gr,q[0],q[2])||'9';
          return sp<sq?-1:sp>sq?1:0; });
        h+='<tr><td>'+esc(gr)+'학년</td><td>'+its.map(function(x){
          return semTag(semesterOf(g.name,gr,x[0],x[2]))+'<b>'+esc(x[0])+'</b> · '+esc(x[1]);}).join('<br>')
          +(b[gr].note?'<div class="bnote">'+esc(b[gr].note)+'</div>':'')+'</td></tr>'; });
      h+='</table><div class="hint">부교재는 학원 자체 조사분입니다. 학사일정과 출처가 다릅니다.<br>'
        +'<b>학기 표시가 없는 것</b>은 아직 어느 학기 것인지 확인되지 않은 것입니다.</div>'; }
    h+='<h3>수업일수</h3><table><tr><td>1학기</td><td>'+(r.d1||'-')+'일</td></tr>'
      +'<tr><td>2학기</td><td>'+(r.d2||'-')+'일</td></tr>'
      +'<tr><td>합계</td><td>'+(r.dt||'-')+'일</td></tr></table>';
    return h; }
  function draw(){
    p.innerHTML='<div class="ph"><div><h2>'+esc(g.name)+'</h2>'
      +'<div class="ctag"><span class="tag lv">'+esc(g.lvl)+'</span>'
      +(g.off?'<span class="tag">'+esc(g.off)+'</span>':'')
      +(g.typ?'<span class="tag">'+esc(g.typ)+'</span>':'')
      +(g.est?'<span class="tag">'+esc(g.est)+'</span>':'')+'</div></div>'
      +'<button class="btn ghost" id="favb" style="align-self:center">'+(isFav(g)?'★ 해제':'☆ 즐겨찾기')+'</button>'
      +'<button class="x" id="x">×</button></div><div class="pb">'+body()
      +'<div style="margin-top:22px;padding-top:16px;border-top:1px solid var(--line)">'
      +'<button class="btn ghost" id="sugb" style="width:100%;padding:12px">이 학교 정보 고쳐 주기 · 부교재 알려 주기</button>'
      +'<div class="hint" style="text-align:center">바뀐 시험일이나 부교재를 아시면 알려 주십시오. 확인 뒤 모두에게 반영됩니다.</div>'
      +'</div></div>';
    p.querySelectorAll('.gtab button').forEach(function(b){ b.onclick=function(){ gi=+b.dataset.g; draw(); }; });
    document.getElementById('x').onclick=close;
    document.getElementById('favb').onclick=function(){ toggleFav(g); draw(); render(); };
    document.getElementById('sugb').onclick=function(){ SUGGEST.open(g); };
  }
  draw(); document.getElementById('sheet').classList.add('on');
}
function close(){ document.getElementById('sheet').classList.remove('on'); }

/* ---------- 내보내기 ---------- */
function rowsFor(gs){
  var out=[];
  gs.forEach(function(g){ g.rows.forEach(function(r){
    out.push({g:g,r:r,grade:r.grade||'-'}); }); });
  return out;
}
function openExport(){
  var favN=FAV.length, listN=filtered().length;
  var p=document.getElementById('epanel');
  p.innerHTML='<div class="ph"><h2>인쇄 · 내보내기</h2><button class="x" id="ex">×</button></div><div class="pb">'
   +'<label class="fl">인쇄물에 넣을 학원 이름</label>'
   +'<input type="text" id="org" placeholder="예: 수경수학학원" value="'+esc(ORG)+'">'
   +'<div class="hint">비워 두면 학원 이름 없이 나갑니다. 한 번 넣으면 이 브라우저에 기억해 둡니다.</div>'
   +'<label class="fl">무엇을 낼까요</label><div class="radio">'
   +'<label><input type="radio" name="tgt" value="fav"'+(favN?' checked':' disabled')+'> 즐겨찾기 '+favN+'개교'+(favN?'':' (비어 있음)')+'</label>'
   +'<label><input type="radio" name="tgt" value="cur"'+(favN?'':' checked')+'> 지금 보이는 목록 '+listN+'개교</label></div>'
   +'<label class="fl">담을 것</label><div class="checks">'
   +'<label><input type="checkbox" id="c1" checked> 방학 · 개학</label>'
   +'<label><input type="checkbox" id="c2" checked> 정기시험</label>'
   +'<label><input type="checkbox" id="c3" checked> 부교재</label>'
   +'<label><input type="checkbox" id="c4"> 배우는 과목 · 시험범위</label></div>'
   +'<div class="hint">부교재만 뽑으시려면 앞의 둘을 끄시면 됩니다. 학사일정 표는 빠지고 부교재 표만 나옵니다.</div>'
   +'<label class="fl">어떤 모양으로</label><div class="radio">'
   +'<label><input type="radio" name="fm" value="table" checked> 표 — 학교마다 한 줄</label>'
   +'<label><input type="radio" name="fm" value="cal"'+(favN?'':' disabled')+'> 달력 — 한 달에 한 쪽'
   +(favN?'':' (즐겨찾기가 필요합니다)')+'</label></div>'
   +'<div class="hint" id="fmhint"></div>'
   +'<div class="acts"><button class="btn" id="doPdf">PDF로 인쇄</button>'
   +'<button class="btn ghost" id="doXls">엑셀 내려받기</button></div>'
   +'<div class="hint">PDF는 인쇄 창에서 «대상»을 «PDF로 저장»으로 고르시면 됩니다. <b>A4 가로</b>로 맞춰 두었습니다.</div></div>';
  document.getElementById('ex').onclick=closeExport;
  p.querySelectorAll('input[name=fm]').forEach(function(r){
    r.onchange=function(){
      document.getElementById('fmhint').innerHTML = r.value==='cal'
        ? '달력은 <b>즐겨찾기한 학교</b>로만 그립니다. 일정이 있는 달만 나옵니다.'
        : ''; };
  });
  document.getElementById('doPdf').onclick=function(){ go('pdf'); };
  document.getElementById('doXls').onclick=function(){ go('xls'); };
  document.getElementById('esheet').classList.add('on');
  function go(kind){
    ORG=document.getElementById('org').value.trim(); set('dgcal.org',ORG);
    var t=p.querySelector('input[name=tgt]:checked').value;
    var gs = t==='fav' ? favList() : filtered();
    var opt={sum:document.getElementById('c1').checked, ex:document.getElementById('c2').checked,
             bk:document.getElementById('c3').checked, sr:document.getElementById('c4').checked};
    if(!opt.sum && !opt.ex && !opt.bk && !opt.sr){ alert('담을 것을 하나 이상 골라 주십시오.'); return; }
    if(!gs.length){ alert('낼 학교가 없습니다.'); return; }
    closeExport();
    var fm=(p.querySelector('input[name=fm]:checked')||{}).value||'table';
    if(kind==='pdf'){ if(fm==='cal') CAL.printCal(favList(), ORG, false); else doPrint(gs,opt); }
    else doExcel(gs,opt);
  }
}
function closeExport(){ document.getElementById('esheet').classList.remove('on'); }

function today(){ var d=new Date();
  return d.getFullYear()+'년 '+(d.getMonth()+1)+'월 '+d.getDate()+'일'; }

function doPrint(gs,opt){
  var rows=rowsFor(gs);
  var titles=[];
  if(opt.sum||opt.ex) titles.push('학사일정 · 정기시험');
  if(opt.bk) titles.push('부교재');
  if(opt.sr) titles.push('배우는 과목 · 시험범위');
  var h='<div class="prt-h">'
    +(ORG?'<div class="prt-org">'+esc(ORG)+'</div>':'')
    +'<div class="prt-t">2026학년도 '+titles.join(' · ')+'</div>'
    +'<div class="prt-d">'+today()+' 기준 · '+gs.length+'개교</div></div>';
  if(opt.sum||opt.ex){
    var cols=[{t:'학교',w:'15%'},{t:'학년',w:'5%'}];
    if(opt.sum) cols=cols.concat([{t:'여름방학',w:'8%'},{t:'2학기 개학',w:'8%'},{t:'겨울방학',w:'8%'}]);
    if(opt.ex) cols=cols.concat([{t:'1학기 중간',w:'11%'},{t:'1학기 기말',w:'11%'},{t:'2학기 중간',w:'11%'},{t:'2학기 기말',w:'11%'}]);
    h+='<table class="prt"><colgroup>'+cols.map(function(c){return '<col style="width:'+c.w+'">';}).join('')+'</colgroup>'
      +'<thead><tr>'+cols.map(function(c){return '<th>'+c.t+'</th>';}).join('')+'</tr></thead><tbody>';
    rows.forEach(function(x){
      var r=x.r, td=[];
      td.push('<td class="l prt-name">'+esc(x.g.name)+'</td>');
      td.push('<td>'+esc(x.grade)+'</td>');
      if(opt.sum){ td.push('<td>'+(fmtS(r.ss)||'<span class="prt-none">-</span>')+'</td>');
                   td.push('<td>'+(fmtS(r.se)||'<span class="prt-none">-</span>')+'</td>');
                   td.push('<td>'+(fmtS(r.ws_)||'<span class="prt-none">-</span>')+'</td>'); }
      if(opt.ex){ for(var i=0;i<4;i++){
        var a=r.ex&&r.ex[i]?r.ex[i][0]:null, b=r.ex&&r.ex[i]?r.ex[i][1]:null;
        td.push('<td>'+(a?rangeS(a,b):'<span class="prt-none">'+(x.g.lvl==='초'?'시험 없음':'-')+'</span>')+'</td>'); } }
      h+='<tr>'+td.join('')+'</tr>'; });
    h+='</tbody></table>';
  }
  if(opt.bk){
    var bl=gs.filter(function(g){return BK[g.name];});
    if(bl.length){
      h+='<div class="prt-sec">학교 부교재</div><table class="prt">'
       +'<colgroup><col style="width:18%"><col style="width:7%"><col style="width:75%"></colgroup>'
       +'<thead><tr><th>학교</th><th>학년</th><th>부교재</th></tr></thead><tbody>';
      bl.forEach(function(g){ var b=BK[g.name];
        Object.keys(b).sort().forEach(function(gr){
          h+='<tr><td class="l prt-name">'+esc(g.name)+'</td><td>'+esc(gr)+'</td><td class="l">'
            +b[gr].items.map(function(x){
              var s=semesterOf(g.name,gr,x[0],x[2]);
              return (s?('['+(s==='12'?'1·2학기':s+'학기')+'] '):'')+esc(x[0])+' · '+esc(x[1]);}).join('   /   ')
            +(b[gr].note?'   ('+esc(b[gr].note)+')':'')+'</td></tr>'; }); });
      h+='</tbody></table>';
    }
  }
  if(opt.sr){
    var sl=gs.filter(function(g){ return g.lvl==='고'; });
    var trs='';
    sl.forEach(function(g){
      ['1','2','3'].forEach(function(gr){
        var sj=subjectsOf(g.name,gr);
        if(sj) trs+='<tr><td class="l prt-name">'+esc(g.name)+'</td><td>'+gr+'</td><td>배우는 과목</td>'
          +'<td class="l">1학기 '+esc((sj['1']||[]).join(' · ')||'-')+'   /   2학기 '+esc((sj['2']||[]).join(' · ')||'-')+'</td></tr>';
        var byEx=(RANGE[g.name]||{})[gr];
        if(byEx) ['0','1','2','3'].forEach(function(ei){
          var rr=byEx[ei]; if(!rr||!rr.length) return;
          trs+='<tr><td class="l prt-name">'+esc(g.name)+'</td><td>'+gr+'</td><td>'+['1학기 중간','1학기 기말','2학기 중간','2학기 기말'][+ei]+'</td>'
            +'<td class="l">'+rr.map(function(x){return esc(x[0])+' : '+esc(x[1]);}).join('   /   ')+'</td></tr>';
        });
      });
    });
    h+='<div class="prt-sec">배우는 과목 · 시험범위</div>';
    if(trs){
      h+='<table class="prt"><colgroup><col style="width:18%"><col style="width:6%"><col style="width:12%"><col style="width:64%"></colgroup>'
       +'<thead><tr><th>학교</th><th>학년</th><th>구분</th><th>내용</th></tr></thead><tbody>'+trs+'</tbody></table>';
    } else {
      h+='<div style="font-size:8.6pt;color:#666;padding:4pt 0">아직 등록된 것이 없습니다. 선생님들이 알려 주시는 대로 채워집니다.</div>';
    }
  }
  h+='<div class="prt-f">출처 · 대구광역시교육청 「'+esc(DATA.src)+'」'
    +(opt.bk?' / 부교재는 학원 자체 조사분으로 출처가 다릅니다.':'')
    +'<br>학교 사정으로 일정이 바뀔 수 있습니다. 중요한 날짜는 학교 공지로 확인해 주십시오.</div>';
  document.getElementById('print').innerHTML=h;
  setTimeout(function(){ window.print(); },60);
}

function doExcel(gs,opt){
  var head=['학교','학교급','지원청','학년'];
  if(opt.sum) head=head.concat(['개학일','여름방학식','2학기 개학','겨울방학식','학년말 개학','종업식','졸업식']);
  if(opt.ex) head=head.concat(['1학기 중간 시작','1학기 중간 종료','1학기 기말 시작','1학기 기말 종료',
                               '2학기 중간 시작','2학기 중간 종료','2학기 기말 시작','2학기 기말 종료']);
  if(opt.bk) head=head.concat(['부교재']);
  if(opt.sr) head=head.concat(['배우는 과목(1학기)','배우는 과목(2학기)']);
  var aoa=[head];
  rowsFor(gs).forEach(function(x){
    var r=x.r, o=[x.g.name,x.g.lvl,x.g.off,x.grade];
    if(opt.sum) o=o.concat([r.open,r.ss,r.se,r.ws_,r.we,r.fin,r.grad].map(function(v){return v||'';}));
    if(opt.ex){ for(var i=0;i<4;i++){ var e=r.ex&&r.ex[i]?r.ex[i]:[null,null];
      o.push(e[0]||''); o.push(e[1]||''); } }
    if(opt.bk){ var b=BK[x.g.name], gr=x.grade, s='';
      if(b&&b[gr]) s=b[gr].items.map(function(y){return y[0]+' · '+y[1];}).join(' / ')+(b[gr].note?' ('+b[gr].note+')':'');
      o.push(s); }
    if(opt.sr){ var sj=subjectsOf(x.g.name,x.grade);
      o.push(sj&&sj['1']?sj['1'].join(' / '):''); o.push(sj&&sj['2']?sj['2'].join(' / '):''); }
    aoa.push(o); });
  var base=(ORG?ORG+'_':'')+'2026학사일정_'+new Date().toISOString().slice(0,10)+'.xlsx';
  var widths=head.map(function(h){ return h==='학교'?24:(h==='부교재'?48:(h.indexOf('시작')>0||h.indexOf('종료')>0?13:12)); });
  try{ MiniXlsx.download(aoa,widths,base,'학사일정'); }
  catch(e){
    var csv='\ufeff'+aoa.map(function(r){ return r.map(function(c){
      c=String(c==null?'':c); return /[",\n]/.test(c)?'"'+c.replace(/"/g,'""')+'"':c; }).join(','); }).join('\r\n');
    var a=document.createElement('a');
    a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));
    a.download=base.replace(/\.xlsx$/,'.csv'); a.click();
    setTimeout(function(){URL.revokeObjectURL(a.href);},1500);
  }
}

document.onkeydown=function(e){
  if(e.key!=='Escape') return;
  // 맨 위에 열린 것 하나만 닫는다 (제안 창을 닫았는데 학교 창까지 닫히면 안 된다)
  var order=[['ssheet',SUGGEST.close],['hsheet',HELP.close],['esheet',closeExport],['sheet',close]];
  for(var i=0;i<order.length;i++){
    if(document.getElementById(order[i][0]).classList.contains('on')){ order[i][1](); return; }
  }
};
document.getElementById('hsheet').onclick=function(e){ if(e.target.id==='hsheet') HELP.close(); };
document.getElementById('ssheet').onclick=function(e){ if(e.target.id==='ssheet') SUGGEST.close(); };
document.getElementById('foot').innerHTML=
  '출처 · 대구광역시교육청 「'+esc(DATA.src)+'」 · 학교 '+LIST.length+'곳 수록<br>'
  +'부교재는 학원 자체 조사분(고등 '+Object.keys(BK).length+'개교)이며 학사일정과 출처가 다릅니다.<br>'
  +'즐겨찾기는 이 브라우저에만 저장됩니다. 다른 기기에서는 따로 담으셔야 합니다.<br>'
  +'학교 사정으로 일정이 바뀔 수 있습니다. 중요한 날짜는 학교 공지로 확인해 주십시오.<br>'
  +'<b style="color:var(--ink2)">자료 판 '+esc(DATA.built)+'</b> · 이 주소는 늘 최신본이 열립니다. 옛것이 보이면 새로고침(F5)을 눌러 주십시오.';
render();
})();
</script>
